<style id="lockStyle">
  :root{ --bg:#12161A; --panel:#1B2126; --border:#2B333A; --text:#E7E4DC; --dim:#8E99A1; --amber:#E0A82E; --ink:#12161A; --bad:#ff8a80; color-scheme:dark; }
  html[data-theme="light"]{ --bg:#D7DDE1; --panel:#F8F9F9; --border:#A7B2BA; --text:#0D1317; --dim:#44515A; --amber:#C98A0C; --bad:#981D17; color-scheme:light; }
  *{box-sizing:border-box;} html,body{margin:0;padding:0;}
  body{background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif; min-height:100vh;}
  #lock{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:calc(24px + env(safe-area-inset-top,0px)) 22px 24px;}
  .lock-card{width:100%; max-width:380px;}
  .lock-ico{width:56px; height:56px; border-radius:15px; background:var(--panel); border:1px solid var(--border); color:var(--amber); display:flex; align-items:center; justify-content:center; margin-bottom:18px;}
  .lock-title{font-size:26px; font-weight:800; letter-spacing:-.015em; margin:0 0 6px;}
  .lock-sub{font-size:15px; line-height:1.45; color:var(--dim); margin:0 0 20px;}
  .lock-row{position:relative;}
  #lockPw{width:100%; min-height:54px; border-radius:12px; border:1px solid var(--border); background:var(--panel); color:var(--text); font-size:17px; padding:12px 74px 12px 14px; outline:none; font-family:inherit;}
  #lockPw:focus{border-color:var(--amber); box-shadow:0 0 0 3px rgba(224,168,46,.18);}
  #lockShow{position:absolute; right:6px; top:50%; transform:translateY(-50%); height:42px; padding:0 12px; border:none; background:transparent; color:var(--dim); font-size:14px; font-weight:700; font-family:inherit; cursor:pointer;}
  #lockBtn{width:100%; min-height:54px; margin-top:12px; border:none; border-radius:12px; background:var(--amber); color:var(--ink); font-size:17px; font-weight:800; font-family:inherit; cursor:pointer;}
  #lockBtn:disabled{opacity:.6;}
  .lock-msg{min-height:22px; margin:12px 2px 0; font-size:14px; line-height:1.4; color:var(--dim);}
  .lock-bad{color:var(--bad);}
</style>

<script>
(function(){
  var CFG = {"salt":"inmLt2kPZA9RbMufaqTNVQ==","iter":1000000,"iv":"8H3FQG0ORo2DsoHm"};
  var KEY_STORE = "fieldProcedures.lockKey.v1";
  var lock = document.getElementById("lock"), form = document.getElementById("lockForm"), input = document.getElementById("lockPw"),
      btn = document.getElementById("lockBtn"), msg = document.getElementById("lockMsg"), show = document.getElementById("lockShow");
  try{ if(localStorage.getItem("fieldProcedures.theme.v1") === "light") document.documentElement.setAttribute("data-theme", "light"); } catch(e){}

  function b64ToBytes(b){ var s = atob(b), a = new Uint8Array(s.length); for(var i = 0; i < s.length; i++) a[i] = s.charCodeAt(i); return a; }
  function bytesToB64(a){ var s = ""; for(var i = 0; i < a.length; i++) s += String.fromCharCode(a[i]); return btoa(s); }
  function norm(p){ return String(p || "").toLowerCase().replace(/[^a-z0-9]/g, ""); }
  function say(text, bad){ msg.textContent = text; msg.className = bad ? "lock-msg lock-bad" : "lock-msg"; }
  function showLock(){ lock.hidden = false; }
  function decryptWith(key){
    var data = b64ToBytes(document.getElementById("fp-payload").textContent.replace(/\s+/g, ""));
    return crypto.subtle.decrypt({ name:"AES-GCM", iv:b64ToBytes(CFG.iv) }, key, data)
      .then(function(buf){ return JSON.parse(new TextDecoder().decode(buf)); });
  }
  function keyFromPassword(pw){
    return crypto.subtle.importKey("raw", new TextEncoder().encode(norm(pw)), "PBKDF2", false, ["deriveKey"]).then(function(base){
      return crypto.subtle.deriveKey({ name:"PBKDF2", salt:b64ToBytes(CFG.salt), iterations:CFG.iter, hash:"SHA-256" }, base, { name:"AES-GCM", length:256 }, true, ["decrypt"]);
    });
  }
  function mount(app){
    var st = document.createElement("style"); st.textContent = app.css; document.head.appendChild(st);
    var ls = document.getElementById("lockStyle"); if(ls) ls.remove();
    var pl = document.getElementById("fp-payload"); if(pl) pl.remove();
    lock.remove();
    document.body.insertAdjacentHTML("afterbegin", app.body);
    var sc = document.createElement("script"); sc.textContent = app.js; document.body.appendChild(sc);
  }

  if(!(window.crypto && crypto.subtle)){
    showLock(); btn.disabled = true; input.disabled = true;
    say("This browser can't open the locked board from here. Open it from its web address instead.", true);
    return;
  }

  // Already unlocked on this phone? Open straight away. (If the password was changed, ask again.)
  var saved = null; try{ saved = localStorage.getItem(KEY_STORE); } catch(e){}
  var start = saved
    ? crypto.subtle.importKey("raw", b64ToBytes(saved), { name:"AES-GCM" }, true, ["decrypt"]).then(decryptWith).then(mount)
    : Promise.reject(new Error("no saved key"));
  start.catch(function(){
    try{ localStorage.removeItem(KEY_STORE); } catch(e){}
    if(saved) say("The password has changed. Enter the new one.", false);
    showLock();
  });

  show.addEventListener("click", function(){
    var on = input.type === "password"; input.type = on ? "text" : "password"; show.textContent = on ? "Hide" : "Show"; input.focus();
  });
  function tryUnlock(){
    if(!norm(input.value)){ say("Type the password first.", true); return; }
    btn.disabled = true; btn.textContent = "Unlocking…"; say("", false);
    var theKey;
    keyFromPassword(input.value).then(function(k){ theKey = k; return decryptWith(k); }).then(function(app){
      return crypto.subtle.exportKey("raw", theKey).then(function(raw){
        try{ localStorage.setItem(KEY_STORE, bytesToB64(new Uint8Array(raw))); } catch(e){}
        mount(app);
      });
    }).catch(function(){
      btn.disabled = false; btn.textContent = "Unlock";
      say("That password didn't work. Check it and try again.", true);
      input.select();
    });
  }
  btn.addEventListener("click", tryUnlock);
  input.addEventListener("keydown", function(e){ if(e.key === "Enter"){ e.preventDefault(); tryUnlock(); } });
})();
</script>

  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch((err) => {
      console.error("Service worker registration failed:", err);
    });
  });
}
