<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover">
<title>Field Procedures — Valve Board</title>
<link rel="manifest" href="index.json">
<meta name="theme-color" content="#12161A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Field Ops">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<style>
  :root{
    --bg: #12161A;
    --panel: #1B2126;
    --panel-2: #20272D;
    --border: #2B333A;
    --text: #E7E4DC;
    --text-dim: #8E99A1;
    --amber: #E0A82E;
    --amber-dim: #6b5620;
    --red: #C8372E;
    --red-glow: rgba(200,55,46,0.45);
    --green: #3E8E52;
    --green-glow: rgba(62,142,82,0.4);
    --yellow: #E0A82E;
    --yellow-glow: rgba(224,168,46,0.45);
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Roboto Mono", monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    /* text-on-tint colors and surfaces that differ between night and daylight */
    --amber-ink: #E0A82E;
    --amber-text: #ffd77a;
    --red-text: #ff8a80;
    --green-text: #8ee6a2;
    --on-amber: #12161A;
    --bg-glow: #1a2128;
    --header-bg: #10151A;
    --header-bg-fade: #10151Ae0;
    --raised: #1B2126;
    --lit-amber-bd: rgba(224,168,46,0.60); --lit-amber-a: rgba(224,168,46,0.16); --lit-amber-b: rgba(224,168,46,0.04);
    --lit-red-bd: rgba(224,71,60,0.75);    --lit-red-a: rgba(200,55,46,0.26);    --lit-red-b: rgba(200,55,46,0.07);
    --lit-green-bd: rgba(62,142,82,0.60);  --lit-green-a: rgba(62,142,82,0.18);  --lit-green-b: rgba(62,142,82,0.04);
    color-scheme: dark;
  }
  /* Daylight: brushed-steel background, engraved-black text. Built for direct sun. */
  html[data-theme="light"]{
    --bg: #D7DDE1;
    --panel: #F8F9F9;
    --panel-2: #EBEEF0;
    --border: #A7B2BA;
    --text: #0D1317;
    --text-dim: #44515A;
    --amber: #C98A0C;
    --amber-dim: #C9A24A;
    --amber-ink: #7A4E00;
    --amber-text: #6B4400;
    --red: #B3261E;
    --red-text: #981D17;
    --red-glow: rgba(179,38,30,0.25);
    --green: #1F7A3D;
    --green-text: #145C2B;
    --green-glow: rgba(31,122,61,0.25);
    --yellow: #C98A0C;
    --yellow-glow: rgba(201,138,12,0.30);
    --bg-glow: #E8ECEF;
    --header-bg: #D7DDE1;
    --header-bg-fade: #D7DDE1e0;
    --raised: #F8F9F9;
    --lit-amber-bd: #C98A0C; --lit-amber-a: rgba(224,160,30,0.30); --lit-amber-b: rgba(224,160,30,0.10);
    --lit-red-bd: #B3261E;   --lit-red-a: rgba(200,55,46,0.22);   --lit-red-b: rgba(200,55,46,0.07);
    --lit-green-bd: #1F7A3D; --lit-green-a: rgba(31,122,61,0.20); --lit-green-b: rgba(31,122,61,0.06);
    color-scheme: light;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1200px 600px at 50% -10%, var(--bg-glow) 0%, var(--bg) 55%);
    color:var(--text);
    font-family:var(--sans);
    min-height:100vh;
    padding-bottom:60px;
  }
  /* ---- header / rail ---- */
  header{
    position:sticky; top:0; z-index:20;
    background:linear-gradient(180deg, var(--header-bg) 0%, var(--header-bg-fade) 100%);
    backdrop-filter: blur(6px);
    border-bottom:1px solid var(--border);
    padding:calc(18px + env(safe-area-inset-top, 0px)) calc(18px + env(safe-area-inset-right, 0px)) 14px calc(18px + env(safe-area-inset-left, 0px));
  }
  /* A dark strip behind the phone's status bar, so the clock and battery stay readable in daylight mode too. */
  header::before{
    content:""; position:absolute; top:0; left:0; right:0;
    height:env(safe-area-inset-top, 0px);
    background:#0B0E11;
  }
  .brand{
    display:flex; align-items:center; gap:10px;
    margin-bottom:14px;
  }
  .brand .dot{
    width:10px;height:10px;border-radius:50%;
    background:var(--amber);
    box-shadow:0 0 10px 2px var(--yellow-glow);
    flex-shrink:0;
  }
  .brand h1{
    font-family:var(--mono);
    font-size:13px;
    letter-spacing:.18em;
    text-transform:uppercase;
    color:var(--text-dim);
    margin:0;
    font-weight:600;
  }
  .brand h1 b{color:var(--text); font-weight:700;}

  .search-wrap{position:relative;}
  .search-wrap svg{
    position:absolute; left:14px; top:50%; transform:translateY(-50%);
    opacity:.55; pointer-events:none;
  }
  #search{
    width:100%;
    background:var(--panel);
    border:1px solid var(--border);
    color:var(--text);
    font-family:var(--sans);
    font-size:16px;
    padding:13px 14px 13px 42px;
    border-radius:10px;
    outline:none;
    transition:border-color .15s, box-shadow .15s;
  }
  #search::placeholder{color:var(--text-dim);}
  #search:focus{
    border-color:var(--amber);
    box-shadow:0 0 0 3px rgba(224,168,46,0.15);
  }
  .result-count{
    font-family:var(--mono);
    font-size:11px;
    color:var(--text-dim);
    letter-spacing:.05em;
    margin-top:8px;
    padding-left:2px;
  }

  main{max-width:720px; margin:0 auto; padding:18px;}

  /* ---- procedure card ---- */
  .card{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:12px;
    margin-bottom:14px;
    overflow:hidden;
  }
  .card-head{
    display:flex; align-items:center; gap:12px;
    padding:16px 16px;
    cursor:pointer;
    user-select:none;
  }
  .chevron{
    width:18px;height:18px;flex-shrink:0;
    color:var(--text-dim);
    transition:transform .2s ease;
  }
  .card.open .chevron{transform:rotate(90deg); color:var(--amber-ink);}
  .card-title-wrap{flex:1; min-width:0;}
  .card-title{
    font-size:16.5px; font-weight:700; margin:0 0 4px;
    color:var(--text);
    letter-spacing:.01em;
  }
  .card-title mark{
    background:rgba(224,168,46,0.28);
    color:var(--text);
    border-radius:3px;
    padding:0 1px;
  }
  .tags{display:flex; gap:6px; flex-wrap:wrap;}
  .tag{
    font-family:var(--mono);
    font-size:10px;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:var(--text-dim);
    border:1px solid var(--border);
    border-radius:5px;
    padding:2px 6px;
  }
  .progress-mini{
    font-family:var(--mono);
    font-size:12px;
    color:var(--text-dim);
    text-align:right;
    flex-shrink:0;
    min-width:52px;
  }
  .progress-mini b{color:var(--text);}

  .progress-track{
    height:3px; width:100%;
    background:var(--border);
    display:flex; gap:2px;
  }
  .progress-track i{
    flex:1; background:transparent; border-radius:1px;
    transition:background .2s;
  }
  .progress-track i.done{background:var(--amber);}

  .card-body{
    max-height:0;
    overflow:hidden;
    transition:max-height .25s ease;
  }
  .card.open .card-body{max-height:none;}

  .body-inner{padding:6px 16px 18px;}

  .notify-line{
    display:flex; gap:10px; align-items:flex-start;
    padding:12px 12px;
    margin:8px 0 14px;
    background:rgba(224,168,46,0.08);
    border:1px solid var(--amber-dim);
    border-radius:8px;
    font-size:14px;
    line-height:1.4;
  }
  .notify-line svg{flex-shrink:0; margin-top:1px; color:var(--amber-ink);}

  .step{
    display:flex; align-items:flex-start; gap:12px;
    padding:11px 4px;
    border-top:1px solid var(--border);
  }
  .step:first-of-type{border-top:none;}
  .step.done .step-text{color:var(--text-dim); text-decoration:line-through; text-decoration-color:var(--border);}

  .check{
    width:22px; height:22px; flex-shrink:0; margin-top:1px;
    border-radius:50%;
    border:2px solid var(--border);
    background:transparent;
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    transition:border-color .15s, background .15s;
    padding:0;
  }
  .check:hover{border-color:var(--amber);}
  .check svg{opacity:0; transition:opacity .12s; width:13px;height:13px;}
  .step.done .check{background:var(--amber); border-color:var(--amber);}
  .step.done .check svg{opacity:1; color:var(--on-amber);}

  .step-main{flex:1; min-width:0;}
  .step-row{display:flex; align-items:flex-start; gap:8px; flex-wrap:wrap;}
  .step-text{font-size:14.5px; line-height:1.45;}
  .step-num{
    font-family:var(--mono); font-size:11px; color:var(--text-dim);
    margin-right:2px;
  }
  .bell-icon{
    display:inline-flex; vertical-align:-2px; margin-right:5px; color:var(--amber-ink);
  }
  .bell-icon svg{width:13px;height:13px;}

  .badge{
    display:inline-flex; align-items:center; gap:5px;
    font-family:var(--mono); font-size:10.5px; letter-spacing:.05em;
    text-transform:uppercase; font-weight:700;
    padding:3px 8px; border-radius:20px;
    white-space:nowrap;
    margin-top:2px;
  }
  .badge .lamp{width:7px;height:7px;border-radius:50%;}
  .badge.open{background:rgba(200,55,46,0.14); color:var(--red-text); border:1px solid rgba(200,55,46,0.4);}
  .badge.open .lamp{background:var(--red); box-shadow:0 0 6px 1px var(--red-glow);}
  .badge.closed{background:rgba(62,142,82,0.14); color:var(--green-text); border:1px solid rgba(62,142,82,0.4);}
  .badge.closed .lamp{background:var(--green); box-shadow:0 0 6px 1px var(--green-glow);}
  .badge.transition{background:rgba(224,168,46,0.14); color:var(--amber-text); border:1px solid rgba(224,168,46,0.4);}
  .badge.transition .lamp{background:var(--yellow); box-shadow:0 0 6px 1px var(--yellow-glow); animation:pulse 1.4s infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.35;}}

  .warning{
    display:flex; gap:8px; align-items:flex-start;
    font-size:12.5px; color:var(--amber-text);
    background:rgba(224,168,46,0.06);
    border-left:2px solid var(--amber);
    padding:8px 10px; margin-top:8px; border-radius:0 6px 6px 0;
    line-height:1.4;
  }
  .warning svg{flex-shrink:0; margin-top:1px;}

  .card-footer{
    display:flex; justify-content:space-between; align-items:center;
    padding-top:14px; margin-top:6px; border-top:1px solid var(--border);
  }
  .footer-note{font-size:11.5px; color:var(--text-dim); font-family:var(--mono);}
  .reset-btn{
    display:flex; align-items:center; gap:6px;
    background:transparent;
    border:1px solid var(--border);
    color:var(--text-dim);
    font-family:var(--sans);
    font-size:12.5px;
    padding:7px 12px;
    border-radius:7px;
    cursor:pointer;
    transition:border-color .15s, color .15s;
  }
  .reset-btn:hover{border-color:var(--amber); color:var(--amber-ink);}
  .reset-btn svg{width:13px;height:13px;}

  .field-row{
    padding:14px 4px;
    border-top:1px solid var(--border);
  }
  .field-row:first-of-type{border-top:none;}
  .field-label{
    display:block;
    font-size:14.5px;
    font-weight:600;
    margin-bottom:8px;
    line-height:1.4;
  }
  .paren{
    display:inline-block;
    color:var(--amber-ink);
    font-weight:700;
    background:rgba(224,168,46,0.12);
    border:1px solid rgba(224,168,46,0.35);
    border-radius:5px;
    padding:1px 7px;
    font-size:12.5px;
    letter-spacing:.02em;
  }
  .field-input{
    width:100%;
    background:var(--panel-2);
    border:1px solid var(--border);
    color:var(--text);
    font-family:var(--sans);
    font-size:16px;
    padding:11px 12px;
    border-radius:8px;
    outline:none;
    transition:border-color .15s, box-shadow .15s;
  }
  .field-input::placeholder{color:var(--text-dim);}
  .field-input:focus{
    border-color:var(--amber);
    box-shadow:0 0 0 3px rgba(224,168,46,0.15);
  }

  /* ---- pig in/out table ---- */
  .pig-body-inner{padding:6px 0 18px;}
  .pig-table-wrap{
    overflow-x:auto;
    -webkit-overflow-scrolling:touch;
    padding:0 16px;
  }
  .pig-table{
    border-collapse:collapse;
    width:100%;
    min-width:400px;
  }
  .pig-table thead th{
    position:sticky; top:0; z-index:2;
    background:var(--panel);
    font-family:var(--mono);
    font-size:10px;
    letter-spacing:.05em;
    text-transform:uppercase;
    color:var(--text-dim);
    font-weight:600;
    text-align:center;
    padding:8px 4px 10px;
    border-bottom:1px solid var(--border);
    white-space:nowrap;
  }
  .pig-line-col{
    position:sticky; left:0; z-index:1;
    background:var(--panel);
    text-align:left !important;
    padding-left:2px !important;
    min-width:84px;
  }
  .pig-table thead th.pig-line-col{z-index:3;}
  .pig-section-row td{
    background:var(--panel-2);
    padding:7px 10px;
    border-top:1px solid var(--border);
    border-bottom:1px solid var(--border);
    position:sticky; left:0;
  }
  .pig-section-row.new-group td{padding-top:12px;}
  .pig-group{
    display:block;
    font-family:var(--mono);
    font-size:10.5px;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:var(--amber-ink);
    font-weight:700;
    margin-bottom:2px;
  }
  .pig-sub{
    font-family:var(--mono);
    font-size:10px;
    letter-spacing:.05em;
    text-transform:uppercase;
    color:var(--text-dim);
  }
  .pig-table tbody tr:not(.pig-section-row){border-top:1px solid var(--border);}
  .pig-line-label{font-size:13.5px; font-weight:700; white-space:nowrap;}
  .pig-size{font-family:var(--mono); font-size:11px; color:var(--text-dim); font-weight:500;}
  .pig-tag{
    display:block;
    font-family:var(--mono);
    font-size:9.5px;
    letter-spacing:.03em;
    color:var(--amber-ink);
    background:rgba(224,168,46,0.12);
    border:1px solid rgba(224,168,46,0.3);
    border-radius:4px;
    padding:1px 5px;
    margin-top:3px;
    white-space:nowrap;
    width:fit-content;
  }
  .pig-cell{text-align:center; padding:8px 6px; vertical-align:middle;}
  .pig-bubble{
    width:24px; height:24px;
    border-radius:50%;
    border:2px solid var(--border);
    background:transparent;
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    padding:0; margin:0 auto;
    transition:border-color .15s, background .15s;
  }
  .pig-bubble:hover{border-color:var(--yellow);}
  .pig-bubble svg{width:12px;height:12px; color:var(--on-amber);}
  .pig-bubble.filled{background:var(--yellow); border-color:var(--yellow);}
  .pig-time{
    font-family:var(--mono);
    font-size:9px;
    color:var(--text-dim);
    margin-top:3px;
    white-space:nowrap;
  }

  /* ---- well search ---- */
  .well-search-box{position:relative; margin:4px 0 12px;}
  .well-search-box svg{
    position:absolute; left:12px; top:50%; transform:translateY(-50%);
    opacity:.5; pointer-events:none;
  }
  .well-input{
    width:100%;
    background:var(--panel-2);
    border:1px solid var(--border);
    color:var(--text);
    font-family:var(--sans);
    font-size:16px;
    padding:11px 12px 11px 36px;
    border-radius:8px;
    outline:none;
    transition:border-color .15s, box-shadow .15s;
  }
  .well-input::placeholder{color:var(--text-dim);}
  .well-input:focus{
    border-color:var(--amber);
    box-shadow:0 0 0 3px rgba(224,168,46,0.15);
  }
  .well-hint{
    font-size:13px; color:var(--text-dim);
    padding:10px 2px; margin:0;
    line-height:1.5;
  }
  .well-row{
    padding:12px; margin-bottom:8px;
    background:var(--panel-2);
    border:1px solid var(--border);
    border-radius:9px;
  }
  .well-row-top{display:flex; align-items:center; justify-content:space-between; gap:8px;}
  .well-name{font-family:var(--mono); font-size:15px; font-weight:700;}
  .well-cat{
    font-family:var(--mono); font-size:9.5px; letter-spacing:.05em; text-transform:uppercase;
    font-weight:700; padding:2px 7px; border-radius:20px; white-space:nowrap;
  }
  .well-cat-active{background:rgba(62,142,82,0.14); color:var(--green-text); border:1px solid rgba(62,142,82,0.4);}
  .well-cat-obs{background:rgba(224,168,46,0.14); color:var(--amber-text); border:1px solid rgba(224,168,46,0.4);}
  .well-cat-plugged{background:rgba(142,153,161,0.14); color:var(--text-dim); border:1px solid var(--border);}
  .well-coords{
    font-family:var(--mono); font-size:12px; color:var(--text-dim);
    margin-top:6px;
  }
  .well-field{
    font-family:var(--mono); font-size:10.5px; color:var(--text-dim);
    letter-spacing:.04em; text-transform:uppercase;
    margin-top:5px;
  }
  .well-btn-row{display:flex; gap:8px; margin-top:10px; flex-wrap:wrap;}
  .well-open-btn{
    display:inline-flex; align-items:center; gap:6px;
    font-family:var(--sans); font-size:12.5px; font-weight:600;
    color:var(--on-amber);
    background:var(--amber);
    padding:7px 12px;
    border-radius:7px;
    text-decoration:none;
  }
  .well-open-btn:active{opacity:.85;}
  .well-open-btn-earth{
    color:var(--text);
    background:var(--panel);
    border:1px solid var(--border);
  }

  /* ---- abandonment log ---- */
  .ab-section{margin-bottom:20px;}
  .ab-section:last-child{margin-bottom:4px;}
  .ab-heading{
    font-family:var(--mono);
    font-size:11px;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:var(--text-dim);
    font-weight:700;
    margin:0 0 10px;
    padding-bottom:8px;
    border-bottom:1px solid var(--border);
  }
  .ab-rows{margin-bottom:10px;}
  .ab-empty{
    font-size:13px; color:var(--text-dim);
    padding:4px 2px 10px; margin:0;
  }
  .ab-row{
    display:flex; align-items:flex-start; justify-content:space-between; gap:10px;
    background:var(--panel-2);
    border:1px solid var(--border);
    border-radius:8px;
    padding:10px 12px;
    margin-bottom:8px;
  }
  .ab-row-main{display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
  .ab-name{font-family:var(--mono); font-size:14px; font-weight:700;}
  .ab-date{font-family:var(--mono); font-size:11.5px; color:var(--text-dim);}
  .ab-tag{
    font-family:var(--mono); font-size:9.5px; letter-spacing:.05em; text-transform:uppercase;
    font-weight:700; padding:2px 7px; border-radius:20px; white-space:nowrap;
  }
  .ab-tag-abandoned{background:rgba(200,55,46,0.14); color:var(--red-text); border:1px solid rgba(200,55,46,0.4);}
  .ab-tag-left-in-place{background:rgba(142,153,161,0.14); color:var(--text-dim); border:1px solid var(--border);}
  .ab-tag-type{background:rgba(224,168,46,0.14); color:var(--amber-text); border:1px solid rgba(224,168,46,0.4);}
  .ab-tag-found{background:rgba(224,168,46,0.14); color:var(--amber-text); border:1px solid rgba(224,168,46,0.4);}
  .ab-row-content{flex:1; min-width:0;}
  .ab-line-sub{
    display:flex; align-items:center; gap:8px; flex-wrap:wrap;
    margin-top:8px; padding-top:8px;
    border-top:1px solid var(--border);
  }
  .ab-name-sub{font-family:var(--mono); font-size:12.5px; font-weight:700; color:var(--text-dim);}
  .ab-comments{
    margin-top:8px; padding-top:8px;
    border-top:1px solid var(--border);
    font-size:13px; line-height:1.45; color:var(--text-dim);
    white-space:pre-wrap;
  }
  .ab-date-end{

  }
  .ab-row-actions{
    display:flex; flex-direction:column; gap:6px; flex-shrink:0;
  }
  .ab-edit-btn{
    width:26px; height:26px;
    border-radius:50%;

    color:var(--text-dim);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
  }
  .ab-edit-btn:hover{border-color:var(--amber); color:var(--amber-ink);}
  .ab-confirm-group{
    display:flex; align-items:center; gap:6px; flex-shrink:0;
  }
  .ab-confirm-text{
    font-size:11.5px; color:var(--text-dim); white-space:nowrap;
  }
  .ab-confirm-yes{
    width:26px; height:26px;
    border-radius:50%;
    border:none;
    background:var(--red);
    color:#fff;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
  }
  .ab-confirm-no{
    width:26px; height:26px;
    border-radius:50%;
    border:1px solid var(--border);
    background:transparent;
    color:var(--text-dim);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
  }
  .ab-row-editing{
    display:flex; flex-direction:column;
    background:var(--panel-2);
    border:1px solid var(--amber);
    border-radius:8px;
    padding:12px;
    margin-bottom:8px;
  }
  .ab-row-editing .ab-input{margin-bottom:8px;}
  textarea.ab-input{
    resize:vertical;
    font-family:var(--sans);
    min-height:44px;
  }
  .ab-remove{
    flex-shrink:0;
    width:26px; height:26px;
    border-radius:50%;
    border:1px solid var(--border);
    background:transparent;
    color:var(--text-dim);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
  }
  .ab-remove:hover{border-color:var(--red); color:var(--red-text);}

  .ab-row-planned{flex-direction:column; align-items:stretch;}
  .ab-planned-controls{
    display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap;
    gap:10px; margin-top:10px; padding-top:10px;
    border-top:1px solid var(--border);
  }
  .ab-date-label{
    display:flex; align-items:center; gap:8px;
    font-family:var(--mono); font-size:11px; color:var(--text-dim);
    text-transform:uppercase; letter-spacing:.04em;
  }
  .ab-date-input{
    background:var(--panel);
    border:1px solid var(--border);
    color:var(--text);
    font-family:var(--sans);
    font-size:13px;
    padding:6px 8px;
    border-radius:6px;
    outline:none;
  }
  .ab-date-input:focus{border-color:var(--amber);}
  .ab-planned-btns{display:flex; align-items:center; gap:8px;}
  .ab-graduate-btn{
    display:flex; align-items:center; gap:6px;
    font-family:var(--sans); font-size:12px; font-weight:600;
    color:var(--on-amber);
    background:var(--green);
    border:none;
    padding:6px 10px;
    border-radius:7px;
    cursor:pointer;
  }
  .ab-graduate-btn svg{width:11px;height:11px;}

  .ab-add-btn{
    display:flex; align-items:center; justify-content:center; gap:6px;
    width:100%;
    background:transparent;
    border:1px dashed var(--border);
    color:var(--text-dim);
    font-family:var(--sans); font-size:13px; font-weight:600;
    padding:10px;
    border-radius:8px;
    cursor:pointer;
    transition:border-color .15s, color .15s;
  }
  .ab-add-btn:hover{border-color:var(--amber); color:var(--amber-ink);}
  .ab-add-form{
    background:var(--panel-2);
    border:1px solid var(--border);
    border-radius:9px;
    padding:12px;
  }
  .ab-input{
    width:100%;
    background:var(--panel);
    border:1px solid var(--border);
    color:var(--text);
    font-family:var(--sans);
    font-size:15px;
    padding:10px 11px;
    border-radius:7px;
    outline:none;
    margin-bottom:8px;
  }
  .ab-input:focus{border-color:var(--amber); box-shadow:0 0 0 3px rgba(224,168,46,0.15);}
  .ab-input-date{font-size:14px;}
  .ab-checkbox-row{
    display:flex; align-items:center; gap:9px;
    font-family:var(--sans); font-size:13.5px; color:var(--text);
    padding:2px 1px 10px;
    cursor:pointer;
  }
  .ab-checkbox-row input[type="checkbox"]{
    width:17px; height:17px;
    accent-color:var(--amber);
    cursor:pointer;
  }
  .ab-hidden{display:none;}
  .ab-toggle-group{display:flex; gap:8px; margin-bottom:8px;}
  .ab-toggle-btn{
    flex:1;
    background:var(--panel);
    border:1px solid var(--border);
    color:var(--text-dim);
    font-family:var(--sans); font-size:12.5px; font-weight:600;
    padding:8px;
    border-radius:7px;
    cursor:pointer;
  }
  .ab-toggle-btn.active{
    background:rgba(224,168,46,0.14);
    border-color:var(--amber);
    color:var(--amber-ink);
  }
  .ab-add-actions{display:flex; gap:8px; margin-top:2px;}
  .ab-submit-btn{
    flex:1;
    background:var(--amber);
    border:none;
    color:var(--on-amber);
    font-family:var(--sans); font-size:13.5px; font-weight:700;
    padding:9px;
    border-radius:7px;
    cursor:pointer;
  }
  .ab-cancel-btn{
    background:transparent;
    border:1px solid var(--border);
    color:var(--text-dim);
    font-family:var(--sans); font-size:13.5px; font-weight:600;
    padding:9px 14px;
    border-radius:7px;
    cursor:pointer;
  }

  /* ---- miss digs ---- */
  .md-start-options{margin-bottom:10px;}
  .md-start-btn{
    display:flex; align-items:center; justify-content:center; gap:7px;
    width:100%;
    background:transparent;
    border:1px dashed var(--border);
    color:var(--text-dim);
    font-family:var(--sans); font-size:12.5px; font-weight:600;
    padding:9px;
    border-radius:8px;
    margin-bottom:8px;
    cursor:pointer;
  }
  .md-start-btn:last-child{margin-bottom:0;}
  .md-start-btn:hover{border-color:var(--amber); color:var(--amber-ink);}
  .md-start-btn-primary{
    background:rgba(224,168,46,0.1);
    border:1px solid rgba(224,168,46,0.35);
    color:var(--amber-text);
  }
  .md-start-chip{
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    flex-wrap:wrap;
    background:rgba(224,168,46,0.1);
    border:1px solid rgba(224,168,46,0.3);
    border-radius:8px;
    padding:9px 11px;
    margin-bottom:10px;
    font-size:13px;
    color:var(--amber-text);
  }
  .md-start-chip-text{display:flex; align-items:center; gap:6px;}
  .md-start-chip-actions{display:flex; align-items:center; gap:8px; flex-shrink:0;}
  .md-start-switch{
    background:transparent;
    border:1px solid rgba(224,168,46,0.35);
    color:var(--amber-text);
    font-family:var(--sans); font-size:11.5px; font-weight:600;
    padding:5px 9px;
    border-radius:6px;
    cursor:pointer;
    white-space:nowrap;
  }
  .md-start-clear{
    flex-shrink:0;
    width:22px; height:22px;
    display:flex; align-items:center; justify-content:center;
    background:transparent;
    border:1px solid rgba(224,168,46,0.35);
    color:var(--amber-text);
    border-radius:50%;
    cursor:pointer;
  }
  .md-priority-toggle{
    display:flex; align-items:center; gap:10px;
    width:100%;
    background:var(--panel-2);
    border:1px solid var(--border);
    color:var(--text-dim);
    font-family:var(--sans); font-size:13px; font-weight:600;
    padding:10px 12px;
    border-radius:9px;
    margin-bottom:12px;
    cursor:pointer;
    text-align:left;
  }
  .md-priority-toggle.md-priority-on{border-color:var(--amber); color:var(--text);}
  .md-priority-switch{
    flex-shrink:0;
    width:38px; height:22px;
    background:var(--border);
    border-radius:20px;
    position:relative;
    transition:background .15s;
  }
  .md-priority-on .md-priority-switch{background:var(--amber);}
  .md-priority-knob{
    position:absolute; top:2px; left:2px;
    width:18px; height:18px;
    background:#fff;
    border-radius:50%;
    transition:left .15s;
  }
  .md-priority-on .md-priority-knob{left:18px; background:var(--on-amber);}
  .md-src-priority{background:rgba(224,168,46,0.06); border:1px solid rgba(224,168,46,0.2); color:var(--text-dim); display:flex; align-items:center; gap:7px;}
  .md-plan-btn{
    display:flex; align-items:center; justify-content:center; gap:8px;
    width:100%;
    background:var(--amber);
    border:none;
    color:var(--on-amber);
    font-family:var(--sans); font-size:14px; font-weight:700;
    padding:12px;
    border-radius:9px;
    margin-bottom:14px;
    cursor:pointer;
  }
  .md-plan-btn:active{opacity:.88;}
  .md-row{
    background:var(--panel-2);
    border:1px solid var(--border);
    border-radius:9px;
    padding:12px;
    margin-bottom:8px;
  }
  .md-row.md-done{opacity:.55;}
  .md-row.md-done .md-name{text-decoration:line-through; text-decoration-color:var(--text-dim);}
  .md-row-top{display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
  .md-order{
    display:inline-flex; align-items:center; justify-content:center;
    width:20px; height:20px; flex-shrink:0;
    background:var(--amber);
    color:var(--on-amber);
    font-family:var(--mono); font-size:11px; font-weight:800;
    border-radius:50%;
  }
  .md-done-badge{
    display:inline-flex; align-items:center; justify-content:center;
    width:20px; height:20px; flex-shrink:0;
    background:var(--green);
    color:var(--on-amber);
    border-radius:50%;
  }
  .md-done-badge svg{width:11px;height:11px;}
  .md-name{font-family:var(--mono); font-size:14.5px; font-weight:700;}
  .md-btn-row{display:flex; gap:8px; margin-top:10px; flex-wrap:wrap;}
  .md-complete-btn{
    display:flex; align-items:center; gap:6px;
    background:var(--green);
    border:none;
    color:var(--on-amber);
    font-family:var(--sans); font-size:12.5px; font-weight:700;
    padding:7px 12px;
    border-radius:7px;
    cursor:pointer;
  }
  .md-complete-btn-undo{background:var(--panel); border:1px solid var(--border); color:var(--text-dim);}
  .md-edit-btn{
    flex-shrink:0;
    width:34px; height:34px;
    display:flex; align-items:center; justify-content:center;
    background:transparent;
    border:1px solid var(--border);
    color:var(--text-dim);
    border-radius:7px;
    cursor:pointer;
  }
  .md-edit-btn:hover{border-color:var(--amber); color:var(--amber-ink);}
  .md-row-editing{display:flex; flex-direction:column;}
  .md-row-editing .ab-input{margin-bottom:8px;}
  .md-add-form{
    background:var(--panel-2);
    border:1px solid var(--border);
    border-radius:9px;
    padding:12px;
  }
  .md-src{
    font-size:12.5px;
    margin:0 0 12px;
    padding:8px 10px;
    border-radius:7px;
    line-height:1.4;
  }
  .md-src-gps{background:rgba(62,142,82,0.12); border:1px solid rgba(62,142,82,0.35); color:var(--green-text);}
  .md-src-warn{background:rgba(224,168,46,0.1); border:1px solid rgba(224,168,46,0.3); color:var(--amber-text);}
  .md-src-planning{background:var(--panel-2); border:1px solid var(--border); color:var(--text-dim);}

  /* ---- reference card ---- */
  .ref-source{
    font-size:12px; color:var(--text-dim); line-height:1.45;
    margin:0 0 14px; padding:8px 10px;
    border-left:2px solid var(--border);
  }
  .ref-section{margin-bottom:18px;}
  .ref-section-warn .ab-heading{color:var(--amber-text); border-bottom-color:rgba(224,168,46,0.35);}
  .ref-items{display:flex; flex-direction:column; gap:8px;}
  .ref-item{
    display:grid; grid-template-columns:96px 1fr; gap:10px;
    font-size:13.5px; line-height:1.45;
  }
  .ref-label{
    font-family:var(--mono); font-size:10.5px; letter-spacing:.05em; text-transform:uppercase;
    color:var(--text-dim); font-weight:700; padding-top:2px;
  }
  .ref-label-open{color:var(--red-text);}
  .ref-label-closed{color:var(--green-text);}
  .ref-value{color:var(--text);}
  .ref-section-warn .ref-value{color:var(--amber-text);}
  .ref-ladder{display:flex; flex-direction:column; gap:6px;}
  .ref-rung{
    border-left:3px solid var(--border);
    background:var(--panel-2);
    border-radius:0 8px 8px 0;
    padding:8px 11px;
  }
  .ref-rung-red{border-left-color:var(--red);}
  .ref-rung-amber{border-left-color:var(--amber);}
  .ref-rung-head{display:flex; align-items:baseline; gap:10px; margin-bottom:3px;}
  .ref-rung-level{font-family:var(--mono); font-size:15px; font-weight:800;}
  .ref-rung-red .ref-rung-level{color:var(--red-text);}
  .ref-rung-amber .ref-rung-level{color:var(--amber-text);}
  .ref-rung-name{
    font-family:var(--mono); font-size:10.5px; letter-spacing:.05em; text-transform:uppercase;
    color:var(--text-dim); font-weight:700;
  }
  .ref-rung-text{font-size:13px; line-height:1.45; color:var(--text);}

  /* ---- alarm lookup ---- */
  .alarm-row{
    background:var(--panel-2);
    border:1px solid var(--border);
    border-left:3px solid var(--border);
    border-radius:9px;
    padding:11px 12px;
    margin-bottom:8px;
  }
  .alarm-row-interlock{border-left-color:var(--red);}
  .alarm-row-warn{border-left-color:var(--amber);}
  .alarm-row-fault{border-left-color:#5b6b78;}
  .alarm-row-top{display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:5px;}
  .alarm-device{font-family:var(--mono); font-size:14px; font-weight:800;}
  .alarm-sev{
    font-family:var(--mono); font-size:9.5px; letter-spacing:.06em; text-transform:uppercase;
    font-weight:800; padding:2px 7px; border-radius:20px; white-space:nowrap;
  }
  .alarm-sev-interlock{background:rgba(200,55,46,0.16); color:var(--red-text); border:1px solid rgba(200,55,46,0.45);}
  .alarm-sev-warn{background:rgba(224,168,46,0.14); color:var(--amber-text); border:1px solid rgba(224,168,46,0.4);}
  .alarm-sev-fault{background:rgba(91,107,120,0.2); color:var(--text-dim); border:1px solid var(--border);}
  .alarm-text{
    font-family:var(--mono); font-size:11.5px; letter-spacing:.02em;
    color:var(--text-dim); margin-bottom:7px;
  }
  .alarm-io{color:var(--text-dim); opacity:.8;}
  .alarm-meaning{font-size:13.5px; line-height:1.45; color:var(--text); margin-bottom:7px;}
  .alarm-actions{
    margin:0; padding-left:20px;
    font-size:13px; line-height:1.5; color:var(--text);
  }
  .alarm-actions li{margin-bottom:2px;}
  .alarm-interlocks{margin-bottom:12px;}
  .alarm-il-row{
    display:grid; grid-template-columns:1fr; gap:3px;
    background:var(--panel-2);
    border-left:3px solid var(--red);
    border-radius:0 8px 8px 0;
    padding:8px 11px; margin-bottom:6px;
    font-size:13px; line-height:1.4;
  }
  .alarm-il-cause{font-weight:700;}
  .alarm-il-result{color:var(--text-dim);}
  .alarm-il-reset{
    display:flex; align-items:flex-start; gap:7px;
    font-size:12.5px; color:var(--amber-text); line-height:1.45;
    margin:10px 0 0;
  }
  .alarm-il-reset svg{flex-shrink:0; margin-top:2px;}

  /* ---- alarm scenarios / diagnosis ---- */
  .scn-diagnosis{margin-bottom:12px;}
  .scn-hint{
    display:flex; align-items:flex-start; gap:8px;
    font-size:12.5px; color:var(--text-dim); line-height:1.45;
    margin:0 0 12px; padding:9px 11px;
    background:var(--panel-2); border:1px dashed var(--border); border-radius:8px;
  }
  .scn-hint svg{flex-shrink:0; margin-top:2px; color:var(--amber-ink);}
  .scn-tray{
    background:var(--panel-2); border:1px solid var(--amber); border-radius:9px;
    padding:10px 12px; margin-bottom:12px;
  }
  .scn-tray-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:8px;}
  .scn-clear{padding:5px 10px; font-size:12px;}
  .scn-chips{display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin:6px 0;}
  .scn-chips-label{
    font-family:var(--mono); font-size:10px; letter-spacing:.05em; text-transform:uppercase;
    color:var(--text-dim); font-weight:700; margin-right:2px;
  }
  .scn-chip{
    display:inline-flex; align-items:center; gap:5px;
    font-family:var(--mono); font-size:11px; font-weight:700;
    padding:4px 9px; border-radius:20px;
    background:var(--panel); border:1px solid var(--border); color:var(--text-dim);
  }
  .scn-chip-on{background:rgba(224,168,46,0.14); border-color:rgba(224,168,46,0.45); color:var(--amber-text);}
  .scn-chip-x{cursor:pointer; font-family:var(--mono);}
  .scn-chip-x svg{width:11px;height:11px;}
  .scn-unexplained{margin-top:10px;}
  .scn-row{border-left-width:4px;}
  .scn-title{font-family:var(--sans); font-size:14px; line-height:1.3;}
  .scn-sub{
    font-family:var(--mono); font-size:10px; letter-spacing:.06em; text-transform:uppercase;
    color:var(--text-dim); font-weight:700; margin:8px 0 3px;
  }
  .scn-track{
    display:inline-flex; align-items:center; gap:6px;
    margin-top:9px;
    background:transparent; border:1px solid var(--border); color:var(--text-dim);
    font-family:var(--sans); font-size:12px; font-weight:600;
    padding:6px 11px; border-radius:7px; cursor:pointer;
  }
  .scn-track svg{width:12px;height:12px;}
  .scn-track:hover{border-color:var(--amber); color:var(--amber-ink);}
  .scn-track-on{background:rgba(62,142,82,0.14); border-color:rgba(62,142,82,0.45); color:var(--green-text);}
  .scn-track-row{display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
  .scn-goto{
    margin-top:9px;
    background:transparent; border:none; padding:6px 2px;
    color:var(--amber-ink); font-family:var(--sans); font-size:12px; font-weight:700;
    cursor:pointer; text-decoration:underline; text-underline-offset:3px;
  }
  .scn-diagnosis{scroll-margin-top:150px;}
  .scn-howto{
    background:var(--panel-2); border:1px dashed var(--border); border-radius:9px;
    padding:10px 12px; margin-bottom:12px;
  }
  .scn-howto-title{
    display:flex; align-items:center; gap:7px;
    font-size:13.5px; font-weight:700; margin-bottom:6px;
  }
  .scn-howto-title svg{color:var(--amber-ink); flex-shrink:0;}
  .scn-howto-steps{margin:0; padding-left:20px; font-size:12.5px; line-height:1.5; color:var(--text-dim);}
  .scn-howto-steps li{margin-bottom:2px;}
  .scn-rank{position:relative;}
  .scn-rank-num{
    position:absolute; top:-8px; left:10px; z-index:1;
    font-family:var(--mono); font-size:10.5px; font-weight:800;
    background:var(--amber); color:#1a1408;
    padding:2px 8px; border-radius:20px;
  }
  .scn-fab{
    position:fixed; left:50%; transform:translateX(-50%);
    bottom:calc(14px + env(safe-area-inset-bottom, 0px));
    z-index:50;
    display:flex; align-items:center; gap:8px;
    max-width:calc(100% - 32px);
    background:var(--amber); color:#1a1408;
    border:none; border-radius:999px;
    padding:11px 16px;
    font-family:var(--sans); font-size:13.5px; font-weight:800;
    box-shadow:0 8px 24px rgba(0,0,0,0.45);
    cursor:pointer;
  }
  .scn-fab svg{width:15px;height:15px;flex-shrink:0;}
  .scn-fab.scn-fab-hidden{display:none;}
  .scn-fab-arrow{font-size:15px;}

  /* ---- well autocomplete dropdown ---- */
  .well-ac-wrap{position:relative;}
  .well-ac-dropdown{
    position:relative;
    margin-top:-4px;
    margin-bottom:4px;
  }
  .well-ac-item{
    display:flex; align-items:center; justify-content:space-between;
    width:100%;
    background:var(--panel);
    border:1px solid var(--border);
    border-top:none;
    color:var(--text);
    font-family:var(--sans); font-size:13.5px;
    padding:9px 11px;
    cursor:pointer;
    text-align:left;
  }
  .well-ac-item:first-child{border-top:1px solid var(--border); border-radius:0 0 0 0;}
  .well-ac-item:last-child{border-radius:0 0 7px 7px;}
  .well-ac-item:hover, .well-ac-item:active{background:var(--panel-2);}
  .well-ac-name{font-family:var(--mono); font-weight:700;}
  .well-ac-field{font-family:var(--mono); font-size:10.5px; color:var(--text-dim); text-transform:uppercase;}

  .empty{
    text-align:center; padding:60px 20px; color:var(--text-dim);
  }
  .empty svg{opacity:.35; margin-bottom:14px;}
  .empty p{font-size:14px; margin:0;}


  /* ---- header controls ---- */
  .brand h1{flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  @media (max-width:480px){ .brand-tail{display:none;} }
  .theme-btn{
    width:40px; height:40px; margin:-10px -4px -10px 0; padding:0; flex-shrink:0;
    border-radius:10px; border:1px solid var(--border);
    background:var(--panel); color:var(--text-dim);
    display:flex; align-items:center; justify-content:center; cursor:pointer;
  }
  .theme-btn:active{border-color:var(--amber); color:var(--amber-ink);}
  .meta-row{display:flex; align-items:center; justify-content:space-between; gap:12px; margin-top:8px; min-height:30px;}
  .meta-row[hidden]{display:none;}
  .meta-row .result-count{margin-top:0;}
  .collapse-btn{
    margin-left:auto;
    background:transparent; border:1px solid var(--border); color:var(--text-dim);
    font-family:var(--sans); font-size:12.5px; font-weight:600;
    padding:6px 12px; border-radius:8px; cursor:pointer;
  }
  .collapse-btn[hidden]{display:none;}

  /* ---- home screen: groups, icon tile, live status line ---- */
  .group-h{
    font-family:var(--sans); font-size:13px; font-weight:700; letter-spacing:.01em;
    color:var(--text-dim); margin:22px 2px 9px;
  }
  .group-h:first-child{margin-top:2px;}
  .card{margin-bottom:10px;}
  .card-head{padding:13px 14px;}
  .card-ico{
    width:38px; height:38px; flex-shrink:0;
    border-radius:10px; background:var(--panel-2); border:1px solid var(--border);
    color:var(--text-dim);
    display:flex; align-items:center; justify-content:center;
  }
  .card.open .card-ico{color:var(--amber-ink); border-color:var(--amber-dim);}
  .card-title{margin:0 0 3px;}
  .card-sub{
    margin:0; display:flex; align-items:center; gap:7px;
    font-size:13px; line-height:1.35; color:var(--text-dim);
  }
  .card-sub.sub-amber{color:var(--amber-text);}
  .card-sub.sub-red{color:var(--red-text);}
  .card-sub.sub-green{color:var(--green-text);}
  .st-lamp{
    width:8px; height:8px; border-radius:50%; flex-shrink:0;
    border:1.5px solid var(--text-dim); opacity:.65;
  }
  .st-amber{background:var(--amber); border-color:var(--amber); opacity:1; box-shadow:0 0 6px 1px var(--yellow-glow);}
  .st-green{background:var(--green); border-color:var(--green); opacity:1;}
  .st-red{background:var(--red); border-color:var(--red); opacity:1; box-shadow:0 0 6px 1px var(--red-glow); animation:pulse 1.4s infinite;}
  .progress-mini{min-width:0;}
  .progress-mini:empty{display:none;}
  .step{cursor:pointer;}

  /* ---- larger tap areas without changing the layout ---- */
  .check, .pig-bubble, .ab-remove, .ab-edit-btn, .ab-confirm-yes, .ab-confirm-no, .md-start-clear{position:relative;}
  .check::after, .pig-bubble::after, .md-start-clear::after{content:""; position:absolute; inset:-9px;}
  .ab-remove::after, .ab-edit-btn::after{content:""; position:absolute; inset:-7px -10px;}
  .ab-confirm-yes::after, .ab-confirm-no::after{content:""; position:absolute; inset:-10px -8px;}
  .ab-row-actions{gap:14px;}
  .ab-confirm-group{gap:16px;}

  @media (prefers-reduced-motion: reduce){
    .st-red, .badge.transition .lamp{animation:none;}
    .chevron{transition:none;}
  }
  footer.app-footer{
    max-width:720px; margin:20px auto 0; padding:0 18px;
    display:flex; justify-content:space-between; align-items:center;
    color:var(--text-dim); font-family:var(--mono); font-size:10.5px;
    letter-spacing:.04em;
  }
  .legend{display:flex; gap:14px; flex-wrap:wrap;}
  .legend span{display:flex; align-items:center; gap:5px;}
  .legend i{width:7px;height:7px;border-radius:50%; display:inline-block;}

  /* ---- toast (undo) ---- */
  .toast{
    position:fixed; left:50%; transform:translateX(-50%);
    bottom:calc(16px + env(safe-area-inset-bottom, 0px));
    z-index:60;
    display:flex; align-items:center; gap:14px;
    max-width:calc(100% - 28px);
    background:var(--text); color:var(--bg);
    border-radius:12px; padding:10px 10px 10px 16px;
    font-size:14px; font-weight:600;
    box-shadow:0 10px 28px rgba(0,0,0,0.45);
  }
  .toast[hidden]{display:none;}
  .toast-msg{min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .toast-btn{
    flex-shrink:0;
    background:var(--amber); color:var(--on-amber);
    border:none; border-radius:8px;
    font-family:var(--sans); font-size:14px; font-weight:800;
    padding:9px 16px; cursor:pointer;
  }
  .toast-btn[hidden]{display:none;}
  .toast:has(.toast-btn[hidden]){padding:12px 18px;}

  /* ---- disposal reads: last-time hint, save row, history ---- */
  .field-prev{margin-top:7px; font-size:12.5px; color:var(--text-dim);}
  .field-prev b{color:var(--text); font-weight:700;}
  .reads-actions{display:flex; gap:10px; margin:6px 0 4px;}
  .reads-actions .reads-save{flex:1;}
  .reads-actions button:disabled, .ab-submit-btn:disabled, .ab-cancel-btn:disabled{opacity:.45; cursor:default;}
  .reads-hist-h{margin-top:20px;}
  .reads-hist-row{
    background:var(--panel-2); border:1px solid var(--border); border-radius:9px;
    padding:10px 12px; margin-bottom:8px;
  }
  .reads-hist-top{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:8px;}
  .reads-hist-date{font-size:13.5px; font-weight:700;}
  .reads-hist-actions{display:flex; gap:6px; flex-shrink:0;}
  .reads-mini-btn{
    background:transparent; border:1px solid var(--border); color:var(--text-dim);
    font-family:var(--sans); font-size:12px; font-weight:600;
    padding:6px 10px; border-radius:7px; cursor:pointer;
  }
  .reads-hist-vals{display:grid; grid-template-columns:1fr 1fr; gap:6px 14px; margin:0;}
  .reads-hist-vals div{min-width:0;}
  .reads-hist-vals dt{font-size:11.5px; color:var(--text-dim); line-height:1.3;}
  .reads-hist-vals dd{margin:0; font-family:var(--mono); font-size:14px; font-weight:700;}

  /* ---- backup card ---- */
  .tools-lead{font-size:14px; line-height:1.5; margin:8px 0 10px;}
  .tools-onphone{font-size:13px; line-height:1.45; color:var(--text-dim); margin:0 0 12px;}
  .tools-onphone b{color:var(--text);}
  .tools-msg{
    font-size:13.5px; line-height:1.45; margin:0 0 12px; padding:9px 11px;
    background:rgba(62,142,82,0.12); border:1px solid rgba(62,142,82,0.4); border-radius:8px;
    color:var(--green-text);
  }
  .tools-btns{display:flex; flex-direction:column; gap:10px; margin-bottom:12px;}
  .tools-btns .ab-submit-btn, .tools-btns .ab-cancel-btn{width:100%; text-align:center; padding:13px 14px; font-size:15px;}
  .tools-file-btn{display:block; cursor:pointer; position:relative; overflow:hidden;}
  .tools-file-input{position:absolute; inset:0; width:100%; height:100%; opacity:0; cursor:pointer; font-size:0;}
  .tools-panel{
    background:var(--panel-2); border:1px solid var(--amber); border-radius:9px;
    padding:12px; margin-bottom:12px;
  }
  .tools-panel-title{margin:0 0 8px; font-size:15px; font-weight:700;}
  .tools-panel-line{margin:0 0 6px; font-size:13px; line-height:1.45; color:var(--text-dim);}
  .tools-panel-line b{color:var(--text);}
  .tools-panel .ab-add-actions{margin-top:10px;}
  .tools-panel-warn{display:flex; gap:8px; align-items:flex-start; border-color:var(--red); color:var(--red-text); font-size:13.5px; line-height:1.45;}
  .tools-panel-warn svg{flex-shrink:0; margin-top:2px;}
  .tools-details{margin:6px 0 4px; font-size:13px; color:var(--text-dim);}
  .tools-details summary{cursor:pointer; padding:8px 0; font-weight:600;}
  .tools-details > button{margin:6px 0;}
  .tools-paste{display:block; width:100%; margin:8px 0 6px;}
  .tools-version{margin:14px 0 0; padding-top:12px; border-top:1px solid var(--border); font-size:12px; color:var(--text-dim);}

  /* ---- footer ---- */
  footer.app-footer{gap:14px; flex-wrap:wrap;}
  #buildStamp{margin-left:auto;}

  /* daylight: white text on the darker green fills */
  html[data-theme="light"] .ab-graduate-btn,
  html[data-theme="light"] .md-done-badge,
  html[data-theme="light"] .md-complete-btn:not(.md-complete-btn-undo){color:#fff;}

  /* ---- navigation: board <-> one card filling the screen ---- */
  .search-row{display:flex; align-items:center; gap:10px;}
  .search-row .search-wrap{flex:1; min-width:0;}
  .back-btn{
    width:46px; height:46px; flex-shrink:0; padding:0;
    border-radius:10px; border:1px solid var(--border);
    background:var(--panel); color:var(--text);
    display:flex; align-items:center; justify-content:center; cursor:pointer;
  }
  .back-btn[hidden]{display:none;}
  .back-btn:active{border-color:var(--amber); color:var(--amber-ink);}
  #search{padding-right:42px;}
  .search-clear{
    position:absolute; right:6px; top:50%; transform:translateY(-50%);
    width:34px; height:34px; padding:0; border:none; border-radius:50%;
    background:transparent; color:var(--text-dim);
    display:flex; align-items:center; justify-content:center; cursor:pointer;
  }
  .search-clear[hidden]{display:none;}
  body.in-card .brand{display:none;}
  body.in-card header{padding-top:calc(12px + env(safe-area-inset-top, 0px)); padding-bottom:12px;}
  body.in-card main{padding-top:12px;}
  body.in-card .card-head{cursor:default;}
  body.in-card .chevron{display:none;}
  /* sticky table headers inside an open card need the card not to clip */
  body.in-card .card, body.in-card .card.open .card-body{overflow:visible;}
  body.in-card .card{margin-bottom:0;}
  body.in-card footer.app-footer{display:none;}
  .row-progress{height:3px; background:var(--border);}
  .row-progress i{display:block; height:100%; background:var(--amber); border-radius:0 2px 2px 0;}
  .card-head:focus-visible, .back-btn:focus-visible, .theme-btn:focus-visible{outline:2px solid var(--amber); outline-offset:2px;}

  /* ---- checklist: bigger checks, the next step stands out ---- */
  .check{width:26px; height:26px;}
  .check svg{width:15px; height:15px;}
  .step-text{font-size:15px;}
  .step-next{
    margin:0 -16px; padding-left:20px; padding-right:20px;
    background:linear-gradient(90deg, rgba(224,168,46,0.12), rgba(224,168,46,0) 75%);
    box-shadow:inset 3px 0 0 var(--amber);
  }
  .step-next .check{border-color:var(--amber);}
  .next-tag{
    font-size:11px; font-weight:800; line-height:1;
    color:var(--on-amber); background:var(--amber);
    border-radius:20px; padding:4px 9px; margin-top:2px;
  }
  .reset-btn:disabled{opacity:.4; cursor:default;}

  /* ---- pig table: all four columns fit, header stays put while you scroll ---- */
  .pig-table-wrap{overflow:visible; padding:0 12px;}
  .pig-table{min-width:0; table-layout:fixed;}
  .pig-table col.pig-c-line{width:31%;}
  .pig-table thead th{
    top:var(--header-h, 0px);
    white-space:normal; line-height:1.2; padding:9px 2px;
    font-family:var(--sans); font-size:11.5px; font-weight:700; letter-spacing:0; text-transform:none;
  }
  .pig-line-col{position:static; min-width:0;}
  .pig-section-row td{position:static;}
  .pig-cell{padding:8px 2px;}
  .pig-bubble{width:28px; height:28px;}
  .pig-bubble svg{width:14px; height:14px;}
  .pig-group{display:flex; justify-content:space-between; align-items:baseline; gap:8px;}
  .pig-group-count{color:var(--text-dim); font-weight:700; letter-spacing:0; text-transform:none; flex-shrink:0;}
  .pig-tag{white-space:normal;}
  .pig-body-inner .card-footer{margin:6px 16px 0;}

  /* ---- miss digs: urgency on each row, compact route planner ---- */
  .md-exp{font-size:12.5px; font-weight:600; color:var(--text-dim); margin-left:auto; white-space:nowrap;}
  .md-exp-red{color:var(--red-text); background:rgba(200,55,46,0.14); border:1px solid rgba(200,55,46,0.4); border-radius:20px; padding:2px 9px;}
  .md-exp-amber{color:var(--amber-text); background:rgba(224,168,46,0.14); border:1px solid rgba(224,168,46,0.4); border-radius:20px; padding:2px 9px;}
  .md-row-red{box-shadow:inset 3px 0 0 var(--red);}
  .md-row-amber{box-shadow:inset 3px 0 0 var(--amber);}
  .md-planner{margin:2px 0 12px;}
  .md-planner .md-plan-btn{margin:0;}
  .md-opts-toggle{
    width:100%; display:flex; align-items:center; justify-content:space-between; gap:10px;
    background:transparent; border:none; padding:10px 2px 4px; cursor:pointer;
    font-family:var(--sans); font-size:13px; color:var(--text-dim); text-align:left;
  }
  .md-opts-summary{min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .md-opts-change{flex-shrink:0; font-weight:700; color:var(--amber-ink); text-decoration:underline; text-underline-offset:3px;}
  .md-opts{margin-top:8px; padding:12px; background:var(--panel-2); border:1px solid var(--border); border-radius:10px;}
  .md-opts > :last-child{margin-bottom:0;}
  .card-body .ab-add-btn + .md-planner{margin-top:12px;}

  /* ---- shared: visible labels on date fields ---- */
  .ab-field-label{display:block; font-size:12.5px; font-weight:600; color:var(--text-dim); margin:2px 0 8px;}
  .ab-field-label .ab-input{display:block; width:100%; margin-top:5px;}
  .ab-filter-note{font-size:12.5px; color:var(--amber-text); margin:0 0 10px; line-height:1.4;}
  .ab-section > .ab-add-btn, .ab-section > .ab-add-form{margin-bottom:10px;}

  /* ---- well search: compact rows ---- */
  .well-row{display:flex; align-items:center; gap:10px;}
  .well-row-main{flex:1; min-width:0;}
  .well-row .well-row-top{justify-content:flex-start; align-items:baseline; gap:8px;}
  .well-fieldname{font-size:12.5px; color:var(--text-dim);}
  .well-row .well-btn-row{margin-top:0; flex-wrap:nowrap; flex-shrink:0; gap:6px;}
  .well-row .well-open-btn{padding:9px 10px;}
  .well-chips{display:flex; gap:6px; flex-wrap:wrap; margin-top:6px;}
  .well-cat-removed{background:rgba(200,55,46,0.14); color:var(--red-text); border:1px solid rgba(200,55,46,0.4);}

  /* ---- overview: jump straight to a section ---- */
  .ref-jump{
    position:sticky; top:var(--header-h, 0px); z-index:5;
    display:flex; gap:6px; overflow-x:auto; -webkit-overflow-scrolling:touch;
    margin:0 -16px 12px; padding:10px 16px;
    background:var(--panel); border-bottom:1px solid var(--border);
    scrollbar-width:none;
  }
  .ref-jump::-webkit-scrollbar{display:none;}
  .ref-jump-btn{
    flex-shrink:0;
    background:var(--panel-2); border:1px solid var(--border); color:var(--text);
    font-family:var(--sans); font-size:13px; font-weight:600;
    padding:7px 12px; border-radius:20px; cursor:pointer;
  }
  .ref-section{scroll-margin-top:calc(var(--header-h, 0px) + 62px);}
  .ref-source{margin:18px 0 0;}

  /* touch screens: a "hover" look sticks after a tap and reads as half-selected — turn it off there */
  @media (hover: none){
    .pig-bubble:not(.filled):hover{border-color:var(--border);}
    .step:not(.done):not(.step-next) .check:hover{border-color:var(--border);}
    .reset-btn:hover{border-color:var(--border); color:var(--text-dim);}
    .ab-edit-btn:hover{border-color:var(--border); color:var(--text-dim);}
  }
  .well-row .well-coords{font-size:11px; letter-spacing:0; white-space:nowrap;}

  .search-row .theme-btn{width:46px; height:46px; margin:0;}
  .brand{margin-bottom:12px;}

  /* ---- alarm lookup: an open list can be closed from anywhere inside it ---- */
  .alarm-sec{margin-top:10px;}
  .alarm-sec-head{
    position:sticky; top:var(--header-h, 0px); z-index:4;
    scroll-margin-top:var(--header-h, 0px);
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    width:calc(100% + 32px); margin:0 -16px 10px; padding:12px 16px;
    background:var(--panel); border:none;
    border-top:1px solid var(--border); border-bottom:1px solid var(--border);
    color:var(--text); font-family:var(--sans); font-size:14.5px; font-weight:700;
    text-align:left; cursor:pointer;
  }
  .alarm-sec-hide{
    flex-shrink:0; color:var(--amber-ink); font-weight:700;
    text-decoration:underline; text-underline-offset:3px;
  }

  /* =====================================================================
     APPEARANCE — "Panel"
     The board is an annunciator: idle windows are dark, a window lights
     when it needs you. Inside a card, the card IS the page (no box in a box).
     Color means state and nothing else.
  ===================================================================== */
  main{padding:14px 16px;}
  .group-h{margin:16px 2px 8px;}
  .group-h:first-child{margin-top:0;}
  .tiles{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .tile{
    margin:0; border-radius:14px; position:relative;
    display:flex; flex-direction:column; min-height:118px;
    transition:transform .08s ease;
  }
  .tile:active{transform:scale(.98);}
  .tile .card-head{flex:1; flex-direction:column; align-items:stretch; gap:9px; padding:13px 13px 12px;}
  .tile .card-ico{width:auto; height:auto; background:none; border:none; justify-content:flex-start; color:var(--text-dim);}
  .tile .card-ico svg{width:24px; height:24px;}
  .tile .card-title-wrap{display:flex; flex-direction:column; flex:1;}
  .tile .card-title{font-size:16.5px; font-weight:800; line-height:1.18; letter-spacing:-.005em; margin:0;}
  .tile .card-sub{margin-top:auto; padding-top:8px; font-size:12.5px; line-height:1.3;}
  .tile .progress-mini{position:absolute; top:14px; right:13px; font-size:12.5px;}
  .tile .row-progress{position:absolute; left:0; right:0; bottom:0; background:transparent;}
  .tile.lit-amber{border-color:var(--lit-amber-bd); background:linear-gradient(180deg, var(--lit-amber-a), var(--lit-amber-b) 70%), var(--panel);}
  .tile.lit-red{border-color:var(--lit-red-bd); background:linear-gradient(180deg, var(--lit-red-a), var(--lit-red-b) 70%), var(--panel);}
  .tile.lit-green{border-color:var(--lit-green-bd); background:linear-gradient(180deg, var(--lit-green-a), var(--lit-green-b) 70%), var(--panel);}
  .tile.lit-amber .card-ico{color:var(--amber-ink);}
  .tile.lit-red .card-ico{color:var(--red-text);}
  .tile.lit-green .card-ico{color:var(--green-text);}
  .tile.lit-green .row-progress i{background:var(--green);}
  .tile-wide{grid-column:1/-1; min-height:0;}
  .tile-wide .card-head{flex-direction:row; align-items:center; gap:12px;}
  .tile-wide .card-sub{margin-top:2px; padding-top:0;}
  .tile-wide .progress-mini{position:static;}
  .tile .card-head:focus-visible{outline:2px solid var(--amber); outline-offset:-2px; border-radius:14px;}
  footer.app-footer .legend{display:none;}
  footer.app-footer{justify-content:center;}
  #buildStamp{margin:0;}

  /* ---- inside a card ---- */
  body.in-card main{padding:14px 16px 48px; --panel:var(--bg); --panel-2:var(--raised);}
  body.in-card .card{background:transparent; border:none; border-radius:0;}
  body.in-card .card-head{padding:2px 0 14px; gap:14px;}
  body.in-card .card-ico{width:46px; height:46px; border-radius:13px; background:var(--raised);}
  body.in-card .card-title{font-size:23px; font-weight:800; letter-spacing:-.015em; line-height:1.15; margin-bottom:4px;}
  body.in-card .card-sub{font-size:14.5px;}
  body.in-card .progress-mini{font-size:14px; align-self:flex-start; padding-top:6px;}
  body.in-card .progress-track{height:4px; border-radius:3px; overflow:hidden; margin-bottom:4px;}
  body.in-card .body-inner{padding:8px 0 18px;}
  body.in-card .pig-table-wrap{padding:0;}
  body.in-card .pig-body-inner .card-footer{margin:6px 0 0;}
  /* headings are plain words with real weight, not tiny capitals */
  .ab-heading{
    font-family:var(--sans); font-size:16px; font-weight:800; letter-spacing:-.005em; text-transform:none;
    color:var(--text); border-bottom:none; padding-bottom:0; margin:26px 0 10px;
  }
  .ab-section:first-child .ab-heading, .body-inner > .ab-heading:first-child{margin-top:6px;}
  .ab-row, .md-row, .well-row, .alarm-row, .reads-hist-row, .ab-row-editing{border-radius:12px;}
  .ab-row{padding:12px 14px;}
  /* buttons and fields: one height, one shape */
  .ab-add-btn{
    border:1px solid var(--border); background:var(--panel-2); color:var(--text);
    font-size:15px; font-weight:700; min-height:50px; border-radius:12px;
  }
  .ab-submit-btn, .ab-cancel-btn, .md-plan-btn{min-height:50px; border-radius:12px; font-size:15.5px;}

      { title: "What this is", items: [
        { label: "Purpose", value: "Catches liquid slugs off the Winterfield 24\" main gas header and dumps them to the brine disposal tank battery." },
        { label: "Vessel", value: "8' dia × 20' long horizontal, 300 bbl. MAOP 800 psig. Relief valve set at 856 psig." },
        { label: "Capacity", value: "1,800 bbl/hr continuous · 100 bbl/min intermittent." },
        { label: "Discharge", value: "Through two 8\" control valves (CV-301, CV-302) via a regulating station to the brine holding tanks." },
        { label: "Level control", value: "In-tank Rosemount transmitter LT-304 (A) with LT-305 (B) as backup. Level drives the block valves and control valves automatically." }
      ]},
      { title: "Before operating — two hard rules", tone: "warn", items: [
        { label: "Interlocks", value: "Do NOT operate unless ALL electrical and mechanical interlocks are fully functional." },

      ]},

// Give every alarm a short "kind" so scenarios can match on patterns
// (any device's FAULT, any BV's FAILED TO CLOSE, etc.) instead of exact text.
(function tagAlarmKinds(){
  const kindOf = (t) => {
    t = t.toUpperCase();
    if(/LESS THAN 2/.test(t)) return "lt2open";
    if(/FAILED TO CLOSE/.test(t)) return "ftc";
    if(/FAILED TO OPEN/.test(t)) return "fto";
    if(/FAILED TO START/.test(t)) return "start";
    if(/NOT IN OPEN/.test(t)) return "notopen";
    if(/NOT IN CLOSED/.test(t)) return "notclosed";
    if(/POSITION INDICATION/.test(t)) return "pos";
    if(/FORCES ACTIVE/.test(t)) return "forces";
    if(/BATTERY/.test(t)) return "battery";
    if(/FAULTED/.test(t)) return "fault";
    if(/DEVIATION|\+\/-|\bDEV\b/.test(t)) return "dev";
    if(/HIGH.HIGH/.test(t)) return "hh";
    if(/LOW.LOW/.test(t)) return "ll";
    if(/HIGH|\bHI\b|> ?900|> ?2\.5/.test(t)) return "hi";
    if(/LOW/.test(t)) return "lo";
    return "other";
  };
  TB_ALARMS.forEach((a, i) => { a.idx = i; a.kind = kindOf(a.alarm); a.key = `${a.device}|${a.alarm}`; });
})();

function highlight(text, q){
  if(!q) return escapeHtml(text);
  const esc = escapeHtml(text);
  const escQ = escapeHtml(q).replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  return esc.replace(new RegExp(escQ,"ig"), m => `<mark>${m}</mark>`);
}
function escapeHtml(s){
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function matches(proc, q){
  if(!q) return true;
  let content;
  if(proc.type === "reads"){
    content = proc.fields.map(f => `${f.label} ${f.paren||""}`);
  } else if(proc.type === "pigging"){
    content = proc.lines.map(l => `${l.label} ${l.size} ${l.tag||""} ${PIG_SECTIONS[l.section].group} ${PIG_SECTIONS[l.section].sub}`);
  } else if(proc.type === "wellsearch"){
    content = WELLS.map(w => w[0]);
  } else if(proc.type === "abandonment"){
    const d = abandonData[proc.id] || { removals:[], planned:[] };
    content = [
      ...d.removals.map(e => `${e.wellName||""} ${e.lineName||""} ${e.lineStatus||""} ${e.date||""} ${e.comments||""}`),
      ...d.planned.map(e => `${e.name} ${e.type} ${e.date||""}`)
    ];
  } else if(proc.type === "missdigs"){
    const d = missDigData[proc.id] || { entries:[] };
    content = d.entries.map(e => `${e.ticketNumber||""} ${e.label} ${e.expDate||""}`);
  } else if(proc.type === "reference"){
    content = [];
    (proc.sections||[]).forEach(s => {
      content.push(s.title);
      (s.items||[]).forEach(it => content.push(`${it.label} ${it.value}`));
      (s.ladder||[]).forEach(r => content.push(`${r.level} ${r.name} ${r.text}`));
    });
  } else if(proc.type === "alarms"){
    content = TB_ALARMS.map(a => `${a.device} ${a.alarm} ${a.meaning} ${a.io}`).concat(TB_INTERLOCKS.map(i => `${i.cause} ${i.result}`));
  } else if(proc.type === "tools"){
    content = [];
  } else {
    content = proc.steps.map(s=>s.text);
  }
  const hay = [proc.title, ...(proc.keywords||[]), ...content].join(" ").toLowerCase();
  return hay.includes(q.toLowerCase());
}

function badgeHtml(step, isDone){
  if(step.type !== "valve" || !isDone) return "";
  const labelMap = { open:"Open", closed:"Closed", transition:"Transition" };
  return `<span class="badge ${step.state}"><span class="lamp"></span>${step.valve} · ${labelMap[step.state]}</span>`;
}

function localDateStr(){
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}
function fmtLongDate(s){
  const d = new Date(String(s).length <= 10 ? s + "T00:00:00" : s);
  if(isNaN(d.getTime())) return String(s);
  return d.toLocaleDateString(undefined, { month:"short", day:"numeric", year:"numeric" });
}
function fmtShortDate(s){
  const d = new Date(String(s).length <= 10 ? s + "T00:00:00" : s);
  if(isNaN(d.getTime())) return String(s);
  return d.toLocaleDateString(undefined, { month:"short", day:"numeric" });
}
function whenText(days){
  if(days === 0) return "today";
  if(days === 1) return "tomorrow";
  if(days === -1) return "yesterday";
  return days > 0 ? `in ${days} days` : `${-days} days ago`;
}
function daysSince(iso){
  const d = new Date(iso); if(isNaN(d.getTime())) return Infinity;
  const a = new Date(); a.setHours(0,0,0,0);
  const b = new Date(d); b.setHours(0,0,0,0);
  return Math.round((a - b) / 86400000);
}
function hasAnyUserData(){
  const anyKeys = (o) => o && Object.keys(o).some(k => o[k] && (Array.isArray(o[k]) ? o[k].length : Object.keys(o[k]).length));
  return anyKeys(completed) || anyKeys(readsValues) || anyKeys(pigStatus) || anyKeys(readsHistory) ||
    Object.values(abandonData||{}).some(d => d && ((d.removals||[]).length || (d.planned||[]).length)) ||
    Object.values(missDigData||{}).some(d => d && (d.entries||[]).length);
}

// What each card says about itself on the home screen.
// lamp: null (no lamp) | "off" | "amber" | "green" | "red".  count: small right-hand progress, or "".
function cardStatus(proc){
  if(proc.type === "reads"){
    const vals = readsValues[proc.id] || {};
    const total = proc.fields.length;
    const filled = proc.fields.filter((_,i) => (vals[i]||"").trim() !== "").length;
    const hist = readsHistory[proc.id] || [];
    const count = `<b>${filled}</b>/${total}`;
    if(filled > 0) return { text: filled === total ? "All entered. Save the reading to keep it." : `${filled} of ${total} entered, not saved yet`, lamp:"amber", count, frac: filled/total };
    if(hist.length){
      const d = daysSince(hist[0].at);
      return { text:`Last saved ${d === 0 ? "today" : d === 1 ? "yesterday" : fmtShortDate(hist[0].at)}`, lamp: d === 0 ? "green" : "off", count };
    }
    return { text:"No readings saved yet", lamp:"off", count };
  }
  if(proc.type === "pigging"){
    const status = pigStatus[proc.id] || {};
    const total = proc.lines.length * proc.columns.length;
    let filled = 0;
    proc.lines.forEach(line => { const cell = status[line.id] || {}; proc.columns.forEach(col => { if(cell[col.key]) filled++; }); });
    const count = `<b>${filled}</b>/${total}`;
    const stale = status.__started && status.__started !== localDateStr() ? `, started ${fmtShortDate(status.__started)}` : "";
    if(filled === 0) return { text:"No pigs marked", lamp:"off", count };
    if(filled === total) return { text:"Every line marked" + stale, lamp:"green", count, frac:1 };
    return { text:`${filled} of ${total} marked` + stale, lamp:"amber", count, frac: filled/total };
  }
  if(proc.type === "wellsearch"){
    return { text:`${WELLS.length} wells, Winterfield and Cranberry`, lamp:null, count:"" };
  }
  if(proc.type === "abandonment"){
    const d = abandonData[proc.id] || { removals:[], planned:[] };
    const r = d.removals.length, p = d.planned.length;
    const dated = d.planned.filter(e => e.date).map(e => ({ e, days: daysUntilExpiration(e.date) })).sort((a,b) => a.days - b.days);
    if(dated.length && dated[0].days <= 7){
      const { e, days } = dated[0];
      return { text: days < 0 ? `${e.name} was planned for ${fmtShortDate(e.date)}` : `${e.name} planned ${whenText(days)}`, lamp:"amber", count:"" };
    }
    if(!r && !p) return { text:"Nothing logged yet", lamp:"off", count:"" };
    return { text:[ r ? `${r} logged` : "", p ? `${p} planned` : "" ].filter(Boolean).join(", "), lamp:"off", count:"" };
  }
  if(proc.type === "missdigs"){
    const d = missDigData[proc.id] || { entries:[] };
    const total = d.entries.length, done = d.entries.filter(e => e.completed).length;
    const open = d.entries.filter(e => !e.completed);
    const count = total ? `<b>${done}</b>/${total}` : "";
    if(!total) return { text:"No tickets", lamp:"off", count };
    if(!open.length) return { text:"All tickets completed", lamp:"green", count };
    const withDays = open.map(e => daysUntilExpiration(e.expDate)).sort((a,b) => a - b);
    const overdue = withDays.filter(x => x < 0).length;
    const soonest = withDays[0];
    if(overdue) return { text:`${open.length} open, ${overdue} expired`, lamp:"red", count };
    if(soonest <= 3) return { text:`Next ticket expires ${whenText(soonest)}`, lamp: soonest === 0 ? "red" : "amber", count };
    return { text:`${open.length} open` + (isFinite(soonest) ? `, next expires ${whenText(soonest)}` : ""), lamp:"off", count };
  }
  if(proc.type === "reference"){
    return { text:"Setpoints, valve positions, resets", lamp:null, count:"" };
  }
  if(proc.type === "alarms"){
    const n = activeAlarms.size;
    if(n) return { text:`${n} alarm${n===1?"":"s"} added for diagnosis`, lamp:"amber", count:"" };
    return { text:`${TB_ALARMS.length} alarms, ${TB_SCENARIOS.length} known combinations`, lamp:null, count:"" };
  }
  if(proc.type === "tools"){
    const last = backupMeta.lastBackupAt;
    if(!last) return hasAnyUserData()
      ? { text:"Not backed up yet", lamp:"amber", count:"" }
      : { text:"Nothing to back up yet", lamp:"off", count:"" };
    const d = daysSince(last);
    return { text:`Last backup ${d === 0 ? "today" : d === 1 ? "yesterday" : whenText(-d)}`, lamp: d > 30 ? "amber" : "off", count:"" };
  }
  // checklist
  const doneMap = completed[proc.id] || {};
  const total = proc.steps.length;
  const done = proc.steps.filter((_,i) => doneMap[i]).length;
  const count = `<b>${done}</b>/${total}`;
  if(done === 0) return { text: lastDone[proc.id] ? `Not started, last done ${fmtShortDate(lastDone[proc.id])}` : "Not started", lamp:"off", count };
  if(done === total) return { text:"All steps done", lamp:"green", count, frac:1 };
  return { text:`${done} of ${total} steps done`, lamp:"amber", count, frac: done/total };
}
function cardSubInner(proc){
  const st = cardStatus(proc);

function cardSub(proc){

function cardCount(proc){

/* ---- theme ---- */
let theme = (function(){ try{ return localStorage.getItem(THEME_KEY) === "light" ? "light" : "dark"; } catch(e){ return "dark"; } })();
function applyTheme(){
  if(theme === "light") document.documentElement.setAttribute("data-theme", "light");
  else document.documentElement.removeAttribute("data-theme");
  const btn = document.getElementById("themeBtn");
  if(btn){
    btn.innerHTML = theme === "light" ? iconMoon : iconSun;
    btn.setAttribute("aria-label", theme === "light" ? "Switch to night mode" : "Switch to daylight mode");
    btn.title = theme === "light" ? "Night mode" : "Daylight mode";
  }

}
applyTheme();

/* ---------------------------------------------------------------------
   UNDO — every Reset and delete can be taken back for ten seconds.
   A snapshot is simply all saved data as one JSON string.
------------------------------------------------------------------------ */
let undoSnapshot = null;
let toastTimer = null;
function takeSnapshot(){
  return JSON.stringify({ completed, readsValues, pigStatus, abandonData, missDigData, readsHistory, activeAlarms: [...activeAlarms] });
}
function restoreSnapshot(json){
  const s = JSON.parse(json);
  completed = s.completed || {}; readsValues = s.readsValues || {}; pigStatus = s.pigStatus || {};
  abandonData = s.abandonData || {}; missDigData = s.missDigData || {}; readsHistory = s.readsHistory || {};
  activeAlarms = new Set(s.activeAlarms || []);
  saveCompleted(completed); saveReads(readsValues); savePig(pigStatus);
  saveAbandon(abandonData); saveMissDig(missDigData); saveJson(READS_HISTORY_KEY, readsHistory); saveActiveAlarms();
}
function showToast(msg, withUndo){
  const t = document.getElementById("toast");
  if(!t) return;
  clearTimeout(toastTimer);
  t.querySelector(".toast-msg").textContent = msg;
  t.querySelector(".toast-btn").hidden = !withUndo;
  t.hidden = false;
  toastTimer = setTimeout(() => { t.hidden = true; undoSnapshot = null; }, withUndo ? 10000 : 2500);
}
// Run a change; if it actually altered saved data, offer to undo it.
function withUndo(label, fn){
  const before = takeSnapshot();
  fn();
  if(takeSnapshot() !== before){ undoSnapshot = before; showToast(label, true); }
}

/* ---------------------------------------------------------------------
   BACKUP — one small file holding everything logged on this phone.
------------------------------------------------------------------------ */
const PRE_RESTORE_KEY = "fieldProcedures.preRestore.v1";
let pendingRestore = null;     // transient: { backup, error } after a file/paste is read
let toolsMessage = "";         // transient: last result shown in the Backup card
function backupKeys(){
  return [STORAGE_KEY, READS_KEY, PIG_KEY, ABANDON_KEY, MISSDIG_KEY, READS_HISTORY_KEY, ACTIVE_ALARMS_KEY, LAST_DONE_KEY];
}
function buildBackup(){
  const data = {};
  backupKeys().forEach(k => { try{ const v = localStorage.getItem(k); if(v != null) data[k] = v; } catch(e){} });
  return { app:"field-procedures", format:1, build:APP_BUILD, savedAt:new Date().toISOString(), data };
}
// Plain-language count of what a backup (or this phone) holds.
function summarizeBackupData(data){
  const get = (k) => { try{ return JSON.parse(data[k] || "null") || {}; } catch(e){ return {}; } };
  const parts = [];
  const ab = get(ABANDON_KEY);
  const abN = Object.values(ab).reduce((n, d) => n + ((d && d.removals) || []).length + ((d && d.planned) || []).length + ((d && d.wells) || []).length + ((d && d.lines) || []).length, 0);
  if(abN) parts.push(`${abN} abandonment ${abN === 1 ? "entry" : "entries"}`);
  const md = get(MISSDIG_KEY);
  const mdN = Object.values(md).reduce((n, d) => n + ((d && d.entries) || []).length, 0);
  if(mdN) parts.push(`${mdN} miss dig ticket${mdN === 1 ? "" : "s"}`);
  const rh = get(READS_HISTORY_KEY);
  const rhN = Object.values(rh).reduce((n, list) => n + (Array.isArray(list) ? list.length : 0), 0);
  if(rhN) parts.push(`${rhN} saved reading${rhN === 1 ? "" : "s"}`);
  const pig = get(PIG_KEY);
  const pigN = Object.values(pig).reduce((n, lines) => n + Object.values(lines || {}).reduce((m, cell) => m + (cell && typeof cell === "object" ? Object.keys(cell).length : 0), 0), 0);
  if(pigN) parts.push(`${pigN} pig mark${pigN === 1 ? "" : "s"}`);
  const done = get(STORAGE_KEY);
  const doneN = Object.values(done).reduce((n, m) => n + Object.values(m || {}).filter(Boolean).length, 0);
  if(doneN) parts.push(`${doneN} checked step${doneN === 1 ? "" : "s"}`);
  return parts.length ? parts.join(", ") : "nothing logged";
}
function parseBackupText(text){
  let obj;
  try{ obj = JSON.parse(text); } catch(e){ return { error:"That isn't a Field Ops backup. The file couldn't be read." }; }
  if(!obj || obj.app !== "field-procedures" || !obj.data || typeof obj.data !== "object"){
    return { error:"That file isn't a Field Ops backup." };
  }
  const allowed = new Set(backupKeys());
  const data = {};
  Object.keys(obj.data).forEach(k => {
    if(!allowed.has(k) || typeof obj.data[k] !== "string") return;   // ignore anything we don't recognise
    try{ JSON.parse(obj.data[k]); data[k] = obj.data[k]; } catch(e){}
  });
  return { backup: { savedAt: obj.savedAt || "", data } };
}
function reloadStateFromStorage(){
  completed = loadCompleted(); readsValues = loadReads(); pigStatus = loadPig();
  abandonData = loadAbandon(); missDigData = loadMissDig(); readsHistory = loadJson(READS_HISTORY_KEY, {});
  lastDone = loadJson(LAST_DONE_KEY, {});
  activeAlarms = new Set(loadJson(ACTIVE_ALARMS_KEY, []).map(k => TB_ALARMS.findIndex(a => a.key === k)).filter(i => i >= 0));
}
function writeBackupData(data){
  backupKeys().forEach(k => {
    try{ if(data[k] != null) localStorage.setItem(k, data[k]); else localStorage.removeItem(k); } catch(e){}
  });
  reloadStateFromStorage();
}
function applyRestore(backup){
  saveJson(PRE_RESTORE_KEY, buildBackup());   // keep what was here, so the restore itself can be undone
  writeBackupData(backup.data);
}
async function saveBackupFile(){
  const json = JSON.stringify(buildBackup(), null, 1);
  const name = `field-ops-backup-${localDateStr()}.json`;
  let shared = false;
  try{
    const file = new File([json], name, { type:"application/json" });
    if(navigator.canShare && navigator.canShare({ files:[file] })){
      await navigator.share({ files:[file], title:"Field Ops backup" });
      shared = true;
    }
  } catch(err){
    if(err && err.name === "AbortError") return false;   // they closed the share sheet
  }
  if(!shared){
    const url = URL.createObjectURL(new Blob([json], { type:"application/json" }));
    const a = document.createElement("a");
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
  }
  backupMeta.lastBackupAt = new Date().toISOString();
  saveJson(BACKUP_META_KEY, backupMeta);
  return true;
}

    <div class="tools-panel">
      <p class="tools-panel-title">Replace what's on this phone?</p>
      <p class="tools-panel-line"><b>Backup${b.savedAt ? " from " + escapeHtml(fmtDateTime(b.savedAt)) : ""}:</b> ${escapeHtml(summarizeBackupData(b.data))}</p>
      <p class="tools-panel-line"><b>On this phone now:</b> ${escapeHtml(onPhone)}</p>
      <div class="ab-add-actions">
        <button class="ab-submit-btn" data-action="backup-restore-confirm">Replace with backup</button>
        <button class="ab-cancel-btn" data-action="backup-restore-cancel">Cancel</button>

  <div class="card ${isOpen?'open':''}" data-id="${proc.id}">

      <div class="card-title-wrap">
        <p class="card-title">${highlight(proc.title, query)}</p>
        ${cardSub(proc)}
      </div>
      ${cardCount(proc)}<span class="chevron">${iconChevron}</span>
    </div>
    <div class="card-body">
      <div class="body-inner">
        <p class="tools-lead">Everything you log is stored only on this phone. A backup is one small file you can keep in Files, text to yourself, or send to a coworker so they can load it.</p>
        <p class="tools-onphone"><b>On this phone:</b> ${escapeHtml(onPhone)}</p>
        ${toolsMessage ? `<p class="tools-msg">${escapeHtml(toolsMessage)}</p>` : ""}
        <div class="tools-btns">
          <button class="ab-submit-btn" data-action="backup-save">Save a backup file</button>
          <label class="ab-cancel-btn tools-file-btn">Restore from a backup file
            <input type="file" accept=".json,application/json,text/plain" data-action="backup-file" class="tools-file-input">
          </label>
        </div>
        ${restoreHtml}
        ${pre ? `<button class="ab-add-btn" data-action="backup-undo-restore">Undo the last restore (put back what was here ${escapeHtml(fmtDateTime(pre.savedAt))})</button>` : ""}
        <details class="tools-details">
          <summary>File not working? Copy and paste instead</summary>
