          <textarea class="ab-input tools-paste" rows="3" placeholder="Paste backup text here to restore it"></textarea>
          <button class="ab-cancel-btn" data-action="backup-paste">Restore from pasted text</button>
        </details>
        <p class="tools-version">Version ${escapeHtml(fmtShortDate(APP_BUILD))}, ${escapeHtml(APP_BUILD.slice(0,4))}, build ${APP_REV}. Works with no signal.</p>
      </div>
    </div>
  </div>`;
}

function renderCard(proc, isOpen){
  try{
    if(proc.type === "reads") return renderReadsCard(proc, isOpen);
    if(proc.type === "pigging") return renderPiggingCard(proc, isOpen);
    if(proc.type === "wellsearch") return renderWellSearchCard(proc, isOpen);
    if(proc.type === "abandonment") return renderAbandonmentCard(proc, isOpen);
    if(proc.type === "missdigs") return renderMissDigsCard(proc, isOpen);
    if(proc.type === "reference") return renderReferenceCard(proc, isOpen);
    if(proc.type === "alarms") return renderAlarmsCard(proc, isOpen);
    if(proc.type === "tools") return renderToolsCard(proc, isOpen);
    return renderChecklistCard(proc, isOpen);
  } catch(cardErr){
    console.error("card render error:", proc.id, cardErr);
    return `<div class="card open"><div class="body-inner"><p class="well-hint">Couldn't load "${escapeHtml(proc.title)}": ${escapeHtml(String(cardErr && cardErr.message || cardErr))}</p></div></div>`;
  }
}

// A window on the board. Idle windows are dark; a window lights when it needs you
// (amber = in progress or coming due, red = overdue, green = finished).
function cardRowHtml(proc, wide){
  try{
    const st = cardStatus(proc);
    const lit = st.lamp && st.lamp !== "off" ? ` lit-${st.lamp}` : "";
    const bar = typeof st.frac === "number" ? `<div class="row-progress"><i style="width:${Math.round(st.frac * 100)}%"></i></div>` : "";
    return `
    <div class="card tile${lit}${wide ? " tile-wide" : ""}" data-id="${proc.id}">
      <div class="card-head" data-action="toggle" data-id="${proc.id}" role="button" tabindex="0">
        ${cardIcon(proc)}
        <div class="card-title-wrap">
          <p class="card-title">${highlight(proc.title, query)}</p>
          <p class="card-sub ${st.lamp ? "sub-" + st.lamp : ""}"><span>${escapeHtml(st.text)}</span></p>
        </div>
        ${cardCount(proc)}
      </div>
      ${bar}
    </div>`;
  } catch(err){
    console.error("tile render error:", proc.id, err);
    return `<div class="card tile"><div class="card-head"><div class="card-title-wrap"><p class="card-title">${escapeHtml(proc.title)}</p></div></div></div>`;
  }
}
// Two windows per row; an odd one out stretches across.
function tilesHtml(procs){
  return `<div class="tiles">${procs.map((p, i) => cardRowHtml(p, procs.length % 2 === 1 && i === procs.length - 1)).join("")}</div>`;
}

/* ---------------------------------------------------------------------
   NAVIGATION — the board lists every card; opening one fills the screen.
   Back (button, or the phone's swipe-back) returns to the board where you left it.
------------------------------------------------------------------------ */
const ACTIVE_KEY = "fieldProcedures.activeCard.v1";
let activeId = (function(){
  // Pick up where you left off, but only if you were here recently.
  const a = loadJson(ACTIVE_KEY, null);
  if(a && a.id && PROCEDURES.some(p => p.id === a.id) && Date.now() - (a.at || 0) < 2 * 3600 * 1000) return a.id;
  return null;
})();
let listScrollY = 0;
let lastActiveWrite = 0;
function setActive(id){
  activeId = id || null;
  lastActiveWrite = Date.now();
  if(activeId) saveJson(ACTIVE_KEY, { id: activeId, at: lastActiveWrite });
  else { try{ localStorage.removeItem(ACTIVE_KEY); } catch(e){} }
}
// Which card (if any) is filling the screen right now.
function shownCardId(filtered){
  if(activeId && filtered.some(p => p.id === activeId)) return activeId;
  if(query && filtered.length === 1) return filtered[0].id;   // a search with one answer goes straight to it
  return null;
}
function openCard(id){
  if(!PROCEDURES.some(p => p.id === id)) return;
  if(!activeId) listScrollY = window.scrollY;
  setActive(id);
  try{ history.pushState({ card: id }, ""); } catch(e){}
  render();
  window.scrollTo(0, 0);
}
function clearSearch(){
  query = "";
  const sEl = document.getElementById("search");
  if(sEl) sEl.value = "";
}
// Leave the open card (no history calls here — popstate and the Back button both land in this).
function closeCardView(){
  const filtered = PROCEDURES.filter(p => matches(p, query));
  if(activeId){
    setActive(null);
    if(query && filtered.length === 1) clearSearch();   // otherwise the search would reopen the same card
  } else if(query){
    clearSearch();
  }
  render();
  window.scrollTo(0, query ? 0 : listScrollY);
}
function backPressed(){
  if(activeId && history.state && history.state.card) history.back();   // popstate does the rest
  else closeCardView();
}
window.addEventListener("popstate", (e) => {
  const id = e.state && e.state.card;
  if(id && PROCEDURES.some(p => p.id === id)){ setActive(id); render(); window.scrollTo(0, 0); }
  else if(activeId || query) closeCardView();
});

function render(){
  try{
    const main = document.getElementById("main");
    const filtered = PROCEDURES.filter(p => matches(p, query));
    const shown = shownCardId(filtered);

    // header state
    document.body.classList.toggle("in-card", !!shown);
    const backBtn = document.getElementById("backBtn");
    if(backBtn) backBtn.hidden = !shown;
    const clearBtn = document.getElementById("searchClear");
    if(clearBtn) clearBtn.hidden = !query;
    const showCount = !!query && !shown;
    document.getElementById("resultCount").textContent = showCount ? `${filtered.length} result${filtered.length===1?"":"s"}` : "";
    const metaRow = document.querySelector(".meta-row");
    if(metaRow) metaRow.hidden = !showCount;

    if(shown){
      main.innerHTML = renderCard(PROCEDURES.find(p => p.id === shown), true);
      if(activeId && Date.now() - lastActiveWrite > 60000){ lastActiveWrite = Date.now(); saveJson(ACTIVE_KEY, { id: activeId, at: lastActiveWrite }); }
    } else if(filtered.length === 0){
      main.innerHTML = `<div class="empty">${iconEmpty}<p>Nothing matches “${escapeHtml(query)}.” Try a valve or well number, or one word from the alarm.</p></div>`;
    } else if(query){
      main.innerHTML = tilesHtml(filtered);
    } else {
      const used = new Set();
      let html = "";
      PROC_GROUPS.forEach(g => {
        const procs = g.ids.map(id => filtered.find(p => p.id === id)).filter(Boolean);
        if(!procs.length) return;
        procs.forEach(p => used.add(p.id));
        html += `<h2 class="group-h">${escapeHtml(g.label)}</h2>` + tilesHtml(procs);
      });
      const rest = filtered.filter(p => !used.has(p.id));
      if(rest.length) html += `<h2 class="group-h">Other</h2>` + tilesHtml(rest);
      main.innerHTML = html;
    }

    // sticky things inside cards need to know how tall the header is
    const header = document.querySelector("header");
    if(header) document.documentElement.style.setProperty("--header-h", header.offsetHeight + "px");
    if(typeof updateFabVisibility === "function") updateFabVisibility();
  } catch(err){
    console.error("render error:", err);
    const main = document.getElementById("main");
    if(main) main.innerHTML = `<div class="empty"><p>Something went wrong loading the board: ${escapeHtml(String(err && err.message || err))}</p></div>`;
  }
}

function renderChecklistCard(proc, isOpen){
    const doneMap = completed[proc.id] || {};
    const total = proc.steps.length;
    const doneCount = proc.steps.filter((_,i)=>doneMap[i]).length;

    const nextIdx = proc.steps.findIndex((_,i) => !doneMap[i]);   // the step to do next
    const stepsHtml = proc.steps.map((step, i) => {
      const isDone = !!doneMap[i];
      return stepRow(step, i, isDone, proc.id, i === nextIdx);
    }).join("");
    const finishedAt = lastDone[proc.id];
    const footNote = doneCount === total
      ? (finishedAt ? `Finished ${fmtDateTime(finishedAt)}` : "All steps done")
      : `${total - doneCount} step${total-doneCount===1?'':'s'} left`;

    return `
    <div class="card ${isOpen?'open':''}" data-id="${proc.id}">
      <div class="card-head" data-action="toggle" data-id="${proc.id}">
        ${cardIcon(proc)}
        <div class="card-title-wrap">
          <p class="card-title">${highlight(proc.title, query)}</p>
          ${cardSub(proc)}
        </div>
        ${cardCount(proc)}<span class="chevron">${iconChevron}</span>
      </div>
      <div class="progress-track">${proc.steps.map((_,i)=>`<i class="${doneMap[i]?'done':''}"></i>`).join("")}</div>
      <div class="card-body">
        <div class="body-inner">
          ${stepsHtml}
          <div class="card-footer">
            <span class="footer-note">${escapeHtml(footNote)}</span>
            <button class="reset-btn" data-action="reset" data-id="${proc.id}" ${doneCount === 0 ? "disabled" : ""}>${iconReset} Start over</button>
          </div>
        </div>
      </div>
    </div>`;
}

/* ---- Disposal Reads: enter, save with date, compare against last time ---- */
let readsShowAll = {}; // transient UI state: procId -> bool

function fmtDateTime(iso){
  const d = new Date(iso);
  if(isNaN(d.getTime())) return String(iso);
  return d.toLocaleDateString(undefined, { month:"short", day:"numeric", year:"numeric" }) + ", " +
         d.toLocaleTimeString([], { hour:"2-digit", minute:"2-digit", hour12:false });
}
function readingText(proc, entry){
  const lines = [`${proc.title}, ${fmtDateTime(entry.at)}`];
  proc.fields.forEach((f, i) => {
    const v = ((entry.values||[])[i] || "").trim();
    lines.push(`${f.label}${f.paren ? ` (${f.paren})` : ""}: ${v || "not entered"}`);
  });
  return lines.join("\n");
}
function copyText(text){
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(() => showToast("Copied"), () => copyTextFallback(text));
      return;
    }
  } catch(e){}
  copyTextFallback(text);
}
function copyTextFallback(text){
  try{
    const ta = document.createElement("textarea");
    ta.value = text; ta.setAttribute("readonly", ""); ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    const ok = document.execCommand("copy");
    ta.remove();
    showToast(ok ? "Copied" : "Couldn't copy on this phone");
  } catch(e){ showToast("Couldn't copy on this phone"); }
}
function readsFooterNote(filledCount, total){
  if(filledCount === 0) return "Enter today's readings";
  return filledCount === total ? "All entered" : `${total - filledCount} left to enter`;
}

function renderReadsCard(proc, isOpen){
    const values = readsValues[proc.id] || {};
    const total = proc.fields.length;
    const filledCount = proc.fields.filter((_,i)=> (values[i]||"").trim() !== "").length;
    const hist = readsHistory[proc.id] || [];
    const last = hist[0];

    const fieldsHtml = proc.fields.map((field, i) => {
      const val = values[i] || "";
      const prev = last ? ((last.values||[])[i] || "").trim() : "";
      return `
      <div class="field-row">
        <label class="field-label">${highlight(field.label, query)}${field.paren ? ` <span class="paren">(${highlight(field.paren, query)})</span>` : ""}${field.paren ? "" : ":"}</label>
        <input class="field-input" type="text" inputmode="decimal" placeholder="Enter reading…"
          data-action="field-input" data-id="${proc.id}" data-idx="${i}" value="${escapeHtml(val)}">
        ${prev ? `<div class="field-prev">Last time: <b>${escapeHtml(prev)}</b> on ${escapeHtml(fmtShortDate(last.at))}</div>` : ""}
      </div>`;
    }).join("");

    const showAll = !!readsShowAll[proc.id];
    const shown = showAll ? hist : hist.slice(0, 3);
    const histHtml = hist.length === 0 ? "" : `
      <h3 class="ab-heading reads-hist-h">Saved readings</h3>
      ${shown.map((entry) => `
      <div class="reads-hist-row">
        <div class="reads-hist-top">
          <span class="reads-hist-date">${escapeHtml(fmtDateTime(entry.at))}</span>
          <span class="reads-hist-actions">
            <button class="reads-mini-btn" data-action="reads-copy" data-id="${proc.id}" data-at="${escapeHtml(entry.at)}">Copy</button>
            <button class="reads-mini-btn" data-action="reads-delete" data-id="${proc.id}" data-at="${escapeHtml(entry.at)}">Delete</button>
          </span>
        </div>
        <dl class="reads-hist-vals">
          ${proc.fields.map((f, i) => `<div><dt>${escapeHtml(f.label)}</dt><dd>${escapeHtml((((entry.values||[])[i]) || "").trim() || "—")}</dd></div>`).join("")}
        </dl>
      </div>`).join("")}
      ${hist.length > 3 ? `<button class="ab-add-btn" data-action="reads-toggle-all" data-id="${proc.id}">${showAll ? "Show fewer" : `Show all ${hist.length} saved readings`}</button>` : ""}`;

    return `
    <div class="card ${isOpen?'open':''}" data-id="${proc.id}">
      <div class="card-head" data-action="toggle" data-id="${proc.id}">
        ${cardIcon(proc)}
        <div class="card-title-wrap">
          <p class="card-title">${highlight(proc.title, query)}</p>
          ${cardSub(proc)}
        </div>
        ${cardCount(proc)}<span class="chevron">${iconChevron}</span>
      </div>
      <div class="progress-track">${proc.fields.map((_,i)=>`<i class="${(values[i]||"").trim()?'done':''}"></i>`).join("")}</div>
      <div class="card-body">
        <div class="body-inner">
          ${fieldsHtml}

function renderPiggingCard(proc, isOpen){
    const status = pigStatus[proc.id] || {};
    const totalCells = proc.lines.length * proc.columns.length;
    let filledCells = 0;
    proc.lines.forEach(line => {
      const cell = status[line.id] || {};
      proc.columns.forEach(col => { if(cell[col.key]) filledCells++; });
    });

    const groupCounts = {};
    proc.lines.forEach(line => {
      const g = PIG_SECTIONS[line.section].group;
      const gc = groupCounts[g] = groupCounts[g] || { f:0, t:0 };
      const cell = status[line.id] || {};
      proc.columns.forEach(col => { gc.t++; if(cell[col.key]) gc.f++; });
    });

    let lastSection = null;
    const rowsHtml = proc.lines.map(line => {
      const meta = PIG_SECTIONS[line.section];
      let sectionHeadHtml = "";
      if(line.section !== lastSection){
        const groupChanged = !lastSection || PIG_SECTIONS[lastSection].group !== meta.group;
        sectionHeadHtml = `<tr class="pig-section-row ${groupChanged ? 'new-group' : ''}">
          <td colspan="${proc.columns.length+1}">
            ${groupChanged ? `<span class="pig-group"><span>${escapeHtml(meta.group)}</span><b class="pig-group-count">${groupCounts[meta.group].f} of ${groupCounts[meta.group].t}</b></span>` : ""}
            <span class="pig-sub">${escapeHtml(meta.sub)}</span>
          </td>
        </tr>`;
        lastSection = line.section;

      const cell = status[line.id] || {};
      const cellsHtml = proc.columns.map(col => {
        const val = cell[col.key];
        return `<td class="pig-cell">
          <button class="pig-bubble ${val ? 'filled' : ''}" data-action="pig-toggle" data-id="${proc.id}" data-line="${line.id}" data-col="${col.key}" aria-label="${line.label} ${line.size} ${col.label}">${val ? iconCheck : ""}</button>

      return `${sectionHeadHtml}
      <tr>
        <td class="pig-line-col">
          <span class="pig-line-label">${highlight(line.label, query)} <span class="pig-size">${escapeHtml(line.size)}</span></span>
          ${line.tag ? `<span class="pig-tag">${highlight(line.tag, query)}</span>` : ""}
        </td>

    }).join("");

    const headerCells = proc.columns.map(c => `<th>${escapeHtml(c.label).replace(" ", "<br>")}</th>`).join("");

    return `
    <div class="card ${isOpen?'open':''}" data-id="${proc.id}">
      <div class="card-head" data-action="toggle" data-id="${proc.id}">
        ${cardIcon(proc)}
        <div class="card-title-wrap">
          <p class="card-title">${highlight(proc.title, query)}</p>

        </div>
        ${cardCount(proc)}<span class="chevron">${iconChevron}</span>
      </div>
      <div class="card-body">
        <div class="body-inner pig-body-inner">
          <div class="pig-table-wrap">
            <table class="pig-table">
              <colgroup><col class="pig-c-line">${proc.columns.map(() => "<col>").join("")}</colgroup>
              <thead>
                <tr>
                  <th class="pig-line-col">Line</th>

          <div class="card-footer">
            <span class="footer-note">${status.__started ? `Started ${escapeHtml(fmtShortDate(status.__started))}. ` : ""}${filledCells === totalCells ? "Every line marked" : `${totalCells - filledCells} left`}</span>
            <button class="reset-btn" data-action="reset" data-id="${proc.id}" ${filledCells === 0 ? "disabled" : ""}>${iconReset} Start over</button>

const RECENT_WELLS_KEY = "fieldProcedures.recentWells.v1";
let recentWells = loadJson(RECENT_WELLS_KEY, []);   // names of wells whose map was opened, newest first

// "208" in the log means W-208 only if no other well shares that number.
function sameWell(logged, wellName){
  const a = String(logged || "").toUpperCase().replace(/\s+/g, ""), b = String(wellName).toUpperCase();
  if(!a) return false;
  if(a === b) return true;
  if(/^\d+$/.test(a)){
    const num = b.replace(/^[A-Z]+-/, "");
    return num === a && WELLS.filter(w => String(w[0]).replace(/^[A-Za-z]+-/, "") === a).length === 1;
  }
  return false;
}
// What the Abandonment Log knows about a well, so the search doesn't send you to one that's gone.
function wellStatusChip(name){
  let removed = null, planned = null;
  Object.values(abandonData || {}).forEach(d => {
    ((d && d.removals) || []).forEach(e => { if(sameWell(e.wellName, name)) removed = e; });
    ((d && d.planned) || []).forEach(e => { if(e.type !== "line" && sameWell(e.name, name)) planned = e; });
  });
  if(removed) return `<span class="well-cat well-cat-removed">Removed${removed.date ? " " + escapeHtml(fmtShortDate(removed.date)) : ""}</span>`;
  if(planned) return `<span class="well-cat well-cat-obs">Removal planned${planned.date ? " " + escapeHtml(fmtShortDate(planned.date)) : ""}</span>`;
  return "";
}
function wellRowHtml(w){
  const name = w[0], field = w[1], cat = w[2], lat = w[3], lon = w[4];
  const catLabel = { obs:"Observation", plugged:"Plugged" };
  const fieldLabel = { winterfield:"Winterfield", cranberry:"Cranberry" };
  const mapsUrl = `https://www.google.com/maps/search/?api=1&query=${lat},${lon}`;
  const earthUrl = `https://earth.google.com/web/search/${lat},${lon}`;
  const chips = wellStatusChip(name) + (catLabel[cat] ? `<span class="well-cat well-cat-${cat}">${catLabel[cat]}</span>` : "");
  return `
  <div class="well-row">
    <div class="well-row-main">
      <div class="well-row-top">
        <span class="well-name">${highlight(name, query)}</span>
        <span class="well-fieldname">${fieldLabel[field]||field}</span>
      </div>
      <div class="well-coords">${lat.toFixed(6)}, ${lon.toFixed(6)}</div>
      ${chips ? `<div class="well-chips">${chips}</div>` : ""}
    </div>
    <div class="well-btn-row">
      <a class="well-open-btn" data-well="${escapeHtml(name)}" href="${mapsUrl}" target="_blank" rel="noopener">${iconPin} Maps</a>
      <a class="well-open-btn well-open-btn-earth" data-well="${escapeHtml(name)}" href="${earthUrl}" target="_blank" rel="noopener">${iconGlobe} Earth</a>
    </div>
  </div>`;
}

function wellResultsHtml(rawQuery){
  try{
    const q = (rawQuery||"").replace(/[^0-9]/g, "");
    if(!q){
      const recent = recentWells.map(n => WELLS.find(w => w[0] === n)).filter(Boolean);
      return `<p class="well-hint">Type a well number. You only need the digits.</p>` +
        (recent.length ? `<h3 class="ab-heading">Opened recently</h3>${recent.map(wellRowHtml).join("")}` : "");
    }
    const exact = [], startsWith = [], contains = [];
    WELLS.forEach(w => {
      const num = String(w[0]).replace(/^[A-Za-z]+-/,"");
      if(num === q) exact.push(w);
      else if(num.indexOf(q) === 0) startsWith.push(w);
      else if(num.indexOf(q) !== -1) contains.push(w);
    });
    const matchesArr = exact.concat(startsWith, contains).slice(0, 12);
    if(matchesArr.length === 0){
      return `<p class="well-hint">No well matches “${escapeHtml(q)}.”</p>`;
    }
    return matchesArr.map(wellRowHtml).join("");
  } catch(err){
    return `<p class="well-hint">Something went wrong searching wells: ${escapeHtml(String(err && err.message || err))}</p>`;
  }
}

// Fixed preset — the address itself can't be geocoded offline, so it's baked in once here.
const MISSDIG_HOME_BASE = { label: "7950 Partridge Ave (Home Base)", lat: 44.1015538, lon: -85.0576375 };

function wellAutocompleteMatches(raw){
  const q = (raw||"").trim().toUpperCase().replace(/\s+/g,"");
  if(!q || q.length < 1) return [];
  const exact = [], startsWith = [], contains = [];
  WELLS.forEach(w => {
    const num = w[0].replace(/^[A-Za-z]+-/,"");
    const full = w[0].toUpperCase();
    if(num === q || full === q) exact.push(w);
    else if(num.indexOf(q) === 0) startsWith.push(w);
    else if(num.indexOf(q) !== -1) contains.push(w);
  });
  return exact.concat(startsWith, contains).slice(0, 6);
}

function wellAutocompleteDropdownHtml(raw){
  const matches = wellAutocompleteMatches(raw);
  if(matches.length === 0) return "";
  const fieldLabel = { winterfield:"Winterfield", cranberry:"Cranberry" };
  return matches.map(w => `<button type="button" class="well-ac-item" data-action="well-ac-select" data-value="${escapeHtml(w[0])}">
    <span class="well-ac-name">${escapeHtml(w[0])}</span>
    <span class="well-ac-field">${fieldLabel[w[1]]||w[1]}</span>
  </button>`).join("");
}

function parseMissDigInput(raw){
  const trimmed = (raw||"").trim();
  if(!trimmed) return null;

  // Try well number lookup first (e.g. "208", "W-208", "w208")
  const upperCompact = trimmed.toUpperCase().replace(/\s+/g,"");
  const wellMatch = WELLS.find(w => {
    const wUpper = w[0].toUpperCase();
    return wUpper === upperCompact || wUpper === "W-"+upperCompact.replace(/^W-?/,"") || wUpper === "C-"+upperCompact.replace(/^C-?/,"");
  });
  if(wellMatch){
    return { label: wellMatch[0], lat: wellMatch[3], lon: wellMatch[4] };
  }

  // Try raw coordinates: two numbers separated by comma and/or whitespace
  const coordMatch = trimmed.match(/(-?\d+\.?\d*)\s*[,\s]\s*(-?\d+\.?\d*)/);
  if(coordMatch){
    const lat = parseFloat(coordMatch[1]), lon = parseFloat(coordMatch[2]);
    if(!isNaN(lat) && !isNaN(lon) && lat>=-90 && lat<=90 && lon>=-180 && lon<=180){
      return { label: `${lat.toFixed(5)}, ${lon.toFixed(5)}`, lat, lon };
    }
  }
  return null;
}

function haversineMiles(lat1, lon1, lat2, lon2){
  const R = 3958.8;
  const toRad = x => x * Math.PI / 180;
  const dLat = toRad(lat2-lat1), dLon = toRad(lon2-lon1);
  const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLon/2)**2;
  return 2 * R * Math.asin(Math.sqrt(a));
}

function nearestNeighborOrder(startLat, startLon, points){
  // points: [{id, lat, lon}, ...]; returns ordered array of the same point objects
  const remaining = points.slice();
  const order = [];
  let curLat = startLat, curLon = startLon;
  while(remaining.length){
    let bestIdx = 0, bestDist = Infinity;
    remaining.forEach((p,i) => {
      const d = haversineMiles(curLat, curLon, p.lat, p.lon);
      if(d < bestDist){ bestDist = d; bestIdx = i; }
    });
    const next = remaining.splice(bestIdx,1)[0];
    order.push(next);
    curLat = next.lat; curLon = next.lon;
  }
  return order;
}

// 2-opt: repeatedly checks pairs of legs in the route and reverses the segment
// between them if that's shorter overall. This is what catches routes that go
// closest-first without checking whether that creates a longer backtrack later —
// e.g. picking a very close stop first, only to have to drive back past it to
// reach something farther that would've been more sensible to hit on the way out.
function twoOptImprove(startLat, startLon, orderedPoints){
  if(orderedPoints.length < 3) return orderedPoints.slice();
  const anchor = { lat: startLat, lon: startLon };
  const route = [anchor].concat(orderedPoints);
  const n = route.length;
  const dist = (a,b) => haversineMiles(a.lat, a.lon, b.lat, b.lon);

  let improved = true, iterations = 0;
  while(improved && iterations < 300){
    improved = false;
    iterations++;
    for(let i=0; i<n-2; i++){
      for(let j=i+2; j<n-1; j++){
        const a = route[i], b = route[i+1], c = route[j], d = route[j+1];
        const before = dist(a,b) + dist(c,d);
        const after = dist(a,c) + dist(b,d);
        if(after < before - 1e-9){
          let lo = i+1, hi = j;
          while(lo < hi){ const t = route[lo]; route[lo] = route[hi]; route[hi] = t; lo++; hi--; }
          improved = true;
        }
      }
    }
  }
  return route.slice(1); // drop the anchor, which never moves from position 0
}

function computeNearestNeighborRoute(startLat, startLon, points){
  // points: [{id, lat, lon}, ...]; returns ordered array of ids, nearest-neighbor + 2-opt cleanup
  const nn = nearestNeighborOrder(startLat, startLon, points);
  const improved = twoOptImprove(startLat, startLon, nn);
  return improved.map(p => p.id);
}

function daysUntilExpiration(dateStr){
  if(!dateStr) return Infinity;
  const today = new Date(); today.setHours(0,0,0,0);
  const d = new Date(dateStr + "T00:00:00");
  if(isNaN(d.getTime())) return Infinity;
  return Math.round((d - today) / 86400000);
}

// How a ticket's expiry reads on its row: words and urgency, not a raw date.
function mdExpiryChip(e){
  if(!e.expDate) return "";
  const d = daysUntilExpiration(e.expDate);
  if(e.completed) return `<span class="md-exp">Expires ${escapeHtml(fmtShortDate(e.expDate))}</span>`;
  if(d < 0) return `<span class="md-exp md-exp-red">Expired ${whenText(d)}</span>`;
  if(d === 0) return `<span class="md-exp md-exp-red">Expires today</span>`;
  if(d <= 3) return `<span class="md-exp md-exp-amber">Expires ${whenText(d)}</span>`;
  return `<span class="md-exp">Expires ${escapeHtml(fmtShortDate(e.expDate))}</span>`;
}
function mdUrgencyClass(e){
  if(e.completed || !e.expDate) return "";
  const d = daysUntilExpiration(e.expDate);
  return d <= 0 ? "md-row-red" : d <= 3 ? "md-row-amber" : "";
}

function expirationBucket(dateStr){
  const days = daysUntilExpiration(dateStr);
  if(days <= 0) return 0;   // expired or due today
  if(days <= 3) return 1;   // expires within 3 days
  if(days <= 7) return 2;   // expires within a week
  return 3;                 // later, or no date set
}

function computeRoute(startLat, startLon, points, prioritizeExpiration){
  if(!prioritizeExpiration){
    return computeNearestNeighborRoute(startLat, startLon, points);
  }
  // Group into urgency tiers first, then route efficiently within each tier,
  // chaining from wherever the previous tier's route ended. Guarantees the
  // most urgent miss digs come first while still avoiding backtracking inside
  // each tier.
  const buckets = { 0:[], 1:[], 2:[], 3:[] };
  points.forEach(p => buckets[expirationBucket(p.expDate)].push(p));
  let order = [];
  let curLat = startLat, curLon = startLon;
  [0,1,2,3].forEach(b => {
    const group = buckets[b];
    if(group.length === 0) return;
    const ids = computeNearestNeighborRoute(curLat, curLon, group);
    order = order.concat(ids);
    const last = group.find(p => p.id === ids[ids.length-1]);
    curLat = last.lat; curLon = last.lon;
  });
  return order;
}

function planMissDigRoute(procId){
  const data = missDigData[procId];
  if(!data || data.entries.length === 0) return;
  const incomplete = data.entries.filter(e => !e.completed);
  if(incomplete.length === 0){ data.routeOrder = []; data.routeSource = null; saveMissDig(missDigData); render(); return; }
  const prioritize = !!data.prioritizeExpiration;

  function finish(startLat, startLon, status, label){
    let order = computeRoute(startLat, startLon, incomplete, prioritize);
    // "end" mode: the fixed point should be the LAST stop, not the first — so plan
    // the walk from it as usual, then reverse the resulting order. (Skipped when
    // prioritizing expiration, since reversing would flip urgent-first to urgent-last.)
    if(status === "manual" && data.manualStart && data.manualStart.mode === "end" && !prioritize){
      order = order.slice().reverse();
    }
    data.routeOrder = order;
    data.routeSource = { status: status, at: Date.now(), label: label || null, mode: (status === "manual" && data.manualStart) ? data.manualStart.mode : null };
    saveMissDig(missDigData);
    render();
  }

  // A manually entered start/end point always wins — no GPS/permissions needed at all.
  if(data.manualStart){
    finish(data.manualStart.lat, data.manualStart.lon, "manual", data.manualStart.label);
    return;
  }

  data.routeSource = { status: "planning" };
  saveMissDig(missDigData);
  render();

  if(navigator.geolocation){
    let done = false;
    const timer = setTimeout(() => {
      if(!done){ done = true; finish(incomplete[0].lat, incomplete[0].lon, "fallback-timeout"); }
    }, 4000);
    try{
      navigator.geolocation.getCurrentPosition(
        (pos) => { if(!done){ done = true; clearTimeout(timer); finish(pos.coords.latitude, pos.coords.longitude, "gps"); } },
        (err) => {
          if(!done){
            done = true; clearTimeout(timer);
            const reason = err && err.code === 1 ? "fallback-denied" : err && err.code === 3 ? "fallback-timeout" : "fallback-unavailable";
            finish(incomplete[0].lat, incomplete[0].lon, reason);
          }
        },
        { timeout: 4000, maximumAge: 60000 }
      );
    } catch(err){
      if(!done){ done = true; clearTimeout(timer); finish(incomplete[0].lat, incomplete[0].lon, "fallback-error"); }
    }
  } else {
    finish(incomplete[0].lat, incomplete[0].lon, "fallback-unsupported");
  }
}

function missDigSourceLabel(source){
  if(!source) return null;
  const manualVerb = source.mode === "end" ? "Ending at" : "Starting from";
  const map = {
    "planning": { text: "Locating you…", cls: "md-src-planning" },
    "gps": { text: "Routed from your current location", cls: "md-src-gps" },
    "manual": { text: `${manualVerb}${source.label ? ": " + source.label : ""}`, cls: "md-src-gps" },
    "fallback-denied": { text: "Location permission denied — started from the first miss dig added", cls: "md-src-warn" },
    "fallback-timeout": { text: "Location timed out — started from the first miss dig added", cls: "md-src-warn" },
    "fallback-unavailable": { text: "Location unavailable — started from the first miss dig added", cls: "md-src-warn" },
    "fallback-unsupported": { text: "Location not supported here — started from the first miss dig added", cls: "md-src-warn" },
    "fallback-error": { text: "Location error — started from the first miss dig added", cls: "md-src-warn" }
  };
  return map[source.status] || null;
}

  return `

    <div class="card-head" data-action="toggle" data-id="${proc.id}">

}

/* ---------------------------------------------------------------------
   ALARM LOOKUP — type a device tag or any word from the alarm text MRCS
   reads you, get the plain-language meaning and what to do.
------------------------------------------------------------------------ */
let alarmShowAll = false;       // transient UI state: full alarm list expanded
let alarmShowScenarios = false; // transient UI state: scenario library expanded
const TB_SEVERITY = {
  interlock: { label:"INTERLOCK", cls:"alarm-sev-interlock" },
  warn:      { label:"ALARM",     cls:"alarm-sev-warn" },
  fault:     { label:"INSTRUMENT FAULT", cls:"alarm-sev-fault" }
};

// A term like "pt-301" (has a dash) must sit at a word boundary, so it won't
// hit "dpt-301". Plain words ("high", "301", "close") still match as substrings.
function alarmTermHits(a, term){
  const hay = `${a.device} ${a.alarm} ${a.meaning} ${a.io}`.toLowerCase();
  if(term.includes("-")){
    const esc = term.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    return new RegExp(`(^|[^a-z0-9])${esc}`).test(hay);
  }
  return hay.includes(term);
}

/* ---- Active-alarm tray (what you're seeing on MRCS right now) ---- */
const ACTIVE_ALARMS_KEY = "fieldProcedures.activeAlarms.v1";
let activeAlarms = (function(){
  try{
    const keys = JSON.parse(localStorage.getItem(ACTIVE_ALARMS_KEY)) || [];
    return new Set(keys.map(k => TB_ALARMS.findIndex(a => a.key === k)).filter(i => i >= 0));
  } catch(e){ return new Set(); }

/* ---- Scenario matching ---- */
function condMatches(cond, a){
  const dOk = cond.d instanceof RegExp ? cond.d.test(a.device) : a.device === cond.d;
  if(!dOk) return false;
  const ks = Array.isArray(cond.k) ? cond.k : [cond.k];
  return ks.includes(a.kind);
}
function condHitsIn(cond, alarms){ return alarms.filter(a => condMatches(cond, a)); }

// Returns scenarios that apply to the given set of alarms, each with what it explains
// and what you'd also expect to see. Includes the dynamic "bad signal" rule.
function diagnose(alarms){
  const out = [];
  // Dynamic rule: same device has a FAULT plus a level/pressure reading alarm -> bad signal.
  const byDevice = {};
  alarms.forEach(a => { (byDevice[a.device] = byDevice[a.device] || []).push(a); });
  Object.keys(byDevice).forEach(dev => {
    const grp = byDevice[dev];
    const faults = grp.filter(a => a.kind === "fault");
    const readings = grp.filter(a => ["hi","hh","lo","ll","dev"].includes(a.kind));
    if(faults.length && readings.length){
      out.push({
        id:"sig-"+dev, severity:"instrument",
        title:`${dev}: bad signal, not a real reading`,
        likely:`${dev} is reporting a FAULT and a ${readings.map(r=>r.kind.toUpperCase()).join("/")} alarm at the same time. When a 4–20 mA signal fails it usually rails out of range, and the PLC reads that garbage as a high (or low) value AND flags it as invalid — both in the same scan. The reading alarm is a symptom of the fault, not real process pressure/level.`,
        confirm:["Did both fire at the same second on MRCS? That's the tell.","Look at the live value — pegged at full scale, 0, or frozen = bad signal","Check a local mechanical gauge / sight glass","For pressure: are the pumps even running?"],
        action:["Chase the signal: wiring at the transmitter head, junction box, terminals, loop power, the I/O channel","Once the signal is back the reading alarm should clear on its own","If the gauge ALSO reads high — then it's real; handle both"],
        explains: grp, expect: []
      });
    }
  });

  TB_SCENARIOS.forEach(s => {
    if(s.excludes && s.excludes.some(c => condHitsIn(c, alarms).length)) return;
    let ok = true; const explained = new Set();
    s.core.forEach(g => {
      const hits = []; g.any.forEach(c => condHitsIn(c, alarms).forEach(a => hits.push(a)));
      const uniq = [...new Set(hits)];
      if(uniq.length < (g.min || 1)) ok = false;
      uniq.forEach(a => explained.add(a));
    });
    if(!ok) return;
    const expect = [];
    (s.also||[]).forEach(c => {
      const hits = condHitsIn(c, alarms);
      if(hits.length) hits.forEach(a => explained.add(a)); else expect.push(c);
    });
    out.push(Object.assign({}, s, { explains:[...explained], expect }));
  });

  const sevRank = { safety:0, process:1, instrument:2 };
  out.sort((a,b) => (sevRank[a.severity]-sevRank[b.severity]) || (b.explains.length - a.explains.length));
  return out;
}

// Scenarios match groups of devices with a pattern. Show that group in plain tags,
// e.g. "CV-301/302" or "any BV", never the pattern itself.
function deviceGroupLabel(re){
  const src = re.source.replace(/^\^/, "").replace(/\$$/, "");
  if(/^[A-Z]+-$/.test(src)) return "any " + src.slice(0, -1);
  let m = src.match(/^([A-Z]+-)(\d*)\[(\d+)\]$/);          // CV-30[12]  -> CV-301/302
  if(m) return m[3].split("").map((d, i) => (i === 0 ? m[1] : "") + m[2] + d).join("/");
  m = src.match(/^([A-Z]+-)\(([\d|]+)\)$/);                 // BV-(308|310) -> BV-308/310
  if(m) return m[1] + m[2].split("|").join("/");
  return src.replace(/[\\()\[\]]/g, "").replace(/\|/g, "/");
}
function condLabel(c){
  const dev = c.d instanceof RegExp ? deviceGroupLabel(c.d) : c.d;
  const kindWords = { hi:"high", hh:"high high", lo:"low", ll:"low low", fault:"fault", dev:"deviation", pos:"position indication", ftc:"failed to close", fto:"failed to open", notopen:"not in open", notclosed:"not in closed", start:"failed to start", lt2open:"<2 open", forces:"forces active", battery:"battery" };
  const ks = (Array.isArray(c.k) ? c.k : [c.k]).map(k => kindWords[k] || k).join(" / ");
  return `${dev} ${ks}`;
}

const TB_SCN_SEV = {
  safety:     { label:"SAFETY",     cls:"alarm-sev-interlock" },
  process:    { label:"PROCESS",    cls:"alarm-sev-warn" },

};

  const rowSev = s.severity === "safety" ? "interlock" : s.severity === "process" ? "warn" : "fault";
  const explains = showExplains && s.explains && s.explains.length
    ? `<div class="scn-chips"><span class="scn-chips-label">Explains:</span>${s.explains.map(a => `<span class="scn-chip scn-chip-on">${escapeHtml(a.device)} · ${escapeHtml(shortKind(a))}</span>`).join("")}</div>` : "";
  const expect = showExplains && s.expect && s.expect.length
    ? `<div class="scn-chips"><span class="scn-chips-label">You'd also expect:</span>${s.expect.map(c => `<span class="scn-chip">${escapeHtml(condLabel(c))}</span>`).join("")}</div>` : "";
  const involves = !showExplains
    ? `<div class="scn-chips"><span class="scn-chips-label">Alarms involved:</span>${[...(s.core||[]).flatMap(g=>g.any), ...(s.also||[])].map(c => `<span class="scn-chip">${escapeHtml(condLabel(c))}</span>`).join("")}</div>` : "";
  return `

    <ol class="alarm-actions">${s.action.map(x => `<li>${highlight(x, query)}</li>`).join("")}</ol>
  </div>`;
}

function shortKind(a){
  const w = { hi:"HIGH", hh:"HIGH HIGH", lo:"LOW", ll:"LOW LOW", fault:"FAULT", dev:"DEVIATION", pos:"POS IND", ftc:"FAILED TO CLOSE", fto:"FAILED TO OPEN", notopen:"NOT OPEN", notclosed:"NOT CLOSED", start:"FAILED TO START", lt2open:"<2 OPEN", forces:"FORCES", battery:"BATTERY" };
  return w[a.kind] || a.kind;
}

  const unexplained = active.filter(a => !explainedSet.has(a.idx));
  const fab = showFab ? `<button class="scn-fab" data-action="alarm-goto-diag">${iconCrosshair}<span>${active.length} alarm${active.length===1?"":"s"} added · What's going on?</span><span class="scn-fab-arrow">↑</span></button>` : "";

  </div>
  ${results.length
    ? `<h3 class="ab-heading">${results.length === 1 ? "Most likely cause" : "Most likely causes, best match first"}</h3>
       ${results.map((r, i) => `<div class="scn-rank">${results.length > 1 ? `<span class="scn-rank-num">#${i+1}</span>` : ""}${scenarioCardHtml(r, true)}</div>`).join("")}`
    : `<p class="well-hint">No known pattern ties these together — treat each one on its own using the alarm entries below.</p>`}

function scenarioMatchesQuery(s, terms){
  const text = `${s.title} ${s.likely}`.toLowerCase();
  const conds = [...(s.core||[]).flatMap(g=>g.any), ...(s.also||[])];
  return terms.every(t => {
    if(text.includes(t)) return true;
    const T = t.toUpperCase();
    return conds.some(c => c.d instanceof RegExp ? c.d.test(T) : c.d.toUpperCase() === T || c.d.toUpperCase().includes(T));
  });
}

function alarmResultsHtml(rawQuery){
  try{
    const q = (rawQuery||"").trim().toLowerCase();
    const order = { interlock:0, warn:1, fault:2 };

    if(!q){
      // Empty search: interlock table always visible, plus two independent expandable sections.
      const scnSection = alarmShowScenarios
        ? `<div class="alarm-sec">
             <button class="alarm-sec-head" data-action="alarm-toggle-scenarios"><span>Known scenarios (${TB_SCENARIOS.length})</span><span class="alarm-sec-hide">Hide</span></button>
             ${TB_SCENARIOS.map(s => scenarioCardHtml(s, false)).join("")}
           </div>`
        : `<button class="ab-add-btn" data-action="alarm-toggle-scenarios">Browse all ${TB_SCENARIOS.length} known scenarios</button>`;
      const allSorted = TB_ALARMS.slice().sort((a,b) => order[a.severity]-order[b.severity]);
      const allSection = alarmShowAll
        ? `<div class="alarm-sec">
             <button class="alarm-sec-head" data-action="alarm-toggle-all"><span>All alarms (${TB_ALARMS.length})</span><span class="alarm-sec-hide">Hide</span></button>
             ${allSorted.map(alarmCardHtml).join("")}
           </div>`
        : `<button class="ab-add-btn" data-action="alarm-toggle-all">Show all ${TB_ALARMS.length} alarms</button>`;
      return `
      <p class="well-hint">Type the device tag (e.g. <b>LT-304</b>, <b>BV-310</b>) or any words from the alarm MRCS reads you (e.g. <b>failed to close</b>, <b>high high</b>).</p>
      <h3 class="ab-heading">Interlocks — what trips what</h3>
      <div class="alarm-interlocks">
        ${TB_INTERLOCKS.map(i => `
        <div class="alarm-il-row">
          <div class="alarm-il-cause">${highlight(i.cause, query)}</div>
          <div class="alarm-il-result">${highlight(i.result, query)}</div>
        </div>`).join("")}
        <p class="alarm-il-reset">${iconWarn} ${escapeHtml(TB_INTERLOCK_RESET)}</p>
      </div>
      ${scnSection}
      ${allSection}`;
    }

    const terms = q.split(/\s+/).filter(Boolean);
    let list = TB_ALARMS.filter(a => terms.every(t => alarmTermHits(a, t)));
    const scenarios = TB_SCENARIOS.filter(s => scenarioMatchesQuery(s, terms));
    if(list.length === 0 && scenarios.length === 0){
      return `<p class="well-hint">No alarm matches “${escapeHtml(rawQuery.trim())}.” Try just the device tag (like <b>PT-302</b>) or one key word.</p>`;
    }
    // The device you searched for comes first; within that, interlocks before alarms before faults.
    const exact = a => a.device.toLowerCase() === q ? 0 : 1;
    list = list.slice().sort((a,b) => (exact(a)-exact(b)) || (order[a.severity]-order[b.severity]));
    const scnHtml = scenarios.length ? `<h3 class="ab-heading">Scenarios involving this</h3>${scenarios.map(s => scenarioCardHtml(s, false)).join("")}<h3 class="ab-heading">Alarms</h3>` : "";
    return `${scnHtml}${list.map(alarmCardHtml).join("")}`;
  } catch(err){
    return `<p class="well-hint">Something went wrong searching alarms: ${escapeHtml(String(err && err.message || err))}</p>`;
  }
}

    const mdAddToggle = e.target.closest('[data-action="md-add-toggle"]');

    const mdSubmit = e.target.closest('[data-action="md-submit"]');
    const mdRemove = e.target.closest('[data-action="md-remove"]');
    const mdToggleComplete = e.target.closest('[data-action="md-toggle-complete"]');
    const mdPlanRoute = e.target.closest('[data-action="md-plan-route"]');
    const mdReset = e.target.closest('[data-action="md-reset"]');
    const mdEditToggle = e.target.closest('[data-action="md-edit-toggle"]');
    const wellSearchReset = e.target.closest('[data-action="well-search-reset"]');

    if(wellSearchReset){

      const results = document.getElementById(`wellResults-${id}`);
      if(input) input.value = "";

    const alarmSearchReset = e.target.closest('[data-action="alarm-search-reset"]');

    const alarmTrack = e.target.closest('[data-action="alarm-track"]');
    const alarmUntrack = e.target.closest('[data-action="alarm-untrack"]');

    if(alarmGotoDiag){
      const card = alarmGotoDiag.closest(".card");
      const diag = card ? card.querySelector(".scn-diagnosis") : null;
      if(diag && diag.scrollIntoView) diag.scrollIntoView({ behavior:"smooth", block:"start" });
      return;
    }
    if(alarmSearchReset || alarmToggleAll || alarmToggleScn || alarmTrack || alarmUntrack || alarmClearActive){
      const card = e.target.closest(".card");
      const input = card ? card.querySelector(".well-input") : null;
      const results = card ? card.querySelector(".well-results") : null;
      const diag = card ? card.querySelector(".scn-diagnosis") : null;
      const beforeAlarms = (alarmSearchReset || alarmClearActive) && activeAlarms.size ? takeSnapshot() : null;
      if(alarmSearchReset){ alarmShowAll = false; alarmShowScenarios = false; activeAlarms.clear(); saveActiveAlarms(); if(input) input.value = ""; }
      if(alarmToggleAll) alarmShowAll = !alarmShowAll;
      if(alarmToggleScn) alarmShowScenarios = !alarmShowScenarios;
      if(alarmTrack){ const i = +alarmTrack.dataset.idx; activeAlarms.has(i) ? activeAlarms.delete(i) : activeAlarms.add(i); saveActiveAlarms(); }
      if(alarmUntrack){ activeAlarms.delete(+alarmUntrack.dataset.idx); saveActiveAlarms(); }
      if(alarmClearActive){ activeAlarms.clear(); saveActiveAlarms(); }
      if(diag) diag.innerHTML = alarmDiagnosisHtml(true);
      if(results) results.innerHTML = alarmResultsHtml(input ? input.value : "");
      if((alarmToggleScn || alarmToggleAll) && results){
        const el = results.querySelector(`[data-action="${alarmToggleScn ? "alarm-toggle-scenarios" : "alarm-toggle-all"}"]`);
        const nowOpen = alarmToggleScn ? alarmShowScenarios : alarmShowAll;
        if(el) el.scrollIntoView({ block: nowOpen ? "start" : "center" });
      }
      if(beforeAlarms){ undoSnapshot = beforeAlarms; showToast("Alarms cleared", true); }
      updateFabVisibility();
      // keep the card's status line in step with the tray
      const sub = card ? card.querySelector(".card-sub") : null;
      const aproc = PROCEDURES.find(p => p.type === "alarms");
      if(sub && aproc){ const st = cardStatus(aproc); sub.className = "card-sub " + (st.lamp ? "sub-" + st.lamp : ""); sub.innerHTML = cardSubInner(aproc); }
      return;
    }
    const mdEditCancel = e.target.closest('[data-action="md-edit-cancel"]');
    const mdEditSave = e.target.closest('[data-action="md-edit-save"]');

    if(mdEditToggle){
      missDigEditOpen[mdEditToggle.dataset.entry] = true;
      render();
      return;
    }
    if(mdEditCancel){
      missDigEditOpen[mdEditCancel.dataset.entry] = false;
      render();
      return;
    }
    if(mdEditSave){
      const id = mdEditSave.dataset.id, entryId = mdEditSave.dataset.entry;
      const row = mdEditSave.closest(".md-row-editing");

      const valueInput = row.querySelector(".md-edit-value");
      const expInput = row.querySelector(".md-edit-exp");
      const parsed = parseMissDigInput(valueInput.value);
      if(!parsed){
        valueInput.focus();
        valueInput.style.borderColor = "var(--red)";
        return;
      }
      const d = missDigData[id];
      if(d){
        const entry = d.entries.find(en => en.id === entryId);
        if(entry){
          entry.ticketNumber = (ticketInput.value||"").trim();
          entry.label = parsed.label;
          entry.lat = parsed.lat;
          entry.lon = parsed.lon;
          entry.expDate = expInput.value || "";
          saveMissDig(missDigData);
        }
      }
      missDigEditOpen[entryId] = false;
      // location may have changed — refresh the route if one already exists
      if(d && d.routeOrder && d.routeOrder.length > 0){
        planMissDigRoute(id);
      } else {
        render();
      }
      return;
    }
    const mdStartToggle = e.target.closest('[data-action="md-start-toggle"]');
    const mdStartCancel = e.target.closest('[data-action="md-start-cancel"]');
    const mdStartSubmit = e.target.closest('[data-action="md-start-submit"]');
    const mdStartClear = e.target.closest('[data-action="md-start-clear"]');
    const mdStartHomebase = e.target.closest('[data-action="md-start-homebase"]');
    const mdStartUserLoc = e.target.closest('[data-action="md-start-userloc"]');

    if(mdStartUserLoc){
      const id = mdStartUserLoc.dataset.id;
      if(!navigator.geolocation){
        missDigLocStatus[id] = "unsupported";
        render();
        return;
      }
      missDigLocStatus[id] = "locating";
      render();
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          const lat = pos.coords.latitude, lon = pos.coords.longitude;
          missDigData[id] = missDigData[id] || { entries: [], routeOrder: [] };
          missDigData[id].manualStart = { label: `Current location (${lat.toFixed(4)}, ${lon.toFixed(4)})`, lat, lon, mode: "start" };
          missDigLocStatus[id] = null;
          saveMissDig(missDigData);
          if(missDigData[id].routeOrder && missDigData[id].routeOrder.length > 0){
            planMissDigRoute(id);
          } else {
            render();
          }
        },
        (err) => {
          missDigLocStatus[id] = err && err.code === 1 ? "denied" : err && err.code === 3 ? "timeout" : "unavailable";
          render();
        },
        { timeout: 8000, maximumAge: 0 }
      );
      return;
    }
    const mdStartModeToggle = e.target.closest('[data-action="md-start-mode-toggle"]');
    const mdPriorityToggle = e.target.closest('[data-action="md-priority-toggle"]');

    if(mdPriorityToggle){
      const id = mdPriorityToggle.dataset.id;
      missDigData[id] = missDigData[id] || { entries: [], routeOrder: [] };
      missDigData[id].prioritizeExpiration = !missDigData[id].prioritizeExpiration;
      saveMissDig(missDigData);
      if(missDigData[id].routeOrder && missDigData[id].routeOrder.length > 0){
        planMissDigRoute(id);
      } else {
        render();
      }
      return;
    }

    if(mdStartToggle){
      missDigStartFormOpen[mdStartToggle.dataset.id] = true;
      render();
      return;
    }
    if(mdStartCancel){
      missDigStartFormOpen[mdStartCancel.dataset.id] = false;
      render();
      return;
    }
    if(mdStartHomebase){
      const id = mdStartHomebase.dataset.id;
      missDigData[id] = missDigData[id] || { entries: [], routeOrder: [] };
      missDigData[id].manualStart = { label: MISSDIG_HOME_BASE.label, lat: MISSDIG_HOME_BASE.lat, lon: MISSDIG_HOME_BASE.lon, mode: "start" };
      missDigLocStatus[id] = null;
      saveMissDig(missDigData);
      if(missDigData[id].routeOrder && missDigData[id].routeOrder.length > 0){
        planMissDigRoute(id);
      } else {
        render();
      }
      return;
    }
    if(mdStartModeToggle){
      const id = mdStartModeToggle.dataset.id;
      const d = missDigData[id];
      if(d && d.manualStart){
        d.manualStart.mode = d.manualStart.mode === "end" ? "start" : "end";
        saveMissDig(missDigData);
        if(d.routeOrder && d.routeOrder.length > 0){
          planMissDigRoute(id);
        } else {
          render();
        }
      }
      return;
    }
    if(mdStartSubmit){
      const id = mdStartSubmit.dataset.id;
      const form = mdStartSubmit.closest(".md-add-form");
      const input = form.querySelector(".md-input-start");
      const parsed = parseMissDigInput(input.value);
      if(!parsed){
        input.focus();
        input.style.borderColor = "var(--red)";
        return;
      }
      const modeBtn = form.querySelector(".ab-toggle-btn.active");
      const mode = modeBtn ? modeBtn.dataset.value : "start";
      missDigData[id] = missDigData[id] || { entries: [], routeOrder: [] };
      missDigData[id].manualStart = { label: parsed.label, lat: parsed.lat, lon: parsed.lon, mode: mode };
      missDigLocStatus[id] = null;
      saveMissDig(missDigData);
      missDigStartFormOpen[id] = false;
      if(missDigData[id].routeOrder && missDigData[id].routeOrder.length > 0){
        planMissDigRoute(id);
      } else {
        render();
      }
      return;
    }
    if(mdStartClear){
      const id = mdStartClear.dataset.id;
      if(missDigData[id]) missDigData[id].manualStart = null;
      missDigLocStatus[id] = null;
      saveMissDig(missDigData);
      render();
      return;
    }

    if(mdAddToggle){
      missDigFormOpen[mdAddToggle.dataset.id] = true;
      render();
      return;
    }
    if(mdCancel){
      missDigFormOpen[mdCancel.dataset.id] = false;
      render();
      return;
    }
    if(mdSubmit){
      const id = mdSubmit.dataset.id;
      const form = mdSubmit.closest(".md-add-form");
      const ticketInput = form.querySelector(".md-input-ticket");
      const valueInput = form.querySelector(".md-input-value");
      const expInput = form.querySelector(".md-input-exp");
      const parsed = parseMissDigInput(valueInput.value);
      if(!parsed){
        valueInput.focus();
        valueInput.style.borderColor = "var(--red)";
        return;
      }
      missDigData[id] = missDigData[id] || { entries: [], routeOrder: [] };
      const entry = { id: newMdId(), ticketNumber: (ticketInput.value||"").trim(), label: parsed.label, lat: parsed.lat, lon: parsed.lon, expDate: expInput.value || "", completed: false };
      missDigData[id].entries.push(entry);
      saveMissDig(missDigData);
      missDigFormOpen[id] = false;
      // if a route already exists, fold the new entry straight into it
      if(missDigData[id].routeOrder && missDigData[id].routeOrder.length > 0){
        planMissDigRoute(id);
      } else {
        render();
      }
      return;
    }
    if(mdToggleComplete){
      const id = mdToggleComplete.dataset.id, entryId = mdToggleComplete.dataset.entry;
      const d = missDigData[id];
      if(d){
        const entry = d.entries.find(e => e.id === entryId);
        if(entry){
          entry.completed = !entry.completed;
          saveMissDig(missDigData);
          render();
        }
      }
      return;
    }
    if(mdRemove){
      const id = mdRemove.dataset.id, entryId = mdRemove.dataset.entry;
      const d = missDigData[id];
      if(d){
        withUndo("Ticket deleted", () => {
          d.entries = d.entries.filter(e => e.id !== entryId);
          if(d.routeOrder) d.routeOrder = d.routeOrder.filter(rid => rid !== entryId);
          saveMissDig(missDigData);
        });
        render();
      }
      return;
    }
    if(mdPlanRoute){
      planMissDigRoute(mdPlanRoute.dataset.id);
      return;
    }
    const mdOptsToggle = e.target.closest('[data-action="md-opts-toggle"]');
    if(mdOptsToggle){
      const pid = mdOptsToggle.dataset.id;
      const wasOpen = !!missDigOptionsOpen[pid] || !!missDigStartFormOpen[pid] || !!missDigLocStatus[pid];
      missDigOptionsOpen[pid] = !wasOpen;
      if(wasOpen){ missDigStartFormOpen[pid] = false; missDigLocStatus[pid] = null; }
      render();
      return;
    }
    if(mdReset){
      withUndo("Miss Digs cleared", () => {
        missDigData[mdReset.dataset.id] = { entries: [], routeOrder: [], routeSource: null, manualStart: null, prioritizeExpiration: false };
        saveMissDig(missDigData);
      });
      render();
      return;
    }

    if(abToggleOpt){
      const group = abToggleOpt.closest('.ab-toggle-group');
      group.querySelectorAll('.ab-toggle-btn').forEach(b => b.classList.remove('active'));
      abToggleOpt.classList.add('active');
      return;
    }
    if(abAddToggle){
      const id = abAddToggle.dataset.id, section = abAddToggle.dataset.section;
      abandonFormOpen[abFormKey(id, section)] = true;
      render();
      return;
    }
    if(abCancel){
      const id = abCancel.dataset.id, section = abCancel.dataset.section;
      abandonFormOpen[abFormKey(id, section)] = false;
      render();
      return;
    }
    if(abSubmit){
      const id = abSubmit.dataset.id, section = abSubmit.dataset.section;
      const form = abSubmit.closest('.ab-add-form');
      const dateInput = form.querySelector('.ab-input-date');
      const date = dateInput ? dateInput.value : "";
      abandonData[id] = abandonData[id] || { removals:[], planned:[] };

      if(section === "removals"){
        const wellCheckbox = form.querySelector('.ab-removal-well-checkbox');
        const lineCheckbox = form.querySelector('.ab-removal-line-checkbox');
        const wellChecked = wellCheckbox && wellCheckbox.checked;
        const lineChecked = lineCheckbox && lineCheckbox.checked;

        const wellInput = form.querySelector('.ab-removal-well-input');
        const lineInput = form.querySelector('.ab-removal-line-input');
        const commentsInput = form.querySelector('.ab-input-comments');
        let wellName = wellChecked ? (wellInput.value||"").trim() : "";
        let lineName = lineChecked ? (lineInput.value||"").trim() : "";
        const comments = commentsInput ? (commentsInput.value||"").trim() : "";
        // No line number given, but there's a well number — assume it's this well's own line.
        if(lineChecked && !lineName && wellName){
          lineName = wellName;
        }
        // Nothing at all was actually entered — nudge toward the first relevant field rather than erroring.
        if(!wellName && !lineName && !comments){
          if(wellChecked) wellInput.focus();
          else if(lineChecked) lineInput.focus();
          else commentsInput.focus();
          return;
        }

        const statusBtn = form.querySelector('.ab-removal-line-status .ab-toggle-btn.active');
        const lineStatus = lineChecked ? (statusBtn ? statusBtn.dataset.value : "removed") : null;
        abandonData[id].removals.push({
          id: newAbId(),
          wellName: wellName || null,
          lineName: lineName || null,
          lineStatus: lineStatus,
          date,
          comments
        });
      } else if(section === "planned"){
        const nameInput = form.querySelector('.ab-input-name');
        const name = (nameInput.value || "").trim();
        if(!name){ nameInput.focus(); return; }
        const activeBtn = form.querySelector('.ab-toggle-btn.active');
        const type = activeBtn ? activeBtn.dataset.value : "well";
        abandonData[id].planned.push({ id:newAbId(), name, type, date });
      }
      saveAbandon(abandonData);
      abandonFormOpen[abFormKey(id, section)] = false;
      render();
      return;
    }
    if(abRemove){
      const id = abRemove.dataset.id, section = abRemove.dataset.section, entryId = abRemove.dataset.entry;
      if(section === "removals"){
        abRemovalDeleteConfirm[entryId] = true;
        render();
        return;
      }
      if(abandonData[id] && abandonData[id][section]){
        withUndo("Planned abandonment deleted", () => {
          abandonData[id][section] = abandonData[id][section].filter(e => e.id !== entryId);
          saveAbandon(abandonData);
        });
        render();
      }
      return;
    }
    if(abRemoveConfirm){
      const id = abRemoveConfirm.dataset.id, section = abRemoveConfirm.dataset.section, entryId = abRemoveConfirm.dataset.entry;
      withUndo("Entry deleted", () => {
        if(abandonData[id] && abandonData[id][section]){
          abandonData[id][section] = abandonData[id][section].filter(e => e.id !== entryId);
          saveAbandon(abandonData);
        }
      });
      delete abRemovalDeleteConfirm[entryId];
      render();
      return;
    }
    if(abRemoveCancel){
      delete abRemovalDeleteConfirm[abRemoveCancel.dataset.entry];
      render();
      return;
    }
    if(abEditToggle){
      abRemovalEditOpen[abEditToggle.dataset.entry] = true;
      render();
      return;
    }
    if(abEditCancel){
      delete abRemovalEditOpen[abEditCancel.dataset.entry];
      render();
      return;
    }
    if(abEditSave){
      const id = abEditSave.dataset.id, entryId = abEditSave.dataset.entry;
      const row = abEditSave.closest('.ab-row-editing');
      const d = abandonData[id];
      const entry = d && d.removals.find(en => en.id === entryId);
      if(entry){
        const wellChecked = row.querySelector('.ab-edit-well-checkbox').checked;
        const lineChecked = row.querySelector('.ab-edit-line-checkbox').checked;
        const wellInput = row.querySelector('.ab-edit-well-input');
        const lineInput = row.querySelector('.ab-edit-line-input');
        const commentsInput = row.querySelector('.ab-edit-comments');
        const dateInput = row.querySelector('.ab-edit-date');
        let wellName = wellChecked ? (wellInput.value||"").trim() : "";
        let lineName = lineChecked ? (lineInput.value||"").trim() : "";
        const comments = commentsInput ? (commentsInput.value||"").trim() : "";
        const date = dateInput ? dateInput.value : "";
        if(lineChecked && !lineName && wellName) lineName = wellName;
        if(!wellName && !lineName && !comments){
          (wellChecked ? wellInput : lineChecked ? lineInput : commentsInput).focus();
          return;
        }
        const statusBtn = row.querySelector('.ab-edit-line-status .ab-toggle-btn.active');
        const lineStatus = lineChecked ? (statusBtn ? statusBtn.dataset.value : "removed") : null;
        entry.wellName = wellName || null;
        entry.lineName = lineName || null;
        entry.lineStatus = lineStatus;
        entry.date = date;
        entry.comments = comments;
        saveAbandon(abandonData);
      }
      delete abRemovalEditOpen[entryId];
      render();
      return;
    }
    if(abGraduate){
      const id = abGraduate.dataset.id, entryId = abGraduate.dataset.entry;
      const d = abandonData[id];
      if(d){
        const idx = d.planned.findIndex(e => e.id === entryId);
        if(idx !== -1){
          const entry = d.planned[idx];
          const today = localDateStr();
          withUndo(`${entry.name} marked abandoned`, () => {
            if(entry.type === "line"){
              d.removals.push({ id:newAbId(), wellName:null, lineName:entry.name, lineStatus:"removed", date:today });
            } else {
              d.removals.push({ id:newAbId(), wellName:entry.name, lineName:null, lineStatus:null, date:today });
            }
            d.planned.splice(idx,1);
            saveAbandon(abandonData);
          });
          render();
        }
      }
      return;
    }

    if(stepBtn){
      const id = stepBtn.dataset.id, idx = +stepBtn.dataset.idx;
      const proc = PROCEDURES.find(p => p.id === id);
      completed[id] = completed[id] || {};
      const nowDone = !completed[id][idx];
      completed[id][idx] = nowDone;
      saveCompleted(completed);
      if(nowDone && proc && proc.steps){
        const skipped = [];
        for(let i = 0; i < idx; i++) if(!completed[id][i]) skipped.push(i + 1);
        if(proc.steps.every((_, i) => completed[id][i])){
          lastDone[id] = new Date().toISOString();
          saveJson(LAST_DONE_KEY, lastDone);
          showToast(`${proc.title} finished`);
        } else if(skipped.length){
          // Valve procedures run in order — say so, but don't get in the way.
          showToast(skipped.length === 1 ? `Step ${skipped[0]} isn't checked yet` : `Steps ${skipped.join(", ")} aren't checked yet`);
        }
      }
      render();
      return;
    }
    if(pigBtn){
      const id = pigBtn.dataset.id, lineId = pigBtn.dataset.line, col = pigBtn.dataset.col;
      pigStatus[id] = pigStatus[id] || {};
      pigStatus[id][lineId] = pigStatus[id][lineId] || {};
      const cell = pigStatus[id][lineId];
      if(cell[col]){
        // Clearing a mark throws away its time — make that undoable.
        const pproc = PROCEDURES.find(p => p.id === id);
        const line = pproc && pproc.lines.find(l => l.id === lineId);
        const colDef = pproc && pproc.columns.find(c => c.key === col);
        withUndo(`${line ? line.label + " " + line.size : "Line"} ${colDef ? colDef.label.toLowerCase() : ""} ${cell[col]} cleared`, () => {
          delete cell[col];
          const anyLeft = Object.keys(pigStatus[id]).some(k => k !== "__started" && Object.keys(pigStatus[id][k] || {}).length);
          if(!anyLeft) delete pigStatus[id];
          savePig(pigStatus);
        });
      } else {
        cell[col] = new Date().toLocaleTimeString([], { hour:'2-digit', minute:'2-digit', hour12:false });
        if(!pigStatus[id].__started) pigStatus[id].__started = localDateStr();   // so old marks can't be mistaken for today's run
        savePig(pigStatus);
      }
      render();
      return;
    }
    if(resetBtn){
      const id = resetBtn.dataset.id;
      const proc = PROCEDURES.find(p => p.id === id);
      withUndo(`${proc ? proc.title : "Card"} cleared`, () => {
        delete completed[id];
        delete readsValues[id];
        delete pigStatus[id];
        saveCompleted(completed);
        saveReads(readsValues);
        savePig(pigStatus);
      });
      render();
      return;
    }
    if(toggle){
      // On the board a tap opens the card. Inside a card its header is just a title.
      if(!document.body.classList.contains("in-card")) openCard(toggle.dataset.id);
      return;
    }
  } catch(err){
    console.error("click handler error:", err);
  }
});

document.addEventListener("input", (e) => {
  try{
    const input = e.target.closest('[data-action="field-input"]');
    const wellInput = e.target.closest('[data-action="well-input"]');
    const abDate = e.target.closest('[data-action="ab-date"]');
    const wellAcInput = e.target.closest('.well-ac-input');

    if(wellAcInput){
      const wrap = wellAcInput.closest('.well-ac-wrap');
      const dropdown = wrap ? wrap.querySelector('.well-ac-dropdown') : null;
      if(dropdown) dropdown.innerHTML = wellAutocompleteDropdownHtml(wellAcInput.value);
      // don't return — fields like md-input-value still need their own handling below if any
    }

    if(abDate){
      const id = abDate.dataset.id, entryId = abDate.dataset.entry;
      const d = abandonData[id];
      if(d){
        const entry = d.planned.find(e => e.id === entryId);
        if(entry){
          entry.date = abDate.value;
          saveAbandon(abandonData);
        }
      }
      return;
    }
    if(wellInput){
      const id = wellInput.dataset.id;
      const results = document.getElementById(`wellResults-${id}`);
      if(results) results.innerHTML = wellResultsHtml(wellInput.value);
      return;
    }
    const alarmInput = e.target.closest('[data-action="alarm-input"]');
    if(alarmInput){
      const id = alarmInput.dataset.id;
      const results = document.getElementById(`alarmResults-${id}`);
      if(results) results.innerHTML = alarmResultsHtml(alarmInput.value);
      return;
    }
    if(!input) return;
    const id = input.dataset.id, idx = input.dataset.idx;
    readsValues[id] = readsValues[id] || {};
    readsValues[id][idx] = input.value;
    saveReads(readsValues);
    // update only the progress dots/count/footer without a full re-render, so focus isn't lost
    const card = input.closest(".card");
    const proc = PROCEDURES.find(p => p.id === id);
    const values = readsValues[id] || {};
    const total = proc.fields.length;
    const filledCount = proc.fields.filter((_,i)=> (values[i]||"").trim() !== "").length;
    card.querySelector(".progress-mini").innerHTML = `<b>${filledCount}</b>/${total}`;
    card.querySelectorAll(".progress-track i").forEach((el,i)=>{
      el.classList.toggle("done", !!(values[i]||"").trim());
    });
    card.querySelector(".footer-note").textContent = readsFooterNote(filledCount, total);
    const st = cardStatus(proc);
    const sub = card.querySelector(".card-sub");
    if(sub){ sub.className = "card-sub " + (st.lamp ? "sub-" + st.lamp : ""); sub.innerHTML = cardSubInner(proc); }
    card.querySelectorAll('[data-action="reads-save"], [data-action="reads-copy-current"]').forEach(b => { b.disabled = filledCount === 0; });
  } catch(err){
    console.error("input handler error:", err);
  }
});

document.addEventListener("keydown", (e) => {
  if((e.key === "Enter" || e.key === " ") && e.target && e.target.matches && e.target.matches('.tile .card-head')){
    e.preventDefault();
    openCard(e.target.dataset.id);
  }
});

document.addEventListener("change", (e) => {
  const fileInput = e.target.closest && e.target.closest('[data-action="backup-file"]');
  if(!fileInput) return;
  const file = fileInput.files && fileInput.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => { pendingRestore = parseBackupText(String(reader.result || "")); toolsMessage = ""; render(); };
  reader.onerror = () => { pendingRestore = { error:"That file couldn't be read." }; render(); };
  reader.readAsText(file);
});

document.getElementById("search").addEventListener("input", (e) => {
  try{
    query = e.target.value.trim();
    if(activeId){                     // searching always starts from the whole board
      setActive(null);
      try{ if(history.state && history.state.card) history.replaceState(null, ""); } catch(_){}
    }
    render();
    window.scrollTo(0, 0);
  } catch(err){
    console.error("search input error:", err);
  }
});

document.addEventListener("focusout", (e) => {
  const input = e.target.closest && e.target.closest('.well-ac-input');
  if(!input) return;
  const wrap = input.closest('.well-ac-wrap');
  const dropdown = wrap ? wrap.querySelector('.well-ac-dropdown') : null;
  if(!dropdown) return;
  // delay so a tap on a suggestion has time to register before we clear it
  setTimeout(() => { dropdown.innerHTML = ""; }, 200);
});


document.getElementById("buildStamp").textContent = "Version " + fmtShortDate(APP_BUILD) + ", build " + APP_REV;
render();
</script>
<script>
if("serviceWorker" in navigator){
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch((err) => {
      console.error("Service worker registration failed:", err);
    });
  });
}
</script>
