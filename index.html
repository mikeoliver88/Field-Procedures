<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Field Procedures — Valve Board</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#12161A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Field Ops">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<style>
  :root{
    --bg: #12161A;
    --panel: #1B2126;
    --panel-2: #20272D;
    --border: #2B333A;
    --text: #E7E4DC;
    --text-dim: #8E99A1;
    --amber: #E0A82E;
    --amber-dim: #6b5620;
    --red: #C8372E;
    --red-glow: rgba(200,55,46,0.45);
    --green: #3E8E52;
    --green-glow: rgba(62,142,82,0.4);
    --yellow: #E0A82E;
    --yellow-glow: rgba(224,168,46,0.45);
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Roboto Mono", monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1200px 600px at 50% -10%, #1a2128 0%, var(--bg) 55%);
    color:var(--text);
    font-family:var(--sans);
    min-height:100vh;
    padding-bottom:60px;
  }
  /* ---- header / rail ---- */
  header{
    position:sticky; top:0; z-index:20;
    background:linear-gradient(180deg, #10151A 0%, #10151Ae0 85%, transparent);
    backdrop-filter: blur(6px);
    border-bottom:1px solid var(--border);
    padding:18px 18px 14px;
  }
  .brand{
    display:flex; align-items:center; gap:10px;
    margin-bottom:14px;
  }
  .brand .dot{
    width:10px;height:10px;border-radius:50%;
    background:var(--amber);
    box-shadow:0 0 10px 2px var(--yellow-glow);
    flex-shrink:0;
  }
  .brand h1{
    font-family:var(--mono);
    font-size:13px;
    letter-spacing:.18em;
    text-transform:uppercase;
    color:var(--text-dim);
    margin:0;
    font-weight:600;
  }
  .brand h1 b{color:var(--text); font-weight:700;}

  .search-wrap{position:relative;}
  .search-wrap svg{
    position:absolute; left:14px; top:50%; transform:translateY(-50%);
    opacity:.55; pointer-events:none;
  }
  #search{
    width:100%;
    background:var(--panel);
    border:1px solid var(--border);
    color:var(--text);
    font-family:var(--sans);
    font-size:16px;
    padding:13px 14px 13px 42px;
    border-radius:10px;
    outline:none;
    transition:border-color .15s, box-shadow .15s;
  }
  #search::placeholder{color:var(--text-dim);}
  #search:focus{
    border-color:var(--amber);
    box-shadow:0 0 0 3px rgba(224,168,46,0.15);
  }
  .result-count{
    font-family:var(--mono);
    font-size:11px;
    color:var(--text-dim);
    letter-spacing:.05em;
    margin-top:8px;
    padding-left:2px;
  }

  main{max-width:720px; margin:0 auto; padding:18px;}

  /* ---- procedure card ---- */
  .card{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:12px;
    margin-bottom:14px;
    overflow:hidden;
  }
  .card-head{
    display:flex; align-items:center; gap:12px;
    padding:16px 16px;
    cursor:pointer;
    user-select:none;
  }
  .chevron{
    width:18px;height:18px;flex-shrink:0;
    color:var(--text-dim);
    transition:transform .2s ease;
  }
  .card.open .chevron{transform:rotate(90deg); color:var(--amber);}
  .card-title-wrap{flex:1; min-width:0;}
  .card-title{
    font-size:16.5px; font-weight:700; margin:0 0 4px;
    color:var(--text);
    letter-spacing:.01em;
  }
  .card-title mark{
    background:rgba(224,168,46,0.28);
    color:var(--text);
    border-radius:3px;
    padding:0 1px;
  }
  .tags{display:flex; gap:6px; flex-wrap:wrap;}
  .tag{
    font-family:var(--mono);
    font-size:10px;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:var(--text-dim);
    border:1px solid var(--border);
    border-radius:5px;
    padding:2px 6px;
  }
  .progress-mini{
    font-family:var(--mono);
    font-size:12px;
    color:var(--text-dim);
    text-align:right;
    flex-shrink:0;
    min-width:52px;
  }
  .progress-mini b{color:var(--text);}

  .progress-track{
    height:3px; width:100%;
    background:var(--border);
    display:flex; gap:2px;
  }
  .progress-track i{
    flex:1; background:transparent; border-radius:1px;
    transition:background .2s;
  }
  .progress-track i.done{background:var(--amber);}

  .card-body{
    max-height:0;
    overflow:hidden;
    transition:max-height .25s ease;
  }
  .card.open .card-body{max-height:4000px;}

  .body-inner{padding:6px 16px 18px;}

  .notify-line{
    display:flex; gap:10px; align-items:flex-start;
    padding:12px 12px;
    margin:8px 0 14px;
    background:rgba(224,168,46,0.08);
    border:1px solid var(--amber-dim);
    border-radius:8px;
    font-size:14px;
    line-height:1.4;
  }
  .notify-line svg{flex-shrink:0; margin-top:1px; color:var(--amber);}

  .step{
    display:flex; align-items:flex-start; gap:12px;
    padding:11px 4px;
    border-top:1px solid var(--border);
  }
  .step:first-of-type{border-top:none;}
  .step.done .step-text{color:var(--text-dim); text-decoration:line-through; text-decoration-color:var(--border);}

  .check{
    width:22px; height:22px; flex-shrink:0; margin-top:1px;
    border-radius:50%;
    border:2px solid var(--border);
    background:transparent;
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    transition:border-color .15s, background .15s;
    padding:0;
  }
  .check:hover{border-color:var(--amber);}
  .check svg{opacity:0; transition:opacity .12s; width:13px;height:13px;}
  .step.done .check{background:var(--amber); border-color:var(--amber);}
  .step.done .check svg{opacity:1; color:#12161A;}

  .step-main{flex:1; min-width:0;}
  .step-row{display:flex; align-items:flex-start; gap:8px; flex-wrap:wrap;}
  .step-text{font-size:14.5px; line-height:1.45;}
  .step-num{
    font-family:var(--mono); font-size:11px; color:var(--text-dim);
    margin-right:2px;
  }
  .bell-icon{
    display:inline-flex; vertical-align:-2px; margin-right:5px; color:var(--amber);
  }
  .bell-icon svg{width:13px;height:13px;}

  .badge{
    display:inline-flex; align-items:center; gap:5px;
    font-family:var(--mono); font-size:10.5px; letter-spacing:.05em;
    text-transform:uppercase; font-weight:700;
    padding:3px 8px; border-radius:20px;
    white-space:nowrap;
    margin-top:2px;
  }
  .badge .lamp{width:7px;height:7px;border-radius:50%;}
  .badge.open{background:rgba(200,55,46,0.14); color:#ff8a80; border:1px solid rgba(200,55,46,0.4);}
  .badge.open .lamp{background:var(--red); box-shadow:0 0 6px 1px var(--red-glow);}
  .badge.closed{background:rgba(62,142,82,0.14); color:#8ee6a2; border:1px solid rgba(62,142,82,0.4);}
  .badge.closed .lamp{background:var(--green); box-shadow:0 0 6px 1px var(--green-glow);}
  .badge.transition{background:rgba(224,168,46,0.14); color:#ffd77a; border:1px solid rgba(224,168,46,0.4);}
  .badge.transition .lamp{background:var(--yellow); box-shadow:0 0 6px 1px var(--yellow-glow); animation:pulse 1.4s infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.35;}}

  .warning{
    display:flex; gap:8px; align-items:flex-start;
    font-size:12.5px; color:#ffd77a;
    background:rgba(224,168,46,0.06);
    border-left:2px solid var(--amber);
    padding:8px 10px; margin-top:8px; border-radius:0 6px 6px 0;
    line-height:1.4;
  }
  .warning svg{flex-shrink:0; margin-top:1px;}

  .card-footer{
    display:flex; justify-content:space-between; align-items:center;
    padding-top:14px; margin-top:6px; border-top:1px solid var(--border);
  }
  .footer-note{font-size:11.5px; color:var(--text-dim); font-family:var(--mono);}
  .reset-btn{
    display:flex; align-items:center; gap:6px;
    background:transparent;
    border:1px solid var(--border);
    color:var(--text-dim);
    font-family:var(--sans);
    font-size:12.5px;
    padding:7px 12px;
    border-radius:7px;
    cursor:pointer;
    transition:border-color .15s, color .15s;
  }
  .reset-btn:hover{border-color:var(--amber); color:var(--amber);}
  .reset-btn svg{width:13px;height:13px;}

  .field-row{
    padding:14px 4px;
    border-top:1px solid var(--border);
  }
  .field-row:first-of-type{border-top:none;}
  .field-label{
    display:block;
    font-size:14.5px;
    font-weight:600;
    margin-bottom:8px;
    line-height:1.4;
  }
  .paren{
    display:inline-block;
    color:var(--amber);
    font-weight:700;
    background:rgba(224,168,46,0.12);
    border:1px solid rgba(224,168,46,0.35);
    border-radius:5px;
    padding:1px 7px;
    font-size:12.5px;
    letter-spacing:.02em;
  }
  .field-input{
    width:100%;
    background:var(--panel-2);
    border:1px solid var(--border);
    color:var(--text);
    font-family:var(--sans);
    font-size:16px;
    padding:11px 12px;
    border-radius:8px;
    outline:none;
    transition:border-color .15s, box-shadow .15s;
  }
  .field-input::placeholder{color:var(--text-dim);}
  .field-input:focus{
    border-color:var(--amber);
    box-shadow:0 0 0 3px rgba(224,168,46,0.15);
  }

  /* ---- pig in/out table ---- */
  .pig-body-inner{padding:6px 0 18px;}
  .pig-table-wrap{
    overflow-x:auto;
    -webkit-overflow-scrolling:touch;
    padding:0 16px;
  }
  .pig-table{
    border-collapse:collapse;
    width:100%;
    min-width:400px;
  }
  .pig-table thead th{
    position:sticky; top:0; z-index:2;
    background:var(--panel);
    font-family:var(--mono);
    font-size:10px;
    letter-spacing:.05em;
    text-transform:uppercase;
    color:var(--text-dim);
    font-weight:600;
    text-align:center;
    padding:8px 4px 10px;
    border-bottom:1px solid var(--border);
    white-space:nowrap;
  }
  .pig-line-col{
    position:sticky; left:0; z-index:1;
    background:var(--panel);
    text-align:left !important;
    padding-left:2px !important;
    min-width:84px;
  }
  .pig-table thead th.pig-line-col{z-index:3;}
  .pig-section-row td{
    background:var(--panel-2);
    padding:7px 10px;
    border-top:1px solid var(--border);
    border-bottom:1px solid var(--border);
    position:sticky; left:0;
  }
  .pig-section-row.new-group td{padding-top:12px;}
  .pig-group{
    display:block;
    font-family:var(--mono);
    font-size:10.5px;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:var(--amber);
    font-weight:700;
    margin-bottom:2px;
  }
  .pig-sub{
    font-family:var(--mono);
    font-size:10px;
    letter-spacing:.05em;
    text-transform:uppercase;
    color:var(--text-dim);
  }
  .pig-table tbody tr:not(.pig-section-row){border-top:1px solid var(--border);}
  .pig-line-label{font-size:13.5px; font-weight:700; white-space:nowrap;}
  .pig-size{font-family:var(--mono); font-size:11px; color:var(--text-dim); font-weight:500;}
  .pig-tag{
    display:block;
    font-family:var(--mono);
    font-size:9.5px;
    letter-spacing:.03em;
    color:var(--amber);
    background:rgba(224,168,46,0.12);
    border:1px solid rgba(224,168,46,0.3);
    border-radius:4px;
    padding:1px 5px;
    margin-top:3px;
    white-space:nowrap;
    width:fit-content;
  }
  .pig-cell{text-align:center; padding:8px 6px; vertical-align:middle;}
  .pig-bubble{
    width:24px; height:24px;
    border-radius:50%;
    border:2px solid var(--border);
    background:transparent;
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    padding:0; margin:0 auto;
    transition:border-color .15s, background .15s;
  }
  .pig-bubble:hover{border-color:var(--yellow);}
  .pig-bubble svg{width:12px;height:12px; color:#12161A;}
  .pig-bubble.filled{background:var(--yellow); border-color:var(--yellow);}
  .pig-time{
    font-family:var(--mono);
    font-size:9px;
    color:var(--text-dim);
    margin-top:3px;
    white-space:nowrap;
  }

  /* ---- well search ---- */
  .well-search-box{position:relative; margin:4px 0 12px;}
  .well-search-box svg{
    position:absolute; left:12px; top:50%; transform:translateY(-50%);
    opacity:.5; pointer-events:none;
  }
  .well-input{
    width:100%;
    background:var(--panel-2);
    border:1px solid var(--border);
    color:var(--text);
    font-family:var(--sans);
    font-size:16px;
    padding:11px 12px 11px 36px;
    border-radius:8px;
    outline:none;
    transition:border-color .15s, box-shadow .15s;
  }
  .well-input::placeholder{color:var(--text-dim);}
  .well-input:focus{
    border-color:var(--amber);
    box-shadow:0 0 0 3px rgba(224,168,46,0.15);
  }
  .well-hint{
    font-size:13px; color:var(--text-dim);
    padding:10px 2px; margin:0;
    line-height:1.5;
  }
  .well-row{
    padding:12px; margin-bottom:8px;
    background:var(--panel-2);
    border:1px solid var(--border);
    border-radius:9px;
  }
  .well-row-top{display:flex; align-items:center; justify-content:space-between; gap:8px;}
  .well-name{font-family:var(--mono); font-size:15px; font-weight:700;}
  .well-cat{
    font-family:var(--mono); font-size:9.5px; letter-spacing:.05em; text-transform:uppercase;
    font-weight:700; padding:2px 7px; border-radius:20px; white-space:nowrap;
  }
  .well-cat-active{background:rgba(62,142,82,0.14); color:#8ee6a2; border:1px solid rgba(62,142,82,0.4);}
  .well-cat-obs{background:rgba(224,168,46,0.14); color:#ffd77a; border:1px solid rgba(224,168,46,0.4);}
  .well-cat-plugged{background:rgba(142,153,161,0.14); color:var(--text-dim); border:1px solid var(--border);}
  .well-coords{
    font-family:var(--mono); font-size:12px; color:var(--text-dim);
    margin-top:6px;
  }
  .well-field{
    font-family:var(--mono); font-size:10.5px; color:var(--text-dim);
    letter-spacing:.04em; text-transform:uppercase;
    margin-top:5px;
  }
  .well-btn-row{display:flex; gap:8px; margin-top:10px; flex-wrap:wrap;}
  .well-open-btn{
    display:inline-flex; align-items:center; gap:6px;
    font-family:var(--sans); font-size:12.5px; font-weight:600;
    color:#12161A;
    background:var(--amber);
    padding:7px 12px;
    border-radius:7px;
    text-decoration:none;
  }
  .well-open-btn:active{opacity:.85;}
  .well-open-btn-earth{
    color:var(--text);
    background:var(--panel);
    border:1px solid var(--border);
  }

  /* ---- abandonment log ---- */
  .ab-section{margin-bottom:20px;}
  .ab-section:last-child{margin-bottom:4px;}
  .ab-heading{
    font-family:var(--mono);
    font-size:11px;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:var(--text-dim);
    font-weight:700;
    margin:0 0 10px;
    padding-bottom:8px;
    border-bottom:1px solid var(--border);
  }
  .ab-rows{margin-bottom:10px;}
  .ab-empty{
    font-size:13px; color:var(--text-dim);
    padding:4px 2px 10px; margin:0;
  }
  .ab-row{
    display:flex; align-items:flex-start; justify-content:space-between; gap:10px;
    background:var(--panel-2);
    border:1px solid var(--border);
    border-radius:8px;
    padding:10px 12px;
    margin-bottom:8px;
  }
  .ab-row-main{display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
  .ab-name{font-family:var(--mono); font-size:14px; font-weight:700;}
  .ab-date{font-family:var(--mono); font-size:11.5px; color:var(--text-dim);}
  .ab-tag{
    font-family:var(--mono); font-size:9.5px; letter-spacing:.05em; text-transform:uppercase;
    font-weight:700; padding:2px 7px; border-radius:20px; white-space:nowrap;
  }
  .ab-tag-abandoned{background:rgba(200,55,46,0.14); color:#ff8a80; border:1px solid rgba(200,55,46,0.4);}
  .ab-tag-left-in-place{background:rgba(142,153,161,0.14); color:var(--text-dim); border:1px solid var(--border);}
  .ab-tag-type{background:rgba(224,168,46,0.14); color:#ffd77a; border:1px solid rgba(224,168,46,0.4);}
  .ab-remove{
    flex-shrink:0;
    width:26px; height:26px;
    border-radius:50%;
    border:1px solid var(--border);
    background:transparent;
    color:var(--text-dim);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
  }
  .ab-remove:hover{border-color:var(--red); color:#ff8a80;}

  .ab-row-planned{flex-direction:column; align-items:stretch;}
  .ab-planned-controls{
    display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap;
    gap:10px; margin-top:10px; padding-top:10px;
    border-top:1px solid var(--border);
  }
  .ab-date-label{
    display:flex; align-items:center; gap:8px;
    font-family:var(--mono); font-size:11px; color:var(--text-dim);
    text-transform:uppercase; letter-spacing:.04em;
  }
  .ab-date-input{
    background:var(--panel);
    border:1px solid var(--border);
    color:var(--text);
    font-family:var(--sans);
    font-size:13px;
    padding:6px 8px;
    border-radius:6px;
    outline:none;
  }
  .ab-date-input:focus{border-color:var(--amber);}
  .ab-planned-btns{display:flex; align-items:center; gap:8px;}
  .ab-graduate-btn{
    display:flex; align-items:center; gap:6px;
    font-family:var(--sans); font-size:12px; font-weight:600;
    color:#12161A;
    background:var(--green);
    border:none;
    padding:6px 10px;
    border-radius:7px;
    cursor:pointer;
  }
  .ab-graduate-btn svg{width:11px;height:11px;}

  .ab-add-btn{
    display:flex; align-items:center; justify-content:center; gap:6px;
    width:100%;
    background:transparent;
    border:1px dashed var(--border);
    color:var(--text-dim);
    font-family:var(--sans); font-size:13px; font-weight:600;
    padding:10px;
    border-radius:8px;
    cursor:pointer;
    transition:border-color .15s, color .15s;
  }
  .ab-add-btn:hover{border-color:var(--amber); color:var(--amber);}
  .ab-add-form{
    background:var(--panel-2);
    border:1px solid var(--border);
    border-radius:9px;
    padding:12px;
  }
  .ab-input{
    width:100%;
    background:var(--panel);
    border:1px solid var(--border);
    color:var(--text);
    font-family:var(--sans);
    font-size:15px;
    padding:10px 11px;
    border-radius:7px;
    outline:none;
    margin-bottom:8px;
  }
  .ab-input:focus{border-color:var(--amber); box-shadow:0 0 0 3px rgba(224,168,46,0.15);}
  .ab-input-date{font-size:14px;}
  .ab-toggle-group{display:flex; gap:8px; margin-bottom:8px;}
  .ab-toggle-btn{
    flex:1;
    background:var(--panel);
    border:1px solid var(--border);
    color:var(--text-dim);
    font-family:var(--sans); font-size:12.5px; font-weight:600;
    padding:8px;
    border-radius:7px;
    cursor:pointer;
  }
  .ab-toggle-btn.active{
    background:rgba(224,168,46,0.14);
    border-color:var(--amber);
    color:var(--amber);
  }
  .ab-add-actions{display:flex; gap:8px; margin-top:2px;}
  .ab-submit-btn{
    flex:1;
    background:var(--amber);
    border:none;
    color:#12161A;
    font-family:var(--sans); font-size:13.5px; font-weight:700;
    padding:9px;
    border-radius:7px;
    cursor:pointer;
  }
  .ab-cancel-btn{
    background:transparent;
    border:1px solid var(--border);
    color:var(--text-dim);

function highlight(text, q){
  if(!q) return escapeHtml(text);
  const esc = escapeHtml(text);
  const escQ = escapeHtml(q).replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  return esc.replace(new RegExp(escQ,"ig"), m => `<mark>${m}</mark>`);
}
function escapeHtml(s){
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function matches(proc, q){
  if(!q) return true;
  let content;
  if(proc.type === "reads"){
    content = proc.fields.map(f => `${f.label} ${f.paren||""}`);
  } else if(proc.type === "pigging"){
    content = proc.lines.map(l => `${l.label} ${l.size} ${l.tag||""} ${PIG_SECTIONS[l.section].group} ${PIG_SECTIONS[l.section].sub}`);
  } else if(proc.type === "wellsearch"){
    content = WELLS.map(w => w[0]);
  } else if(proc.type === "abandonment"){
    const d = abandonData[proc.id] || { wells:[], lines:[], planned:[] };
    content = [
      ...d.wells.map(e => `${e.name} ${e.date||""}`),
      ...d.lines.map(e => `${e.name} ${e.status} ${e.date||""}`),
      ...d.planned.map(e => `${e.name} ${e.type} ${e.date||""}`)
    ];
  } else if(proc.type === "missdigs"){
    const d = missDigData[proc.id] || { entries:[] };
    content = d.entries.map(e => `${e.label} ${e.expDate||""}`);
  } else {
    content = proc.steps.map(s=>s.text);
  }
  const hay = [proc.title, ...(proc.keywords||[]), ...content].join(" ").toLowerCase();
  return hay.includes(q.toLowerCase());
}

function badgeHtml(step, isDone){
  if(step.type !== "valve" || !isDone) return "";
  const labelMap = { open:"Open", closed:"Closed", transition:"Transition" };
  return `<span class="badge ${step.state}"><span class="lamp"></span>${step.valve} · ${labelMap[step.state]}</span>`;
}

function render(){
  try{
    const main = document.getElementById("main");
    const filtered = PROCEDURES.filter(p => matches(p, query));

    document.getElementById("resultCount").textContent =
      query ? `${filtered.length} procedure${filtered.length===1?"":"s"} found` : `${PROCEDURES.length} procedure${PROCEDURES.length===1?"":"s"} loaded`;

    if(filtered.length === 0){
      main.innerHTML = `<div class="empty">${iconEmpty}<p>No procedures match “${escapeHtml(query)}.”</p></div>`;
      return;
    }

    main.innerHTML = filtered.map(proc => {
      try{
        const isOpen = !!openCards[proc.id];

        if(proc.type === "reads"){
          return renderReadsCard(proc, isOpen);
        }
        if(proc.type === "pigging"){
          return renderPiggingCard(proc, isOpen);
        }
        if(proc.type === "wellsearch"){
          return renderWellSearchCard(proc, isOpen);
        }
        if(proc.type === "abandonment"){
          return renderAbandonmentCard(proc, isOpen);
        }
        if(proc.type === "missdigs"){
          return renderMissDigsCard(proc, isOpen);
        }
        return renderChecklistCard(proc, isOpen);
      } catch(cardErr){
        console.error("card render error:", proc.id, cardErr);
        return `<div class="card open"><div class="body-inner"><p class="well-hint">Couldn't load "${escapeHtml(proc.title)}": ${escapeHtml(String(cardErr && cardErr.message || cardErr))}</p></div></div>`;
      }
    }).join("");
  } catch(err){
    console.error("render error:", err);
    const main = document.getElementById("main");
    if(main) main.innerHTML = `<div class="empty"><p>Something went wrong loading the board: ${escapeHtml(String(err && err.message || err))}</p></div>`;
  }
}

function renderPiggingCard(proc, isOpen){
    const status = pigStatus[proc.id] || {};
    const totalCells = proc.lines.length * proc.columns.length;
    let filledCells = 0;
    proc.lines.forEach(line => {
      const cell = status[line.id] || {};
      proc.columns.forEach(col => { if(cell[col.key]) filledCells++; });
    });

    let lastSection = null;
    const rowsHtml = proc.lines.map(line => {
      const meta = PIG_SECTIONS[line.section];
      let sectionHeadHtml = "";
      if(line.section !== lastSection){
        const groupChanged = !lastSection || PIG_SECTIONS[lastSection].group !== meta.group;
        sectionHeadHtml = `<tr class="pig-section-row ${groupChanged ? 'new-group' : ''}">
          <td colspan="${proc.columns.length+1}">
            ${groupChanged ? `<span class="pig-group">${escapeHtml(meta.group)}</span>` : ""}
            <span class="pig-sub">${escapeHtml(meta.sub)}</span>
          </td>
        </tr>`;
        lastSection = line.section;

      const cell = status[line.id] || {};
      const cellsHtml = proc.columns.map(col => {
        const val = cell[col.key];
        return `<td class="pig-cell">
          <button class="pig-bubble ${val ? 'filled' : ''}" data-action="pig-toggle" data-id="${proc.id}" data-line="${line.id}" data-col="${col.key}" aria-label="${line.label} ${line.size} ${col.label}">${val ? iconCheck : ""}</button>

      return `${sectionHeadHtml}

function wellResultsHtml(rawQuery){
  try{
    const q = (rawQuery||"").replace(/[^0-9]/g, "");
    if(!q){
      return `<p class="well-hint">Start typing a well number to find it — coordinates and a map link will show up here.</p>`;
    }
    const exact = [], startsWith = [], contains = [];
    WELLS.forEach(w => {
      const num = String(w[0]).replace(/^[A-Za-z]+-/,"");
      if(num === q) exact.push(w);
      else if(num.indexOf(q) === 0) startsWith.push(w);
      else if(num.indexOf(q) !== -1) contains.push(w);
    });
    const matchesArr = exact.concat(startsWith, contains).slice(0, 12);
    if(matchesArr.length === 0){
      return `<p class="well-hint">No well matches “${escapeHtml(q)}.”</p>`;
    }
    const catLabel = { active:"Active", obs:"Observation", plugged:"Plugged" };
    const fieldLabel = { winterfield:"Winterfield", cranberry:"Cranberry" };
    return matchesArr.map(w => {
      const name = w[0], field = w[1], cat = w[2], lat = w[3], lon = w[4];
      const mapsUrl = `https://www.google.com/maps/search/?api=1&query=${lat},${lon}`;
      const earthUrl = `https://earth.google.com/web/search/${lat},${lon}`;
      return `
      <div class="well-row">
        <div class="well-row-top">
          <span class="well-name">${highlight(name, query)}</span>
          <span class="well-cat well-cat-${cat}">${catLabel[cat]||cat}</span>
        </div>
        <div class="well-field">${fieldLabel[field]||field}</div>
        <div class="well-coords">${lat.toFixed(6)}, ${lon.toFixed(6)}</div>
        <div class="well-btn-row">
          <a class="well-open-btn" href="${mapsUrl}" target="_blank" rel="noopener">${iconPin} Maps</a>
          <a class="well-open-btn well-open-btn-earth" href="${earthUrl}" target="_blank" rel="noopener">${iconGlobe} Google Earth</a>
        </div>
      </div>`;
    }).join("");
  } catch(err){
    return `<p class="well-hint">Something went wrong searching wells: ${escapeHtml(String(err && err.message || err))}</p>`;
  }
}

// Fixed preset — the address itself can't be geocoded offline, so it's baked in once here.
const MISSDIG_HOME_BASE = { label: "7950 Partridge Ave (Home Base)", lat: 44.1015538, lon: -85.0576375 };

function parseMissDigInput(raw){
  const trimmed = (raw||"").trim();
  if(!trimmed) return null;

  // Try well number lookup first (e.g. "208", "W-208", "w208")
  const upperCompact = trimmed.toUpperCase().replace(/\s+/g,"");
  const wellMatch = WELLS.find(w => {
    const wUpper = w[0].toUpperCase();
    return wUpper === upperCompact || wUpper === "W-"+upperCompact.replace(/^W-?/,"") || wUpper === "C-"+upperCompact.replace(/^C-?/,"");
  });
  if(wellMatch){
    return { label: wellMatch[0], lat: wellMatch[3], lon: wellMatch[4] };
  }

  // Try raw coordinates: two numbers separated by comma and/or whitespace
  const coordMatch = trimmed.match(/(-?\d+\.?\d*)\s*[,\s]\s*(-?\d+\.?\d*)/);
  if(coordMatch){
    const lat = parseFloat(coordMatch[1]), lon = parseFloat(coordMatch[2]);
    if(!isNaN(lat) && !isNaN(lon) && lat>=-90 && lat<=90 && lon>=-180 && lon<=180){
      return { label: `${lat.toFixed(5)}, ${lon.toFixed(5)}`, lat, lon };
    }
  }
  return null;
}

function haversineMiles(lat1, lon1, lat2, lon2){
  const R = 3958.8;
  const toRad = x => x * Math.PI / 180;
  const dLat = toRad(lat2-lat1), dLon = toRad(lon2-lon1);
  const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLon/2)**2;
  return 2 * R * Math.asin(Math.sqrt(a));
}

function nearestNeighborOrder(startLat, startLon, points){
  // points: [{id, lat, lon}, ...]; returns ordered array of the same point objects
  const remaining = points.slice();
  const order = [];
  let curLat = startLat, curLon = startLon;
  while(remaining.length){
    let bestIdx = 0, bestDist = Infinity;
    remaining.forEach((p,i) => {
      const d = haversineMiles(curLat, curLon, p.lat, p.lon);
      if(d < bestDist){ bestDist = d; bestIdx = i; }
    });
    const next = remaining.splice(bestIdx,1)[0];
    order.push(next);
    curLat = next.lat; curLon = next.lon;
  }
  return order;
}

// 2-opt: repeatedly checks pairs of legs in the route and reverses the segment
// between them if that's shorter overall. This is what catches routes that go
// closest-first without checking whether that creates a longer backtrack later —
// e.g. picking a very close stop first, only to have to drive back past it to
// reach something farther that would've been more sensible to hit on the way out.
function twoOptImprove(startLat, startLon, orderedPoints){
  if(orderedPoints.length < 3) return orderedPoints.slice();
  const anchor = { lat: startLat, lon: startLon };
  const route = [anchor].concat(orderedPoints);
  const n = route.length;
  const dist = (a,b) => haversineMiles(a.lat, a.lon, b.lat, b.lon);

  let improved = true, iterations = 0;
  while(improved && iterations < 300){
    improved = false;
    iterations++;
    for(let i=0; i<n-2; i++){
      for(let j=i+2; j<n-1; j++){
        const a = route[i], b = route[i+1], c = route[j], d = route[j+1];
        const before = dist(a,b) + dist(c,d);
        const after = dist(a,c) + dist(b,d);
        if(after < before - 1e-9){
          let lo = i+1, hi = j;
          while(lo < hi){ const t = route[lo]; route[lo] = route[hi]; route[hi] = t; lo++; hi--; }
          improved = true;
        }
      }
    }
  }
  return route.slice(1); // drop the anchor, which never moves from position 0
}

function computeNearestNeighborRoute(startLat, startLon, points){
  // points: [{id, lat, lon}, ...]; returns ordered array of ids, nearest-neighbor + 2-opt cleanup
  const nn = nearestNeighborOrder(startLat, startLon, points);
  const improved = twoOptImprove(startLat, startLon, nn);
  return improved.map(p => p.id);
}

function daysUntilExpiration(dateStr){
  if(!dateStr) return Infinity;
  const today = new Date(); today.setHours(0,0,0,0);
  const d = new Date(dateStr + "T00:00:00");
  if(isNaN(d.getTime())) return Infinity;
  return Math.round((d - today) / 86400000);
}

function expirationBucket(dateStr){
  const days = daysUntilExpiration(dateStr);
  if(days <= 0) return 0;   // expired or due today
  if(days <= 3) return 1;   // expires within 3 days
  if(days <= 7) return 2;   // expires within a week
  return 3;                 // later, or no date set
}

function computeRoute(startLat, startLon, points, prioritizeExpiration){
  if(!prioritizeExpiration){
    return computeNearestNeighborRoute(startLat, startLon, points);
  }
  // Group into urgency tiers first, then route efficiently within each tier,
  // chaining from wherever the previous tier's route ended. Guarantees the
  // most urgent miss digs come first while still avoiding backtracking inside
  // each tier.
  const buckets = { 0:[], 1:[], 2:[], 3:[] };
  points.forEach(p => buckets[expirationBucket(p.expDate)].push(p));
  let order = [];
  let curLat = startLat, curLon = startLon;
  [0,1,2,3].forEach(b => {
    const group = buckets[b];
    if(group.length === 0) return;
    const ids = computeNearestNeighborRoute(curLat, curLon, group);
    order = order.concat(ids);
    const last = group.find(p => p.id === ids[ids.length-1]);
    curLat = last.lat; curLon = last.lon;
  });
  return order;
}

function planMissDigRoute(procId){
  const data = missDigData[procId];
  if(!data || data.entries.length === 0) return;
  const incomplete = data.entries.filter(e => !e.completed);
  if(incomplete.length === 0){ data.routeOrder = []; data.routeSource = null; saveMissDig(missDigData); render(); return; }
  const prioritize = !!data.prioritizeExpiration;

  function finish(startLat, startLon, status, label){
    let order = computeRoute(startLat, startLon, incomplete, prioritize);
    // "end" mode: the fixed point should be the LAST stop, not the first — so plan
    // the walk from it as usual, then reverse the resulting order. (Skipped when
    // prioritizing expiration, since reversing would flip urgent-first to urgent-last.)
    if(status === "manual" && data.manualStart && data.manualStart.mode === "end" && !prioritize){
      order = order.slice().reverse();
    }
    data.routeOrder = order;
    data.routeSource = { status: status, at: Date.now(), label: label || null, mode: (status === "manual" && data.manualStart) ? data.manualStart.mode : null };
    saveMissDig(missDigData);
    render();
  }

  // A manually entered start/end point always wins — no GPS/permissions needed at all.
  if(data.manualStart){
    finish(data.manualStart.lat, data.manualStart.lon, "manual", data.manualStart.label);
    return;
  }

  data.routeSource = { status: "planning" };
  saveMissDig(missDigData);
  render();

  if(navigator.geolocation){
    let done = false;
    const timer = setTimeout(() => {
      if(!done){ done = true; finish(incomplete[0].lat, incomplete[0].lon, "fallback-timeout"); }
    }, 4000);
    try{
      navigator.geolocation.getCurrentPosition(
        (pos) => { if(!done){ done = true; clearTimeout(timer); finish(pos.coords.latitude, pos.coords.longitude, "gps"); } },
        (err) => {
          if(!done){
            done = true; clearTimeout(timer);
            const reason = err && err.code === 1 ? "fallback-denied" : err && err.code === 3 ? "fallback-timeout" : "fallback-unavailable";
            finish(incomplete[0].lat, incomplete[0].lon, reason);
          }
        },
        { timeout: 4000, maximumAge: 60000 }
      );
    } catch(err){
      if(!done){ done = true; clearTimeout(timer); finish(incomplete[0].lat, incomplete[0].lon, "fallback-error"); }
    }
  } else {
    finish(incomplete[0].lat, incomplete[0].lon, "fallback-unsupported");
  }
}

function missDigSourceLabel(source){
  if(!source) return null;
  const manualVerb = source.mode === "end" ? "Ending at" : "Starting from";
  const map = {
    "planning": { text: "Locating you…", cls: "md-src-planning" },
    "gps": { text: "Routed from your current location", cls: "md-src-gps" },
    "manual": { text: `${manualVerb}${source.label ? ": " + source.label : ""}`, cls: "md-src-gps" },
    "fallback-denied": { text: "Location permission denied — started from the first miss dig added", cls: "md-src-warn" },
    "fallback-timeout": { text: "Location timed out — started from the first miss dig added", cls: "md-src-warn" },
    "fallback-unavailable": { text: "Location unavailable — started from the first miss dig added", cls: "md-src-warn" },
    "fallback-unsupported": { text: "Location not supported here — started from the first miss dig added", cls: "md-src-warn" },
    "fallback-error": { text: "Location error — started from the first miss dig added", cls: "md-src-warn" }
  };
  return map[source.status] || null;
}

    const mdPriorityToggle = e.target.closest('[data-action="md-priority-toggle"]');

    if(mdPriorityToggle){
      const id = mdPriorityToggle.dataset.id;
      missDigData[id] = missDigData[id] || { entries: [], routeOrder: [] };
      missDigData[id].prioritizeExpiration = !missDigData[id].prioritizeExpiration;
      saveMissDig(missDigData);
      if(missDigData[id].routeOrder && missDigData[id].routeOrder.length > 0){
        planMissDigRoute(id);
      } else {
        render();
      }
      return;
    }

    if(mdStartToggle){
      missDigStartFormOpen[mdStartToggle.dataset.id] = true;
      render();
      return;
    }
    if(mdStartCancel){
      missDigStartFormOpen[mdStartCancel.dataset.id] = false;
      render();
      return;
    }
    if(mdStartHomebase){
      const id = mdStartHomebase.dataset.id;
      missDigData[id] = missDigData[id] || { entries: [], routeOrder: [] };
      missDigData[id].manualStart = { label: MISSDIG_HOME_BASE.label, lat: MISSDIG_HOME_BASE.lat, lon: MISSDIG_HOME_BASE.lon, mode: "start" };
      saveMissDig(missDigData);
      if(missDigData[id].routeOrder && missDigData[id].routeOrder.length > 0){
        planMissDigRoute(id);
      } else {
        render();
      }
      return;
    }
    if(mdStartModeToggle){
      const id = mdStartModeToggle.dataset.id;
      const d = missDigData[id];
      if(d && d.manualStart){
        d.manualStart.mode = d.manualStart.mode === "end" ? "start" : "end";
        saveMissDig(missDigData);
        if(d.routeOrder && d.routeOrder.length > 0){
          planMissDigRoute(id);
        } else {
          render();
        }
      }
      return;
    }
    if(mdStartSubmit){
      const id = mdStartSubmit.dataset.id;
      const form = mdStartSubmit.closest(".md-add-form");
      const input = form.querySelector(".md-input-start");
      const parsed = parseMissDigInput(input.value);
      if(!parsed){
        input.focus();
        input.style.borderColor = "var(--red)";
        return;
      }
      const modeBtn = form.querySelector(".ab-toggle-btn.active");
      const mode = modeBtn ? modeBtn.dataset.value : "start";
      missDigData[id] = missDigData[id] || { entries: [], routeOrder: [] };
      missDigData[id].manualStart = { label: parsed.label, lat: parsed.lat, lon: parsed.lon, mode: mode };
      saveMissDig(missDigData);
      missDigStartFormOpen[id] = false;
      if(missDigData[id].routeOrder && missDigData[id].routeOrder.length > 0){
        planMissDigRoute(id);
      } else {
        render();
      }
      return;
    }
    if(mdStartClear){
      const id = mdStartClear.dataset.id;
      if(missDigData[id]) missDigData[id].manualStart = null;
      saveMissDig(missDigData);
      render();
      return;
    }

    if(mdAddToggle){
      missDigFormOpen[mdAddToggle.dataset.id] = true;
      render();
      return;
    }
    if(mdCancel){
      missDigFormOpen[mdCancel.dataset.id] = false;
      render();
      return;
    }
    if(mdSubmit){
      const id = mdSubmit.dataset.id;
      const form = mdSubmit.closest(".md-add-form");
      const ticketInput = form.querySelector(".md-input-ticket");
      const valueInput = form.querySelector(".md-input-value");
      const expInput = form.querySelector(".md-input-exp");
      const parsed = parseMissDigInput(valueInput.value);
      if(!parsed){
        valueInput.focus();
        valueInput.style.borderColor = "var(--red)";
        return;
      }
      missDigData[id] = missDigData[id] || { entries: [], routeOrder: [] };
      const entry = { id: newMdId(), ticketNumber: (ticketInput.value||"").trim(), label: parsed.label, lat: parsed.lat, lon: parsed.lon, expDate: expInput.value || "", completed: false };
      missDigData[id].entries.push(entry);
      saveMissDig(missDigData);
      missDigFormOpen[id] = false;
      // if a route already exists, fold the new entry straight into it
      if(missDigData[id].routeOrder && missDigData[id].routeOrder.length > 0){
        planMissDigRoute(id);
      } else {
        render();
      }
      return;
    }
    if(mdToggleComplete){
      const id = mdToggleComplete.dataset.id, entryId = mdToggleComplete.dataset.entry;
      const d = missDigData[id];
      if(d){
        const entry = d.entries.find(e => e.id === entryId);
        if(entry){
          entry.completed = !entry.completed;
          saveMissDig(missDigData);
          render();
        }
      }
      return;
    }
    if(mdRemove){
      const id = mdRemove.dataset.id, entryId = mdRemove.dataset.entry;
      const d = missDigData[id];
      if(d){
        d.entries = d.entries.filter(e => e.id !== entryId);
        if(d.routeOrder) d.routeOrder = d.routeOrder.filter(rid => rid !== entryId);
        saveMissDig(missDigData);
        render();
      }
      return;
    }
    if(mdPlanRoute){
      planMissDigRoute(mdPlanRoute.dataset.id);
      return;
    }
    if(mdReset){
      missDigData[mdReset.dataset.id] = { entries: [], routeOrder: [], routeSource: null, manualStart: null, prioritizeExpiration: false };
      saveMissDig(missDigData);
      render();
      return;
    }

    if(abToggleOpt){
      const group = abToggleOpt.closest('.ab-toggle-group');
      group.querySelectorAll('.ab-toggle-btn').forEach(b => b.classList.remove('active'));
      abToggleOpt.classList.add('active');
      return;
    }
    if(abAddToggle){
      const id = abAddToggle.dataset.id, section = abAddToggle.dataset.section;
      abandonFormOpen[abFormKey(id, section)] = true;
      render();
      return;
    }
    if(abCancel){
      const id = abCancel.dataset.id, section = abCancel.dataset.section;
      abandonFormOpen[abFormKey(id, section)] = false;
      render();
      return;
    }
    if(abSubmit){
      const id = abSubmit.dataset.id, section = abSubmit.dataset.section;
      const form = abSubmit.closest('.ab-add-form');
      const nameInput = form.querySelector('.ab-input-name');
      const dateInput = form.querySelector('.ab-input-date');
      const name = (nameInput.value || "").trim();
      if(!name){ nameInput.focus(); return; }
      const date = dateInput ? dateInput.value : "";
      abandonData[id] = abandonData[id] || { wells:[], lines:[], planned:[] };
      if(section === "wells"){
        abandonData[id].wells.push({ id:newAbId(), name, date });
      } else if(section === "lines"){
        const activeBtn = form.querySelector('.ab-toggle-btn.active');
        const status = activeBtn ? activeBtn.dataset.value : "abandoned";
        abandonData[id].lines.push({ id:newAbId(), name, status, date });
      } else if(section === "planned"){
        const activeBtn = form.querySelector('.ab-toggle-btn.active');
        const type = activeBtn ? activeBtn.dataset.value : "well";
        abandonData[id].planned.push({ id:newAbId(), name, type, date });
      }
      saveAbandon(abandonData);
      abandonFormOpen[abFormKey(id, section)] = false;
      render();
      return;
    }
    if(abRemove){
      const id = abRemove.dataset.id, section = abRemove.dataset.section, entryId = abRemove.dataset.entry;
      if(abandonData[id] && abandonData[id][section]){
        abandonData[id][section] = abandonData[id][section].filter(e => e.id !== entryId);
        saveAbandon(abandonData);
        render();
      }
      return;
    }
    if(abGraduate){
      const id = abGraduate.dataset.id, entryId = abGraduate.dataset.entry;
      const d = abandonData[id];
      if(d){
        const idx = d.planned.findIndex(e => e.id === entryId);
        if(idx !== -1){
          const entry = d.planned[idx];
          const today = new Date().toISOString().slice(0,10);
          if(entry.type === "line"){
            d.lines.push({ id:newAbId(), name:entry.name, status:"abandoned", date:today });
          } else {
            d.wells.push({ id:newAbId(), name:entry.name, date:today });
          }
          d.planned.splice(idx,1);
          saveAbandon(abandonData);
          render();
        }
      }
      return;
    }

    if(stepBtn){
      const id = stepBtn.dataset.id, idx = stepBtn.dataset.idx;
      completed[id] = completed[id] || {};
      completed[id][idx] = !completed[id][idx];
      saveCompleted(completed);
      render();
      return;
    }
    if(pigBtn){
      const id = pigBtn.dataset.id, lineId = pigBtn.dataset.line, col = pigBtn.dataset.col;
      pigStatus[id] = pigStatus[id] || {};
      pigStatus[id][lineId] = pigStatus[id][lineId] || {};
      const cell = pigStatus[id][lineId];
      if(cell[col]){
        delete cell[col];
      } else {
        cell[col] = new Date().toLocaleTimeString([], { hour:'2-digit', minute:'2-digit', hour12:false });
      }
      savePig(pigStatus);
      render();
      return;
    }
    if(resetBtn){
      const id = resetBtn.dataset.id;
      delete completed[id];
      delete readsValues[id];
      delete pigStatus[id];
      saveCompleted(completed);
      saveReads(readsValues);
      savePig(pigStatus);
      render();
      return;
    }
    if(toggle){
      const id = toggle.dataset.id;
      openCards[id] = !openCards[id];
      saveOpenCards(openCards);
      render();
      return;
    }
  } catch(err){
    console.error("click handler error:", err);
  }
});

document.addEventListener("input", (e) => {
  try{
    const input = e.target.closest('[data-action="field-input"]');
    const wellInput = e.target.closest('[data-action="well-input"]');
    const abDate = e.target.closest('[data-action="ab-date"]');

    if(abDate){
      const id = abDate.dataset.id, entryId = abDate.dataset.entry;
      const d = abandonData[id];
      if(d){
        const entry = d.planned.find(e => e.id === entryId);
        if(entry){
          entry.date = abDate.value;
          saveAbandon(abandonData);
        }
      }
      return;
    }
    if(wellInput){
      const id = wellInput.dataset.id;
      const results = document.getElementById(`wellResults-${id}`);
      if(results) results.innerHTML = wellResultsHtml(wellInput.value);
      return;
    }
    if(!input) return;
    const id = input.dataset.id, idx = input.dataset.idx;
    readsValues[id] = readsValues[id] || {};
    readsValues[id][idx] = input.value;
    saveReads(readsValues);
    // update only the progress dots/count/footer without a full re-render, so focus isn't lost
    const card = input.closest(".card");
    const proc = PROCEDURES.find(p => p.id === id);
    const values = readsValues[id] || {};
    const total = proc.fields.length;
    const filledCount = proc.fields.filter((_,i)=> (values[i]||"").trim() !== "").length;
    card.querySelector(".progress-mini").innerHTML = `<b>${filledCount}</b>/${total}`;
    card.querySelectorAll(".progress-track i").forEach((el,i)=>{
      el.classList.toggle("done", !!(values[i]||"").trim());
    });
    card.querySelector(".footer-note").textContent = filledCount === total ? "All readings entered" : `${total - filledCount} reading${total-filledCount===1?'':'s'} remaining`;
  } catch(err){
    console.error("input handler error:", err);
  }
});

document.getElementById("search").addEventListener("input", (e) => {
  try{
    query = e.target.value.trim();
    render();
  } catch(err){
    console.error("search input error:", err);
  }
});

// Auto-open when there's only one procedure loaded, for convenience
if(PROCEDURES.length === 1){
  openCards[PROCEDURES[0].id] = true;
}

render();
</script>
<script>
if("serviceWorker" in navigator){
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch((err) => {
      console.error("Service worker registration failed:", err);
    });
  });
}
</script>
